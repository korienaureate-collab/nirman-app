<title>Nirman Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ============ TOKENS : light is the bare :root ============ */
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --surface-2:#F4F1EA; --surface-3:#EDE8DC;
  --ink:#1C1A16; --ink-2:#433F37; --muted:#6E695E; --faint:#918B7D;
  --line:#E2DDD1; --line-2:#CFC8B8; --hair:#EFEAE0;
  --accent:#8C4A1F; --accent-soft:#F3E4D8; --accent-ink:#FFFFFF;
  --slate:#2F5D62; --slate-soft:#DEEBEB;
  --good:#2E6B3E; --good-soft:#E1EFE3;
  --warn:#9A6B12; --warn-soft:#F6EBD3;
  --crit:#A03028; --crit-soft:#F7E1DE;
  --shadow:0 1px 2px rgba(28,26,22,.05), 0 8px 24px -12px rgba(28,26,22,.16);
  --shadow-lift:0 2px 4px rgba(28,26,22,.06), 0 18px 44px -16px rgba(28,26,22,.28);
  --rail:252px;
  --sans:"IBM Plex Sans","IBM Plex Sans Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14130F; --surface:#1C1A15; --surface-2:#232019; --surface-3:#2B2820;
    --ink:#EFEADE; --ink-2:#CFC8B8; --muted:#9A9384; --faint:#7A7466;
    --line:#332F27; --line-2:#443F35; --hair:#282419;
    --accent:#D98A54; --accent-soft:#3A2A1C; --accent-ink:#1B140D;
    --slate:#7FB3B6; --slate-soft:#1E2E2F;
    --good:#7BBE8C; --good-soft:#1B2A1F;
    --warn:#D9A94E; --warn-soft:#2E2515;
    --crit:#E08A80; --crit-soft:#2F1C1A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 44px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#14130F; --surface:#1C1A15; --surface-2:#232019; --surface-3:#2B2820;
  --ink:#EFEADE; --ink-2:#CFC8B8; --muted:#9A9384; --faint:#7A7466;
  --line:#332F27; --line-2:#443F35; --hair:#282419;
  --accent:#D98A54; --accent-soft:#3A2A1C; --accent-ink:#1B140D;
  --slate:#7FB3B6; --slate-soft:#1E2E2F;
  --good:#7BBE8C; --good-soft:#1B2A1F;
  --warn:#D9A94E; --warn-soft:#2E2515;
  --crit:#E08A80; --crit-soft:#2F1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 44px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--cond);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ SHELL ============ */
#app{display:flex;min-height:100vh}
#rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface-2);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.mark{width:34px;height:34px;flex:0 0 34px;border-radius:5px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.02em;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box}
.brand b{display:block;font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.055em;text-transform:uppercase;margin-top:3px}
nav{padding:10px 8px 20px;flex:1}
.navsec{font-family:var(--cond);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  padding:14px 10px 6px;font-weight:600}
.navsec:first-child{padding-top:4px}
.navi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border:0;background:none;
  border-radius:5px;cursor:pointer;color:var(--ink-2);font-size:13.5px;line-height:1.3}
.navi:hover{background:var(--surface-3);color:var(--ink)}
.navi.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.navi .ic{width:15px;flex:0 0 15px;opacity:.85;display:grid;place-items:center}
.navi .ic svg{width:15px;height:15px;stroke-width:1.7}
.navi .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--surface-3);color:var(--muted);
  padding:1px 5px;border-radius:20px}
.navi.on .bdg{background:rgba(255,255,255,.22);color:inherit}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#crumb{font-family:var(--cond);font-size:19px;font-weight:600}
#crumb em{font-style:normal;color:var(--muted);font-weight:500}
.ctx{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--line-2);border-radius:20px;
  background:var(--surface);color:var(--muted);white-space:nowrap}
#view{padding:22px 24px 80px;max-width:1500px;width:100%}

/* ============ PRIMITIVES ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:5px;border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.13s}
.btn:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.gh{border-color:transparent;background:none}
.btn.gh:hover{background:var(--surface-3);box-shadow:none}
.btn.dngr{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn.wa{background:#25D366;border-color:#25D366;color:#06301A}
.btn.wa:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card>header h3{font-size:14.5px;letter-spacing:.01em}
.card>header .sub{font-size:11.5px;color:var(--muted)}
.card .body{padding:16px}
.eyebrow{font-family:var(--cond);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.grid{display:grid;gap:14px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.sep{height:1px;background:var(--line);margin:18px 0}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px 14px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--stripe,var(--line-2))}
.tile .k{font-family:var(--cond);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--faint);margin-top:3px}
.tile.a{--stripe:var(--accent)} .tile.s{--stripe:var(--slate)} .tile.g{--stripe:var(--good)}
.tile.w{--stripe:var(--warn)} .tile.c{--stripe:var(--crit)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--cond);font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.c{background:var(--crit-soft);color:var(--crit)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.s{background:var(--slate-soft);color:var(--slate)}

/* tables */
.tw{overflow-x:auto;border-radius:0 0 8px 8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-family:var(--cond);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-weight:600;
  background:var(--surface);position:sticky;top:0;z-index:2}
table.t td{padding:8px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th.n{font-family:var(--cond)}
table.t td.mono{font-family:var(--mono);font-size:12px}
table.t tr.tot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:3px double var(--line-2);background:var(--surface-2)}
table.t tr.sub td{background:var(--surface-2);font-weight:600;font-family:var(--cond);letter-spacing:.03em}
table.t td.act{width:1%;white-space:nowrap;text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;font-family:var(--cond);font-size:15px;color:var(--ink-2);margin-bottom:5px}

/* forms */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-family:var(--cond);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:4px}
label.f>span i{color:var(--crit);font-style:normal}
.in{width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);font-size:13.5px}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:58px;resize:vertical}
.in[type=number],input.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.fg.two{grid-template-columns:1fr 1fr}
.chkline{display:flex;align-items:center;gap:7px;margin-bottom:11px;font-size:13.5px}
.chkline input{width:15px;height:15px;accent-color:var(--accent)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,18,14,.5);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lift);
  width:100%;max-width:640px;animation:pop .16s ease-out}
.modal.wide{max-width:1000px}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal>header h3{font-size:16px;flex:1}
.modal>.body{padding:18px;max-height:70vh;overflow-y:auto}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  background:var(--surface-2);border-radius:0 0 10px 10px}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{background:var(--surface-3);color:var(--ink)}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:6px;font-size:13px;box-shadow:var(--shadow-lift);animation:pop .16s}
.tst.bad{background:var(--crit);color:#fff}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 13px;cursor:pointer;font-family:var(--cond);font-size:13px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* document / print paper */
.paper{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:26px 30px;box-shadow:var(--shadow);
  max-width:860px;margin:0 auto;font-size:12.5px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:6px}
.paper .ph h2{font-size:19px;letter-spacing:-.01em}
.paper .ph .co{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.paper .ph .cohead-row{display:flex;gap:12px;align-items:flex-start}
.paper .ph .cologo{width:46px;height:46px;flex:0 0 46px;object-fit:contain;margin-top:2px}
.paper .dt{font-family:var(--cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;text-align:right}
.paper .dn{font-family:var(--mono);font-size:12px;margin-top:4px;text-align:right}
.paper table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}
.paper table th{font-family:var(--cond);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:left;
  padding:6px 8px;border-bottom:1px solid var(--ink-2);color:var(--ink-2)}
.paper table td{padding:6px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
.paper table td.n,.paper table th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.paper table tr.tot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink-2);font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin:12px 0}
.pf{border-top:1px solid var(--line);margin-top:6px;padding-top:5px}
.pf .k{font-family:var(--cond);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pf .v{font-size:12.5px}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:38px;text-align:center;font-size:11px;color:var(--muted)}
.sign div{border-top:1px solid var(--ink-2);padding-top:5px}
.words{background:var(--surface-2);border-left:3px solid var(--accent);padding:7px 11px;font-size:12px;margin:10px 0}

/* misc */
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;padding-top:2px}
.kv dd{margin:0}
.bar{height:6px;background:var(--surface-3);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}
.audit{font-family:var(--mono);font-size:11.5px}
.audit .op-C{color:var(--good)} .audit .op-U{color:var(--warn)} .audit .op-D{color:var(--crit)}
.warnbox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:6px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);display:flex;gap:9px}
.warnbox b{color:var(--warn)}
.dev{font-family:"IBM Plex Sans Devanagari",var(--sans)}

@media (max-width:960px){
  #rail{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lift)}
  #rail.open{transform:none}
  #burger{display:inline-flex!important}
  #view{padding:16px 14px 70px}
  #topbar{padding:10px 14px}
}
#burger{display:none}
@media print{
  #rail,#topbar,.noprint{display:none!important}
  #view{padding:0;max-width:none}
  body{background:#fff;color:#000}
  .paper{border:0;box-shadow:none;max-width:none;padding:0}
  @page{size:A4;margin:14mm}
}

/* ============ AI SCANNER STYLES ============ */
.ai-scanner-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:520px}
@media(max-width:960px){.ai-scanner-wrap{grid-template-columns:1fr}}
.ai-drop-zone{border:2px dashed var(--line-2);border-radius:10px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;cursor:pointer;transition:.18s;min-height:280px;position:relative;overflow:hidden}
.ai-drop-zone:hover,.ai-drop-zone.dragover{border-color:var(--accent);background:var(--accent-soft)}
.ai-drop-zone .ai-drop-icon{font-size:40px;margin-bottom:10px;opacity:.55}
.ai-drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ai-preview-img{max-width:100%;max-height:320px;border-radius:6px;box-shadow:var(--shadow);object-fit:contain}
.ai-preview-wrap{position:relative;text-align:center}
.ai-preview-remove{position:absolute;top:6px;right:6px;background:var(--crit);color:#fff;border:0;
  border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px;text-align:center}
.ai-field-row{display:grid;grid-template-columns:140px 1fr 64px;gap:6px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px}
.ai-field-row:last-child{border-bottom:0}
.ai-field-label{color:var(--muted);font-family:var(--cond);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:600}
.ai-field-val input,.ai-field-val select{width:100%;font:inherit;color:inherit;
  padding:4px 7px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:13px}
.ai-field-val input:focus,.ai-field-val select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft)}
.ai-conf{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
.ai-conf.hi{color:var(--good)} .ai-conf.med{color:var(--warn)} .ai-conf.lo{color:var(--crit)}
.ai-conf.unk{color:var(--faint)}
.ai-prog-step{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;color:var(--muted)}
.ai-prog-step.done{color:var(--good)} .ai-prog-step.active{color:var(--ink);font-weight:500}
.ai-prog-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:0 0 9px}
.ai-prog-step.done .ai-prog-dot{background:var(--good)}
.ai-prog-step.active .ai-prog-dot{background:var(--accent);animation:aipulse .9s infinite alternate}
@keyframes aipulse{from{opacity:.4}to{opacity:1}}
.ai-warn-banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:6px;padding:10px 13px;font-size:12.5px;margin:10px 0}
.ai-err-banner{background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 30%,transparent);
  border-radius:6px;padding:10px 13px;font-size:12.5px;margin:10px 0}
.ai-chat-bubble{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px;
  margin:6px 0;line-height:1.5}
.ai-chat-bubble.user{background:var(--accent-soft);text-align:right}
.ai-chat-box{display:flex;gap:8px;margin-top:8px}
.ai-chat-box input{flex:1;padding:6px 10px;border:1px solid var(--line-2);border-radius:5px;

'use strict';

/* ---------- number & date helpers ---------- */
const R2=n=>Math.round((Number(n)||0)*100)/100;
function fmtI(n,dp){ n=Number(n)||0; dp=dp===undefined?2:dp;
  const neg=n<0; n=Math.abs(n);
  let s=n.toFixed(dp), p=s.split('.'), x=p[0];
  let last3=x.slice(-3), rest=x.slice(0,-3);
  if(rest) last3=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+last3;
  return (neg?'-':'')+last3+(dp?'.'+p[1]:'');
}
const rs=n=>'₹'+fmtI(n);
function fmtC(n){ n=Number(n)||0; const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e7) return s+'₹'+(a/1e7).toFixed(2)+' Cr';
  if(a>=1e5) return s+'₹'+(a/1e5).toFixed(2)+' L';
  return s+'₹'+fmtI(a,0);
}
const today=()=>new Date().toISOString().slice(0,10);
function dmy(d){ if(!d) return '—';
  // Handle both YYYY-MM-DD and DD/MM/YYYY formats
  var s=String(d).slice(0,10);
  var p; var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(s.indexOf('/')>=0){ p=s.split('/'); return p[0]+' '+M[+p[1]-1]+' '+p[2]; }
  p=s.split('-'); return (p[2]||'?')+' '+(M[+p[1]-1]||'?')+' '+(p[0]||'?'); }
const dmyS=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';

const MONTHS=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
function fyMonthKey(d){ const y=+d.slice(0,4), m=+d.slice(5,7); return (m>=4? (m-4) : (m+8)); }

/* ---------- rupees in words (Indian system) ---------- */
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w2(n){ return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); }
function words(n){ n=Math.round(Math.abs(Number(n)||0)*100); const p=n%100; n=Math.floor(n/100);
  if(n===0&&p===0) return 'Rupees Zero Only';
  let out=[], u=[[1e7,'Crore'],[1e5,'Lakh'],[1000,'Thousand'],[100,'Hundred']];
  for(const [v,l] of u){ if(n>=v){ out.push(w2(Math.floor(n/v))+' '+l); n%=v; } }
  if(n) out.push(w2(n));
  let s='Rupees '+out.join(' ').trim();
  if(p) s+=' and '+w2(p)+' Paise';
  return s+' Only';
}

/* ---------- misc ---------- */
const esc=s=>String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toISO(d){
  if(!d) return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
  var p=d.split('/'); if(p.length===3) return p[2]+'-'+p[1]+'-'+p[0];
  return d;
}

function toast(msg,bad){ const d=document.createElement('div'); d.className='tst'+(bad?' bad':''); d.textContent=msg;
  $('#toast').appendChild(d); setTimeout(()=>d.remove(),2800); }
async function dl(name,text,mime){
  /* Prefer the platform downloads capability when this page is running as a hosted Artifact
     (window.claude.use is only present there). Fall back to a plain anchor/blob download —
     the path used when this file is opened directly in a browser. */
  if(window.claude&&typeof window.claude.use==='function'){
    try{
      const d=await window.claude.use('downloads');
      if(d){ await d.save({filename:name,data:text}); return; }
    }catch(e){ /* declined, unavailable, or extension not enabled — fall through to the anchor method */ }
  }
  const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function csv(rows){ return rows.map(r=>r.map(c=>{ c=String(c===undefined||c===null?'':c);
  return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n'); }
async function dlBinary(name,blob){
  /* Same platform-downloads-first, anchor-fallback pattern as dl(), but for binary files
     (PNG etc.) where a Blob/ArrayBuffer must be handed over rather than text. */
  if(window.claude&&typeof window.claude.use==='function'){
    try{
      const d=await window.claude.use('downloads');
      if(d){ await d.save({filename:name,data:blob}); return; }
    }catch(e){ /* fall through */ }
  }
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function dataUriToBlob(dataUri){
  const m=dataUri.match(/^data:(.*?);base64,(.*)$/); if(!m) return new Blob([dataUri]);
  const bin=atob(m[2]), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:m[1]});
}

/* ---------- WhatsApp share helpers ----------
   True inbound/outbound WhatsApp automation needs a server-side WhatsApp Business API
   integration and cannot run from a static page. What this app CAN do — and does — is
   build the message, then hand off to WhatsApp Web / the WhatsApp app via a wa.me deep
   link, with the correct contact pre-filled whenever a phone number is on record. */
function waDigits(n){ return String(n||'').replace(/\D/g,''); }
function waLink(number,text){ const d=waDigits(number);
  return 'https://wa.me/'+(d?d:'')+'?text='+encodeURIComponent(text||''); }
function waShare(number,text){ window.open(waLink(number,text),'_blank','noopener'); }

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Could not save to this browser: '+e.message,true); } }
function load(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=null; } }
  if(!S){ S=seed(); save(); }
  if(!S.ui) S.ui={site:'ALL'};

  if(S.company.whatsapp===undefined) S.company.whatsapp='';
  if(S.company.upi===undefined) S.company.upi='';
  /* ensure all arrays exist so new features don't crash on old saves */
  ['sites','parties','machines','staff','labour','items','machineLogs','trips',
   'attendance','payroll','grn','issues','purchases','sales','vouchers','audit','waInbox'].forEach(k=>{ if(!S[k]) S[k]=[]; });

  // Normalize ALL dates to ISO format (YYYY-MM-DD) and sort newest first
  var _dateFixed=false;
  if(S.machineLogs){
    S.machineLogs.forEach(function(l){ var n=toISO(l.date); if(n&&n!==l.date){l.date=n;_dateFixed=true;} });
    S.machineLogs.sort(function(a,b){ return (toISO(a.date)||a.date)<(toISO(b.date)||b.date)?1:-1; });
  }
  if(S.trips) S.trips.forEach(function(t){ var n=toISO(t.date); if(n&&n!==t.date){t.date=n;_dateFixed=true;} });
  if(S.lb){
    ['msand','gitti','hava','dumper','murum'].forEach(function(reg){
      if(S.lb[reg]) S.lb[reg].forEach(function(r){ var n=toISO(r.date); if(n&&n!==r.date){r.date=n;_dateFixed=true;} });
    });
  }
  if(_dateFixed){ try{ localStorage.setItem('kapl_nirman_v1',JSON.stringify(S)); }catch(e){} }
  // Ensure every trip has a unique id
  S.trips.forEach(function(t){ if(!t.id) t.id=uid(); });
  // Only auto-migrate from trips if logbook is completely empty
  var _lbEmpty=['msand','gitti','hava','dumper','murum'].every(function(k){
    return !S.lb||!S.lb[k]||S.lb[k].length===0;
  });
  if(_lbEmpty) migrateTripsToLb();
  else {
    // Just ensure lb arrays exist
    if(!S.lb) S.lb={};
    ['murum','gitti','msand','hava','dumper'].forEach(function(k){ if(!S.lb[k]) S.lb[k]=[]; });
  }
  if(!S.seq) S.seq={PV:0,RV:0,CV:0,JV:0,PB:0,SB:0,MB:0,TS:0,MR:0,GR:0,MI:0,SAL:0};
  return S;
}
const USER=()=>S.company?.signatory||'User';
function logAudit(op,entity,ref,detail){
  S.audit.push({id:uid(),ts:new Date().toISOString(),user:USER(),op:op,entity:entity,ref:ref||'',detail:detail||''});
  if(S.audit.length>4000) S.audit.splice(0,S.audit.length-4000);
}
function nextNo(pfx,fmt){
  S.seq[pfx]=(S.seq[pfx]||0)+1;
  const n=String(S.seq[pfx]).padStart(3,'0');
  return (fmt||(pfx+'/26-27/'))+n;
}

/* ================= ACCOUNTS & POSTING ================= */
const acc=c=>S.coa.find(a=>a.code===c);
const accName=c=>{const a=acc(c);return a?a.code+' · '+a.name:c;};
const isDrNature=c=>{const a=acc(c);return a?CLS[a.cls].d===1:true;};

function postVoucher(v){
  const dr=R2(v.lines.reduce((s,l)=>s+(+l.dr||0),0));
  const cr=R2(v.lines.reduce((s,l)=>s+(+l.cr||0),0));
  if(Math.abs(dr-cr)>0.02) throw new Error('Voucher does not balance: Dr '+fmtI(dr)+' vs Cr '+fmtI(cr));
  v.id=v.id||uid();
  v.no=v.no||nextNo(v.type);
  v.lines=v.lines.filter(l=>(+l.dr||0)!==0||(+l.cr||0)!==0).map(l=>({ac:l.ac,dr:R2(l.dr||0),cr:R2(l.cr||0),note:l.note||''}));
  v.amount=dr;
  v.createdAt=new Date().toISOString();
  S.vouchers.push(v);
  logAudit('C','Voucher',v.no,v.type+' '+dmyS(v.date)+' — '+rs(dr)+(v.narration?' · '+v.narration:''));
  return v;
}
function delVoucher(id,why){
  const i=S.vouchers.findIndex(v=>v.id===id); if(i<0) return;
  const v=S.vouchers[i];
  logAudit('D','Voucher',v.no,'Reversed/deleted — '+rs(v.amount)+(why?' · '+why:''));
  S.vouchers.splice(i,1);
}
/* running balances up to a date */
function balances(upto,from){
  const m={};
  S.coa.forEach(a=>{ const o=a.ob||0;
    m[a.code]={dr:0,cr:0,ob:a.obSide==='Dr'?o:-o,name:a.name,cls:a.cls}; });
  S.vouchers.forEach(v=>{
    if(upto&&v.date>upto) return;
    if(from&&v.date<from) return;
    v.lines.forEach(l=>{ if(!m[l.ac]) m[l.ac]={dr:0,cr:0,ob:0,name:l.ac,cls:'EXP'};
      m[l.ac].dr+=l.dr; m[l.ac].cr+=l.cr; });
  });
  Object.keys(m).forEach(k=>{ const x=m[k]; x.bal=R2(x.ob+x.dr-x.cr); });
  return m;
}
const balOf=(code,upto)=>{const b=balances(upto)[code];return b?b.bal:0;};

/* ================= GST / TDS ENGINE ================= */
const isIntra=p=>!p||!p.state||p.state===S.company.stateCode;
function gstSplit(taxable,rate,party){
  const tax=R2(taxable*rate/100);
  if(isIntra(party)) return {cgst:R2(tax/2),sgst:R2(tax-R2(tax/2)),igst:0,total:tax};
  return {cgst:0,sgst:0,igst:tax,total:tax};
}
const TDS_SEC={
 '194C':{label:'Contractor / Sub-contractor (Work)',single:30000,annual:100000,ind:1,co:2,ac:'2206'},
 '194J':{label:'Professional / Technical Fees',single:50000,annual:50000,ind:10,co:10,ac:'2207'},
 '194I':{label:'Rent — Plant, Machinery, Land or Building',single:50000,annual:600000,ind:2,co:2,ac:'2208'},
 '194H':{label:'Commission / Brokerage',single:20000,annual:20000,ind:2,co:2,ac:'2209'},
 '194Q':{label:'Purchase of Goods (buyer T/O > ₹10 Cr)',single:0,annual:5000000,ind:0.1,co:0.1,ac:'2211'},
 '192' :{label:'Salary',single:0,annual:0,ind:0,co:0,ac:'2210'},
 '194A':{label:'Interest other than securities',single:50000,annual:50000,ind:10,co:10,ac:'2206'}
};
/* year-to-date paid to this party under this section (for threshold test) */
function tdsYTD(partyId,sec){
  return S.purchases.filter(p=>p.party===partyId&&p.tdsSec===sec&&inFY(p.date))
    .reduce((s,p)=>s+(p.taxable||0),0);
}
function tdsCalc(party,taxable,sec,dateIgnored){
  if(!sec||!TDS_SEC[sec]) return {rate:0,amt:0,reason:'No TDS section mapped'};
  const cfg=TDS_SEC[sec];
  let rate=party&&party.tdsRate!==undefined&&party.tdsRate!==''?+party.tdsRate:cfg.co;
  if(!party||!party.pan){ rate=Math.max(rate,20); }
  const ytd=tdsYTD(party?party.id:'',sec);
  const crossSingle=cfg.single&&taxable>=cfg.single;
  const crossAnnual=cfg.annual&&(ytd+taxable)>cfg.annual;
  if(sec==='194Q'){
    if((S.company.turnoverPrevFY||0)<=100000000) return {rate:0,amt:0,reason:'194Q not attracted — buyer turnover ≤ ₹10 Cr'};
    if(!crossAnnual) return {rate:0,amt:0,reason:'Below ₹50 L annual threshold (YTD '+fmtC(ytd)+')'};
    return {rate:rate,amt:R2((ytd+taxable-cfg.annual)*rate/100),reason:'0.1% on value above ₹50 L'};
  }
  if(!crossSingle&&!crossAnnual)
    return {rate:0,amt:0,reason:'Below threshold — single '+rs(cfg.single)+' / annual '+rs(cfg.annual)+' (YTD '+fmtI(ytd,0)+')'};
  return {rate:rate,amt:R2(taxable*rate/100),
    reason:(!party||!party.pan?'No PAN — 20% u/s 206AA':(crossSingle?'Single bill ≥ '+rs(cfg.single):'Annual aggregate crossed '+rs(cfg.annual)))};
}
/* MSME 45-day rule, s.43B(h) */
function msmeDue(p){
  const party=S.parties.find(x=>x.id===p.party);
  if(!party||!party.msme||party.msme==='Not Registered'||party.msme==='') return null;
  const d=new Date(p.date); d.setDate(d.getDate()+45);
  return d.toISOString().slice(0,10);
}
/* helper lookups */
const P=id=>S.parties.find(x=>x.id===id)||null;
const SITE=id=>S.sites.find(x=>x.id===id)||null;
const ITEM=id=>S.items.find(x=>x.id===id)||null;
const MACH=id=>S.machines.find(x=>x.id===id)||null;
const WKR=id=>S.labour.find(x=>x.id===id)||null;
const EMP=id=>S.staff.find(x=>x.id===id)||null;
const pname=id=>{const p=P(id);return p?p.name:'—';};
const sname=id=>{const s=SITE(id);return s?s.name:'—';};
const scode=id=>{const s=SITE(id);return s?s.code:'—';};
/* site filter */
const siteOK=sid=>S.ui.site==='ALL'||S.ui.site===sid;

<script>
/* ================= STOCK (weighted average) ================= */
function stockOf(itemId,upto){
  const it=ITEM(itemId); if(!it) return {qty:0,val:0,rate:0};
  let q=+it.opening||0, v=q*(+it.rate||0);
  const ev=[];
  S.grn.forEach(g=>g.lines.forEach(l=>{ if(l.item===itemId&&(!upto||g.date<=upto)) ev.push({d:g.date,q:+l.qty,r:+l.rate}); }));
  S.issues.forEach(g=>g.lines.forEach(l=>{ if(l.item===itemId&&(!upto||g.date<=upto)) ev.push({d:g.date,q:-Math.abs(+l.qty)}); }));
  ev.sort((a,b)=>a.d<b.d?-1:1);
  ev.forEach(e=>{ if(e.q>0){ q+=e.q; v+=e.q*e.r; } else { const r=q>0?v/q:0; const t=Math.min(-e.q,q); q-=t; v-=t*r; } });
  return {qty:R2(q),val:R2(v),rate:q>0?R2(v/q):(+it.rate||0)};
}
function stockAt(itemId,date){ return stockOf(itemId,date).rate; }

/* ================= DOCUMENT BUILDERS ================= */
function buildVendorBill(o){
  /* o: {date,party,site,vendorRef,narration,expAc,taxable,gstRate,tdsSec,rcm,stockLines,cess} */
  const party=P(o.party);
  const g=gstSplit(o.taxable,o.rcm?0:(+o.gstRate||0),party);
  const t=tdsCalc(party,o.taxable,o.tdsSec);
  const rcmTax=o.rcm?gstSplit(o.taxable,+o.gstRate||0,party):{cgst:0,sgst:0,igst:0,total:0};
  const gross=R2(o.taxable+g.total);
  const net=R2(gross-t.amt);
  const lines=[];
  if(o.stockLines&&o.stockLines.length) o.stockLines.forEach(l=>lines.push({ac:l.ac,dr:l.amt,cr:0,note:l.note}));
  else lines.push({ac:o.expAc,dr:o.taxable,cr:0,note:o.narration});
  if(g.cgst) lines.push({ac:'1501',dr:g.cgst,cr:0,note:'CGST input'});
  if(g.sgst) lines.push({ac:'1502',dr:g.sgst,cr:0,note:'SGST input'});
  if(g.igst) lines.push({ac:'1503',dr:g.igst,cr:0,note:'IGST input'});
  if(rcmTax.total){ lines.push({ac:'1504',dr:rcmTax.total,cr:0,note:'RCM input (recoverable)'});
    lines.push({ac:'2204',dr:0,cr:rcmTax.total,note:'RCM liability'}); }
  lines.push({ac:(party&&party.ac)||'2101',dr:0,cr:net,note:party?party.name:''});
  if(t.amt) lines.push({ac:TDS_SEC[o.tdsSec].ac,dr:0,cr:t.amt,note:'TDS u/s '+o.tdsSec+' @ '+t.rate+'%'});
  const v=postVoucher({type:'PB',date:o.date,narration:o.narration||('Bill — '+(party?party.name:'')),lines:lines,party:o.party,site:o.site});
  const rec={id:uid(),no:v.no,date:o.date,party:o.party,site:o.site,vendorRef:o.vendorRef||'',
    kind:o.kind||'Expense',narration:o.narration||'',expAc:o.expAc||'',taxable:R2(o.taxable),gstRate:o.rcm?0:(+o.gstRate||0),
    cgst:g.cgst,sgst:g.sgst,igst:g.igst,gross:gross,rcm:!!o.rcm,rcmRate:o.rcm?+o.gstRate:0,rcmTax:rcmTax.total,
    tdsSec:o.tdsSec||'',tdsRate:t.rate,tds:t.amt,tdsReason:t.reason,net:net,paid:0,vch:v.id,
    hsn:o.hsn||'',qty:o.qty||0,unit:o.unit||'',rate:o.rate||0,meta:o.meta||null};
  S.purchases.push(rec);
  logAudit('C','Vendor Bill',rec.no,(party?party.name:'')+' · '+rs(gross));
  return rec;
}
function buildSalesBill(o){
  /* o:{date,party,site,revAc,narration,taxable,gstRate,retPct,tdsPct,hsn,qty,unit,rate,kind,meta} */
  const party=P(o.party);
  const g=gstSplit(o.taxable,+o.gstRate||0,party);
  const gross=R2(o.taxable+g.total);
  const ret=R2(o.taxable*(+o.retPct||0)/100);
  const ctds=R2(o.taxable*(+o.tdsPct||0)/100);
  const recv=R2(gross-ret-ctds);
  const lines=[{ac:'1201',dr:recv,cr:0,note:party?party.name:''}];
  if(ret) lines.push({ac:'1203',dr:ret,cr:0,note:'Retention @ '+o.retPct+'%'});
  if(ctds) lines.push({ac:'1507',dr:ctds,cr:0,note:'TDS deducted by client @ '+o.tdsPct+'%'});
  lines.push({ac:o.revAc,dr:0,cr:o.taxable,note:o.narration});
  if(g.cgst) lines.push({ac:'2201',dr:0,cr:g.cgst,note:'CGST output'});
  if(g.sgst) lines.push({ac:'2202',dr:0,cr:g.sgst,note:'SGST output'});
  if(g.igst) lines.push({ac:'2203',dr:0,cr:g.igst,note:'IGST output'});
  const v=postVoucher({type:'SB',date:o.date,narration:o.narration||('Invoice — '+(party?party.name:'')),lines:lines,party:o.party,site:o.site});
  const rec={id:uid(),no:v.no,date:o.date,party:o.party,site:o.site,kind:o.kind||'RA Bill',
    narration:o.narration||'',revAc:o.revAc,taxable:R2(o.taxable),gstRate:+o.gstRate||0,
    cgst:g.cgst,sgst:g.sgst,igst:g.igst,gross:gross,retPct:+o.retPct||0,retention:ret,
    tdsPct:+o.tdsPct||0,clientTds:ctds,receivable:recv,received:0,vch:v.id,
    hsn:o.hsn||'',qty:o.qty||0,unit:o.unit||'',rate:o.rate||0,meta:o.meta||null};
  S.sales.push(rec);
  logAudit('C','Sales Invoice',rec.no,(party?party.name:'')+' · '+rs(gross));
  return rec;
}
function payBill(billId,date,mode,ac){
  const b=S.purchases.find(x=>x.id===billId); if(!b) return;
  const due=R2(b.net-(b.paid||0)); if(due<=0){ toast('Already settled'); return; }
  const party=P(b.party);
  postVoucher({type:'PV',date:date,narration:'Payment against '+b.no+' — '+(party?party.name:''),party:b.party,site:b.site,
    lines:[{ac:(party&&party.ac)||'2101',dr:due,cr:0,note:b.no},{ac:ac||'1103',dr:0,cr:due,note:mode||'Bank transfer'}]});
  b.paid=R2((b.paid||0)+due);
  logAudit('U','Vendor Bill',b.no,'Paid '+rs(due)+' by '+(mode||'Bank'));
}
function receiveBill(billId,date,mode,ac){
  const b=S.sales.find(x=>x.id===billId); if(!b) return;
  const due=R2(b.receivable-(b.received||0)); if(due<=0){ toast('Already received'); return; }
  const party=P(b.party);
  postVoucher({type:'RV',date:date,narration:'Receipt against '+b.no+' — '+(party?party.name:''),party:b.party,site:b.site,
    lines:[{ac:ac||'1103',dr:due,cr:0,note:mode||'Bank transfer'},{ac:'1201',dr:0,cr:due,note:b.no}]});
  b.received=R2((b.received||0)+due);
  logAudit('U','Sales Invoice',b.no,'Received '+rs(due)+' by '+(mode||'Bank'));
}

/* -------- JCB / machinery work bill from logs -------- */
function jcbBill(o){
  /* o:{dir,date,party,site,machine,from,to,rate,adj,gstRate,retPct,tdsPct,wo} */
  const logs=S.machineLogs.filter(l=>l.machine===o.machine&&l.site===o.site&&l.date>=o.from&&l.date<=o.to&&!l.billed);
  if(!logs.length) throw new Error('No unbilled machine log entries in that period for this machine and site.');
  const hrs=R2(logs.reduce((s,l)=>s+(+l.hours||0),0));
  const taxable=R2(hrs*(+o.rate||0)+(+o.adj||0));
  const meta={machine:o.machine,from:o.from,to:o.to,hours:hrs,rate:+o.rate,adj:+o.adj||0,
    logs:logs.map(l=>l.id),wo:o.wo||''};
  const m=MACH(o.machine);
  const desc='JCB excavation and earthmoving service with machine, operator and diesel — soil cutting, pond/low-land shaping, levelling, loading/stacking and allied earthwork at '+sname(o.site)+', as per machine log and MB annexure.';
  let rec;
  if(o.dir==='OUT'){
    rec=buildSalesBill({date:o.date,party:o.party,site:o.site,revAc:'4110',narration:desc,taxable:taxable,
      gstRate:o.gstRate===undefined?18:o.gstRate,retPct:o.retPct,tdsPct:o.tdsPct,hsn:'995433',
      qty:hrs,unit:'Machine Hours',rate:+o.rate,kind:'JCB Work Bill',meta:meta});
  }else{
    rec=buildVendorBill({date:o.date,party:o.party,site:o.site,expAc:'5401',narration:desc,taxable:taxable,
      gstRate:o.gstRate===undefined?18:o.gstRate,tdsSec:'194C',hsn:'995433',vendorRef:o.vendorRef,
      qty:hrs,unit:'Machine Hours',rate:+o.rate,kind:'JCB Work Bill',meta:meta});
  }
  logs.forEach(l=>{l.billed=rec.no;});
  rec.dir=o.dir; rec.machineName=m?m.name+' ('+m.reg+')':'';
  return rec;
}
/* -------- Murum / earth supply bill from trip sheet -------- */
function murumBill(o){
  const trips=S.trips.filter(t=>t.site===o.site&&t.date>=o.from&&t.date<=o.to&&!t.billed&&
    (o.dir==='OUT'||!o.party||t.party===o.party));
  if(!trips.length) throw new Error('No unbilled trips in that period for this site.');
  const nTrips=trips.length;
  const cum=R2(trips.reduce((s,t)=>s+(+t.cum||0),0));
  const basis=o.basis||'Cum';
  const qty=basis==='Trip'?nTrips:cum;
  const taxable=R2(qty*(+o.rate||0)+(+o.adj||0));
  const royalty=R2(+o.royalty||0);
  const meta={from:o.from,to:o.to,trips:nTrips,cum:cum,basis:basis,rate:+o.rate,adj:+o.adj||0,
    royalty:royalty,permit:o.permit||'',tripIds:trips.map(t=>t.id)};
  const desc='Supply of murum / earth fill material including loading, transportation to site, unloading and spreading — '+
    nTrips+' trips, '+fmtI(cum,2)+' cum, at '+sname(o.site)+' as per trip sheet and site measurement.';
  let rec;
  if(o.dir==='OUT'){
    rec=buildSalesBill({date:o.date,party:o.party,site:o.site,revAc:'4111',narration:desc,taxable:taxable,
      gstRate:o.gstRate===undefined?5:o.gstRate,retPct:o.retPct,tdsPct:o.tdsPct,hsn:'2505',
      qty:qty,unit:basis==='Trip'?'Trips':'Cum',rate:+o.rate,kind:'Murum Supply Bill',meta:meta});
  }else{
    rec=buildVendorBill({date:o.date,party:o.party,site:o.site,expAc:'5104',narration:desc,taxable:taxable,
      gstRate:o.gstRate===undefined?5:o.gstRate,tdsSec:'194C',hsn:'2505',vendorRef:o.vendorRef,
      qty:qty,unit:basis==='Trip'?'Trips':'Cum',rate:+o.rate,kind:'Murum Supply Bill',meta:meta});
  }
  if(royalty){
    postVoucher({type:'JV',date:o.date,narration:'Mineral royalty / murum permit fee — '+(o.permit||'')+' for '+rec.no,
      site:o.site,lines:[{ac:'5413',dr:royalty,cr:0,note:'Royalty'},{ac:'2303',dr:0,cr:royalty,note:'Payable to Mining Dept'}]});
  }
  trips.forEach(t=>{t.billed=rec.no;});
  rec.dir=o.dir;
  return rec;
}
/* -------- Labour muster payment bill -------- */
const SKILLED=['Mistri','Operator','Bar Bender','Fitter','Carpenter','Plumber','Electrician','Mason'];
function musterBill(o){
  /* o:{date,site,from,to,payAc,advances:[{worker,amt}]} */
  const rows=S.attendance.filter(a=>a.site===o.site&&a.date>=o.from&&a.date<=o.to&&!a.billed);
  if(!rows.length) throw new Error('No unpaid attendance entries in that period for this site.');
  let skill=0,unskill=0,ot=0;
  const byW={};
  rows.forEach(a=>{
    const w=WKR(a.worker); if(!w) return;
    const wage=R2((+a.days||0)*(+a.rate||w.rate||0));
    const otAmt=R2((+a.ot||0)*((+a.rate||w.rate||0)/8)*1.5);
    if(SKILLED.indexOf(w.cat)>=0) skill+=wage; else unskill+=wage;
    ot+=otAmt;
    byW[a.worker]=byW[a.worker]||{worker:a.worker,days:0,ot:0,amt:0};
    byW[a.worker].days+=(+a.days||0); byW[a.worker].ot+=(+a.ot||0); byW[a.worker].amt+=R2(wage+otAmt);
  });
  skill=R2(skill); unskill=R2(unskill); ot=R2(ot);
  const gross=R2(skill+unskill+ot);
  const adv=R2((o.advances||[]).reduce((s,a)=>s+(+a.amt||0),0));
  const net=R2(gross-adv);
  const lines=[];
  if(skill) lines.push({ac:'5201',dr:skill,cr:0,note:'Skilled wages'});
  if(unskill) lines.push({ac:'5202',dr:unskill,cr:0,note:'Unskilled wages'});
  if(ot) lines.push({ac:'5204',dr:ot,cr:0,note:'Overtime @ 1.5×'});
  if(adv) lines.push({ac:'1403',dr:0,cr:adv,note:'Advance recovered'});
  lines.push({ac:o.payAc||'1102',dr:0,cr:net,note:'Paid to site labour'});
  const v=postVoucher({type:'MR',date:o.date,site:o.site,
    narration:'Labour payment bill '+dmyS(o.from)+' to '+dmyS(o.to)+' — '+sname(o.site),lines:lines});
  const rec={id:uid(),no:v.no,date:o.date,site:o.site,from:o.from,to:o.to,skill:skill,unskill:unskill,ot:ot,
    gross:gross,adv:adv,net:net,payAc:o.payAc||'1102',advances:o.advances||[],
    workers:Object.values(byW).map(x=>({...x,amt:R2(x.amt)})),vch:v.id};
  S.payroll.push({kind:'MUSTER',...rec});
  rows.forEach(a=>{a.billed=rec.no;});
  logAudit('C','Labour Payment Bill',rec.no,sname(o.site)+' · '+rs(net)+' net');
  return rec;
}
/* -------- Staff payroll -------- */
function runPayroll(month,payDate){
  if(S.payroll.some(p=>p.kind==='SALARY'&&p.month===month)) throw new Error('Payroll for '+month+' has already been processed.');
  const rows=S.staff.filter(e=>e.status==='Active').map(e=>{
    const basic=+e.basic||0, gross=+e.gross||0;
    const pfBase=Math.min(basic,15000);
    const pfE=e.pf?R2(pfBase*0.12):0, pfR=e.pf?R2(pfBase*0.12):0;
    const esiE=e.esi&&gross<=21000?R2(gross*0.0075):0, esiR=e.esi&&gross<=21000?R2(gross*0.0325):0;
    const pt=+e.pt||0, tds=+e.tds||0;
    const net=R2(gross-pfE-esiE-pt-tds);
    return {emp:e.id,name:e.name,gross:gross,basic:basic,pfE:pfE,pfR:pfR,esiE:esiE,esiR:esiR,pt:pt,tds:tds,net:net};
  });
  const T=k=>R2(rows.reduce((s,r)=>s+r[k],0));
  const lines=[{ac:'6102',dr:T('gross'),cr:0,note:'Gross salary '+month}];
  if(T('pfR')) lines.push({ac:'6103',dr:T('pfR'),cr:0,note:'Employer PF 12%'});
  if(T('esiR')) lines.push({ac:'6104',dr:T('esiR'),cr:0,note:'Employer ESI 3.25%'});
  if(T('pfE')+T('pfR')) lines.push({ac:'2213',dr:0,cr:R2(T('pfE')+T('pfR')),note:'PF payable'});
  if(T('esiE')+T('esiR')) lines.push({ac:'2214',dr:0,cr:R2(T('esiE')+T('esiR')),note:'ESI payable'});
  if(T('pt')) lines.push({ac:'2215',dr:0,cr:T('pt'),note:'MP Professional Tax'});
  if(T('tds')) lines.push({ac:'2210',dr:0,cr:T('tds'),note:'TDS u/s 192'});
  lines.push({ac:'2301',dr:0,cr:T('net'),note:'Net salary payable'});
  const v=postVoucher({type:'SAL',date:payDate,narration:'Salary for '+month,lines:lines,site:'S4'});
  const rec={kind:'SALARY',id:uid(),no:v.no,month:month,date:payDate,rows:rows,
    gross:T('gross'),pf:R2(T('pfE')+T('pfR')),esi:R2(T('esiE')+T('esiR')),pt:T('pt'),tds:T('tds'),net:T('net'),vch:v.id};
  S.payroll.push(rec);
  logAudit('C','Payroll',rec.no,month+' · '+rows.length+' employees · net '+rs(T('net')));
  return rec;
}
/* -------- Inventory -------- */
function addGRN(o){
  /* o:{date,party,site,vendorRef,lines:[{item,qty,rate,gst}],tdsSec,freight} */
  let taxable=0, gstAmt=0; const party=P(o.party);
  const stockLines=[];
  o.lines.forEach(l=>{
    const it=ITEM(l.item); const amt=R2((+l.qty||0)*(+l.rate||0));
    taxable+=amt; gstAmt+=R2(amt*(l.gst!==undefined?+l.gst:(it?it.gst:0))/100);
    stockLines.push({ac:it?it.stockAc:'1309',amt:amt,note:(it?it.name:'')+' '+fmtI(l.qty,3)+' '+(it?it.unit:'')});
  });
  taxable=R2(taxable); gstAmt=R2(gstAmt);
  const eff=taxable?R2(gstAmt/taxable*100):0;
  const bill=buildVendorBill({date:o.date,party:o.party,site:o.site,vendorRef:o.vendorRef,
    narration:o.narration||'Material received at '+sname(o.site),taxable:taxable,gstRate:eff,
    tdsSec:o.tdsSec||(party?party.tds:''),stockLines:stockLines,kind:'Material Purchase'});
  const g={id:uid(),no:nextNo('GR'),date:o.date,party:o.party,site:o.site,vendorRef:o.vendorRef||'',
    lines:o.lines.map(l=>({item:l.item,qty:R2(l.qty),rate:R2(l.rate),gst:l.gst!==undefined?+l.gst:(ITEM(l.item)||{}).gst,
      amt:R2((+l.qty||0)*(+l.rate||0))})),bill:bill.no,billId:bill.id,taxable:taxable};
  S.grn.push(g);
  logAudit('C','Goods Receipt',g.no,pname(o.party)+' · '+g.lines.length+' item(s) · '+rs(taxable));
  return g;
}
function addIssue(o){
  /* o:{date,site,to,lines:[{item,qty}],purpose} */
  const lines=[]; let tot=0;
  o.lines.forEach(l=>{
    const it=ITEM(l.item); const st=stockOf(l.item,o.date);
    const val=R2(Math.abs(+l.qty||0)*st.rate); tot+=val;
    lines.push({ac:it?it.expAc:'5120',dr:val,cr:0,note:(it?it.name:'')+' — issue'});
    lines.push({ac:it?it.stockAc:'1309',dr:0,cr:val,note:'Stock issued'});
  });
  const v=postVoucher({type:'MI',date:o.date,site:o.site,
    narration:'Material issued to '+sname(o.site)+(o.purpose?' — '+o.purpose:''),lines:lines});
  const rec={id:uid(),no:v.no,date:o.date,site:o.site,to:o.to||'',purpose:o.purpose||'',
    lines:o.lines.map(l=>({item:l.item,qty:R2(l.qty),rate:stockOf(l.item,o.date).rate,
      amt:R2(Math.abs(+l.qty||0)*stockOf(l.item,o.date).rate)})),value:R2(tot),vch:v.id};
  S.issues.push(rec);
  logAudit('C','Material Issue',rec.no,sname(o.site)+' · '+rs(tot));
  return rec;
}
</script>

<script>

function barChart(data,opt){
  opt=opt||{}; const W=opt.w||560,H=opt.h||160,pad=26,bw=(W-pad*2)/data.length;
  const mx=Math.max(1,...data.map(d=>Math.max(d.a||0,d.b||0)));
  let bars='',lbl='';
  data.forEach((d,i)=>{
    const x=pad+i*bw, iw=bw*0.34;
    const ha=(d.a||0)/mx*(H-pad-18), hb=(d.b||0)/mx*(H-pad-18);
    bars+='<rect x="'+(x+bw*0.10)+'" y="'+(H-18-ha)+'" width="'+iw+'" height="'+Math.max(ha,0.6)+'" rx="1.5" fill="var(--slate)"/>';
    bars+='<rect x="'+(x+bw*0.10+iw+3)+'" y="'+(H-18-hb)+'" width="'+iw+'" height="'+Math.max(hb,0.6)+'" rx="1.5" fill="var(--accent)"/>';
    lbl+='<text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--cond)">'+d.l+'</text>';
  });
  let grid='';
  for(let i=1;i<=3;i++){ const y=H-18-(H-pad-18)*i/3;
    grid+='<line x1="'+pad+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="var(--hair)" stroke-width="1"/>'+
    '<text x="'+(pad-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--faint)" font-family="var(--mono)">'+
      (mx*i/3>=1e5?(mx*i/3/1e5).toFixed(1)+'L':Math.round(mx*i/3/1000)+'k')+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;overflow:visible" role="img" aria-label="'+(opt.alt||'chart')+'">'+
    grid+bars+lbl+'</svg>';
}
function legend(items){ return '<div class="row" style="gap:14px;font-size:11.5px;color:var(--muted)">'+
  items.map(i=>'<span class="row" style="gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:'+i[1]+';display:inline-block"></span>'+esc(i[0])+'</span>').join('')+'</div>'; }

/* ================= DASHBOARD ================= */
function fyPL(){
  const b=balances(FY_END,FY_START);
  let rev=0,oi=0,cogs=0,exp=0,dep=0;
  S.coa.forEach(a=>{ const x=b[a.code]; if(!x) return; const net=R2(x.dr-x.cr);
    if(a.cls==='INC') rev+=-net; else if(a.cls==='OI') oi+=-net;
    else if(a.cls==='COGS') cogs+=net; else if(a.cls==='EXP'||a.cls==='OEX') exp+=net; else if(a.cls==='DEP') dep+=net; });
  return {rev:R2(rev),oi:R2(oi),cogs:R2(cogs),exp:R2(exp),dep:R2(dep),
    gp:R2(rev-cogs),pbt:R2(rev+oi-cogs-exp-dep)};
}
function receivables(){ return R2(S.sales.reduce((s,b)=>s+R2(b.receivable-(b.received||0)),0)); }
function payables(){ return R2(S.purchases.reduce((s,b)=>s+R2(b.net-(b.paid||0)),0)); }
function gstNet(){
  const b=balances();
  const out=-(b['2201'].bal+b['2202'].bal+b['2203'].bal), inp=b['1501'].bal+b['1502'].bal+b['1503'].bal;
  return {out:R2(out),inp:R2(inp),net:R2(out-inp),rcm:R2(-b['2204'].bal)};
}
function tdsPayable(){ const b=balances();
  return R2(-(b['2206'].bal+b['2207'].bal+b['2208'].bal+b['2209'].bal+b['2210'].bal+b['2211'].bal)); }
function siteWise(){
  return S.sites.filter(s=>s.id!=='S4').map(s=>{
    const rev=R2(S.sales.filter(x=>x.site===s.id).reduce((t,x)=>t+x.taxable,0));
    let cost=0;
    S.vouchers.forEach(v=>{ if(v.site!==s.id) return;
      v.lines.forEach(l=>{ const a=acc(l.ac); if(a&&(a.cls==='COGS')) cost+=R2(l.dr-l.cr); }); });
    cost=R2(cost);
    return {site:s,rev:rev,cost:cost,gp:R2(rev-cost),m:rev?R2((rev-cost)/rev*100):0,
      billed:rev,value:s.value,pct:s.value?Math.min(100,R2(rev/s.value*100)):0};
  });
}
function monthly(){
  const out=MONTHS.map(m=>({l:m,a:0,b:0}));
  S.sales.forEach(x=>{ if(inFY(x.date)) out[fyMonthKey(x.date)].a+=x.taxable; });

    v.lines.forEach(l=>{ const a=acc(l.ac); if(a&&(a.cls==='COGS'||a.cls==='EXP')) out[fyMonthKey(v.date)].b+=R2(l.dr-l.cr); }); });
  return out.slice(0,5);
}
function P_dash(){
  const pl=fyPL(), g=gstNet(), rec=receivables(), pay=payables();
  const unb=S.machineLogs.filter(l=>!l.billed), unbH=R2(unb.reduce((s,l)=>s+l.hours,0));

  const unbA=S.attendance.filter(a=>!a.billed);
  const cash=R2(balOf('1101')+balOf('1102')+balOf('1103')+balOf('1104'));
  const due=dueSoon();
  let h=pageHead('Financial Year 2026-27','Position as on '+dmy(today()),
    '<button class="btn" onclick="window.print()">Print</button><button class="btn pri" onclick="go(\'sales\')">New RA Bill</button>');
  h+='<div class="tiles">'+
   tile('a','Revenue billed',fmtC(pl.rev),'Net of GST · '+S.sales.length+' invoices')+
   tile('s','Direct cost',fmtC(pl.cogs),'Gross margin '+(pl.rev?R2(pl.gp/pl.rev*100):0)+'%')+
   tile(pl.pbt>=0?'g':'c','Profit before tax',fmtC(pl.pbt),'After ₹'+fmtI(pl.exp+pl.dep,0)+' overheads')+
   tile('g','Cash & bank',fmtC(cash),'Across 4 accounts')+
   tile('w','Receivable',fmtC(rec),'Retention '+fmtC(balOf('1203'))+' held')+
   tile('c','Payable',fmtC(pay),S.purchases.filter(b=>R2(b.net-(b.paid||0))>0.5).length+' open bills')+
   tile('a','GST net liability',fmtC(g.net),'Output '+fmtC(g.out)+' − ITC '+fmtC(g.inp))+
   tile('s','TDS payable',fmtC(tdsPayable()),'Deposit by 7th of next month')+
  '</div>';
  h+='<div class="grid" style="grid-template-columns:1.35fr 1fr">';
  h+='<div class="card"><header><h3>Billing against site cost</h3><span class="sub">Month-wise, FY 2026-27</span>'+
     '<div style="margin-left:auto">'+legend([['Billed','var(--slate)'],['Site & overhead cost','var(--accent)']])+'</div></header>'+
     '<div class="body">'+barChart(monthly(),{alt:'Monthly billing versus cost'})+'</div></div>';
  h+='<div class="card"><header><h3>Work recorded but not yet billed</h3></header><div class="body">'+
    unbRow('Machine hours — JCB / excavator',fmtI(unbH,2)+' hrs',unb.length+' log entries',"go('mlog')")+
    unbRow('Murum / earth trips',fmtI(unbC,2)+' cum',unbT.length+' trips',"go('trips')")+
    unbRow('Labour attendance',unbA.length+' entries',
      'Approx '+rs(unbA.reduce((s,a)=>s+(a.days||0)*(a.rate||0),0)),"go('muster')")+
    '</div></div></div>';
  h+='<div class="sep"></div>';
  h+='<div class="grid" style="grid-template-columns:1.35fr 1fr">';
  /* site profitability */
  const sw=siteWise();
  h+='<div class="card"><header><h3>Site-wise profitability</h3><span class="sub">Contract revenue less direct cost booked to the site</span></header>'+
   tbl([{l:'Site',k:'x',f:r=>'<b>'+esc(r.site.code)+'</b><div class="hint">'+esc(r.site.name)+'</div>'},
        {l:'Contract',n:1,f:r=>fmtC(r.value)},
        {l:'Billed',n:1,f:r=>fmtC(r.rev)},
        {l:'Progress',f:r=>'<div class="bar" style="width:76px"><i style="width:'+r.pct+'%"></i></div><span class="hint">'+r.pct+'%</span>'},
        {l:'Direct cost',n:1,f:r=>fmtC(r.cost)},
        {l:'Margin',n:1,f:r=>'<span class="pill '+(r.m>=20?'g':r.m>=8?'w':'c')+'">'+fmtI(r.m,1)+'%</span>'}],sw)+'</div>';
  /* compliance */
  h+='<div class="card"><header><h3>Next statutory dates</h3><span class="sub">MP — QRMP Group 2</span></header>'+
   tbl([{l:'Due',k:'d',f:r=>'<b class="mono">'+dmyS(r.d)+'</b><div class="hint">'+
       (daysBetween(today(),r.d)<0?'overdue':'in '+daysBetween(today(),r.d)+' d')+'</div>'},
        {l:'Filing',k:'t',f:r=>esc(r.t)+'<div class="hint">'+esc(r.n)+'</div>'},
        {l:'',f:r=>'<span class="pill '+(daysBetween(today(),r.d)<0?'c':daysBetween(today(),r.d)<8?'w':'')+'">'+esc(r.k)+'</span>'}],
     due.slice(0,7))+'</div></div>';
  return h;
}
function tile(c,k,v,n){ return '<div class="tile '+c+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="n">'+esc(n)+'</div></div>'; }

<script>
/* ================= MACHINE LOG (JCB / EARTHMOVING) ================= */
function P_mlog(){
  /* ── machine-type tab: 'all' | 'roller' | 'jcb' ── */
  const mtype=S.ui.mtype||'all';

  /* Filter directly by the 'mtype' field saved on each log entry */
  // Normalize all dates to ISO first, then sort newest first
  if(S.machineLogs) S.machineLogs.forEach(function(l){ var n=toISO(l.date); if(n) l.date=n; });
  const allRows=S.machineLogs.filter(l=>siteOK(l.site)).slice().sort((a,b)=>a.date<b.date?1:-1);
  const rows = mtype==='roller' ? allRows.filter(l=>l.mtype==='roller')
              : mtype==='jcb'   ? allRows.filter(l=>l.mtype==='jcb')
              : allRows;

  const unb=rows.filter(l=>!l.billed);
  const tot=R2(rows.reduce((s,l)=>s+l.hours,0)), untot=R2(unb.reduce((s,l)=>s+l.hours,0));

  const typeLabel = mtype==='roller' ? 'Road Roller' : mtype==='jcb' ? 'JCB Machine' : 'All Machines';

  let h=pageHead('Machine Log Book','Measurement basis for every JCB and earthmoving bill · SAC 995433',
    '<button class="btn" onclick="expMlog()">Export CSV</button>'+
    '<button class="btn" onclick="jcbBillForm()">Raise work bill</button>'+
    '<button class="btn pri" onclick="mlogForm()">+ Log entry</button>');

  /* ── machine-type tabs ── */
  h+='<div class="tabs" style="margin-bottom:0">'
    +'<button class="tab'+(mtype==='all'?' on':'')+'" onclick="S.ui.mtype=\'all\';render()">🔧 All Machines</button>'
    +'<button class="tab'+(mtype==='roller'?' on':'')+'" onclick="S.ui.mtype=\'roller\';render()">🛞 Road Roller</button>'
    +'<button class="tab'+(mtype==='jcb'?' on':'')+'" onclick="S.ui.mtype=\'jcb\';render()">🚜 JCB Machine</button>'
    +'</div>';

  h+='<div class="tiles">'+
   tile('a','Hours logged',fmtI(tot,2),rows.length+' entries · '+typeLabel)+
   tile('w','Unbilled hours',fmtI(untot,2),unb.length+' entries pending a bill')+
   tile('s','Machines deployed',String(new Set(rows.map(r=>r.machine)).size),'of '+S.machines.length+' in the register')+
   tile('g','Value at card rate',fmtC(rows.reduce((s,l)=>{
    var m=MACH(l.machine);
    // If no machine set, find by mtype
    if(!m&&l.mtype) m=S.machines.find(function(x){return x.cat===l.mtype||x.mtype===l.mtype;});
    // If still no machine, use first machine of that type
    if(!m&&l.mtype) m=S.machines.find(function(x){return (x.cat||'jcb')===l.mtype;});
    return s+(l.hours||0)*(m?+(m.rate||0):0);
  },0)),'Hire rate × hours')+
  '</div>';
  h+='<div class="warnbox noprint" style="margin-bottom:16px"><span>⚑</span><div><b>Why this register matters.</b> '+
   'A JCB invoice without a machine log, hour-meter reading and site certification is the first thing a bank auditor or GST officer '+
   'questions. Every bill raised here carries its measurement abstract, so the invoice, the log and the MB entry always agree.</div></div>';
  // Normalize operator names — all "Madan*" variants → canonical name
  function normOperator(op){
    var s=(op||'').toLowerCase().trim();
    if(s.indexOf('madan')>=0) return op.trim().split(/\s+/)[0]+' Yadav'; // keep "Madan Yadav" as canonical
    return op||'—';
  }
  // Group by date for subtle date-change dividers
  var lastDate='';
  var workDays=new Set(), nilDays=new Set();
  // Find duplicate machine log entries (same date + machine + same ~hours)
  var mlogDupIds=new Set();
  var mlogSeen={};
  rows.forEach(function(r){
    if((+r.hours||0)>0) workDays.add(r.date); else nilDays.add(r.date);
    var hmS=+(r.hmStart||0);
    // Real session: dedup by date + machine + opening reading
    // Nil day: dedup by date + machine + mtype + operator (two operators on same machine same day = different entries)
    var key;
    if(hmS>0){
      var hmE2=+(r.hmEnd||0);
      key=toISO(r.date)+'|'+(r.mtype||'jcb')+'|'+hmS+'|'+hmE2;
    } else {
      // Nil entries: never auto-dedup — use unique id so each is kept
      key='KEEP|'+r.id;
    }
    if(mlogSeen[key]) { mlogDupIds.add(r.id); mlogDupIds.add(mlogSeen[key]); }
    else mlogSeen[key]=r.id;
  });

  var mlogHasDups=mlogDupIds.size>0;
  var dupCount=Math.floor(mlogDupIds.size/2);
  // Detect possible wrong-year entries (2024 entries mixed with 2026 entries)
  var years=new Set(rows.map(function(r){return (r.date||'').slice(0,4);}));
  var hasWrongYear=years.size>1 && years.has('2024') && years.has('2026');
  h+='<div class="card"><header>'+
    '<h3>Log entries — '+esc(typeLabel)+'</h3>'+
    '<span class="sub">'+workDays.size+' working · '+nilDays.size+' nil'+
      (mlogHasDups?' · <b style="color:var(--crit)">⚠ '+dupCount+' duplicate'+(dupCount>1?'s':'')+' found</b>':'')+
    '</span>'+
    '<div style="display:flex;gap:6px;margin-left:auto">'+
    (hasWrongYear?'<button class="btn sm" style="background:rgba(255,150,0,0.2);color:var(--warn)" onclick="mlogFixYear()">⚠ Fix 2024→2026</button>':'')+
    '<button class="btn sm dngr" onclick="mlogDedup()">🧹 Dedup</button>'+
    '</div>'+
  '</header>';
  // Mark AI-scanned entries for blue highlight
  rows.forEach(function(r){
    var ch=(r.chalan||'');
    if(/^(AI|LB)-/i.test(ch)) r._cls='mlog-ai-row';
    else delete r._cls;
  });
  h+=tbl([
    {l:'Date',f:function(r){
      var isNewDate=toISO(r.date)!==toISO(lastDate);
      lastDate=r.date;
      var hrs=rows.filter(function(x){return toISO(x.date)===toISO(r.date);}).reduce(function(s,x){return s+(+x.hours||0);},0);
      var badge=hrs>0
        ?'<span style="margin-left:6px;font-size:9px;background:rgba(0,180,100,0.2);color:var(--ok,#0b6);padding:1px 6px;border-radius:20px">'+hrs.toFixed(1)+'h</span>'
        :'<span style="margin-left:6px;font-size:9px;background:rgba(255,150,0,0.15);color:var(--warn,#f90);padding:1px 6px;border-radius:20px">NIL</span>';
      var dupBadge=mlogDupIds.has(r.id)?'<span style="margin-left:4px;font-size:9px;background:#e53;color:#fff;padding:1px 5px;border-radius:3px">DUP</span>':'';
      return '<span class="mono"'+( isNewDate?'':' style="color:var(--muted)"')+'>'+dmy(r.date)+'</span>'+(isNewDate?badge:'')+dupBadge;
    }},
    {l:'Machine',f:function(r){var m=MACH(r.machine)||{}; return (r.mtype==='roller'?'🛞 ':'🚜 ')+'<b>'+esc(m.code||'—')+'</b>';}},
    {l:'Site',f:function(r){return esc(scode(r.site));}},
    {l:'Operator',f:function(r){return esc(normOperator(r.operator));}},
    {l:'Work executed',f:function(r){return '<div style="max-width:300px;font-size:12px">'+esc(r.work||'—')+'</div>';}},
    {l:'Hr-meter',n:1,f:function(r){return r.hmStart?'<span class="mono" style="font-size:12px">'+fmtI(r.hmStart,1)+' → '+fmtI(r.hmEnd,1)+'</span>':'—';}},
    {l:'Hours',n:1,f:function(r){return r.hours>0?'<b style="color:var(--ok)">'+fmtI(r.hours,2)+'</b>':'<span style="color:var(--muted)">—</span>';}},
    {l:'Status',f:function(r){return r.billed?'<span class="pill g">'+esc(r.billed)+'</span>':'<span class="pill w">Unbilled</span>';}},
    {l:'',cls:'act',f:function(r){return r.billed?'':
      '<button class="btn sm gh" onclick="mlogForm(\''+r.id+'\')" >Edit</button>'+
      '<button class="btn sm gh dngr" onclick="delRec(\'machineLogs\',\''+r.id+'\',\'Machine log\')">Del</button>';}}
  ], rows, {emptyTitle:'No entries for '+typeLabel, empty:'Add a log entry for each day a machine works on site.'})+'</div>';
  return h;
}
function mlogFixYear(){
  var count=0;
  S.machineLogs.forEach(function(r){
    if(r.date&&r.date.startsWith('2024-')){
      r.date=r.date.replace('2024-','2026-');
      count++;
    }
  });
  if(count>0){ save(); render(); toast('✅ Fixed '+count+' entries: 2024 → 2026'); }
  else toast('No 2024 entries found');
}
function mlogDedup(){
  if(!S.machineLogs||!S.machineLogs.length){toast('No entries',true);return;}

  // Group ALL entries by date+mtype+hmStart (include nil entries too)
  var groups={};
  S.machineLogs.forEach(function(r,idx){
    var d=toISO(r.date)||r.date||'';
    var t=r.mtype||'jcb';
    // Normalize hmStart: 5208.0 == 5208 == "5208" — use Math.round to handle decimals
    var s=String(Math.round(+(r.hmStart||0)));
    var key=d+'||'+t+'||'+s;
    if(!groups[key]) groups[key]=[];
    groups[key].push(r);
  });

  var dupGroups=Object.keys(groups).filter(function(k){return groups[k].length>1;});
  if(!dupGroups.length){toast('\u2705 No duplicates found in '+S.machineLogs.length+' entries');return;}

  // Build visual review
  var h='<div style="padding:12px;max-height:70vh;overflow-y:auto">';
  h+='<div style="margin-bottom:12px;padding:10px;background:rgba(220,50,50,0.1);border-radius:6px;font-size:13px">'+
    'Found <b>'+dupGroups.length+' group'+(dupGroups.length>1?'s':'')+' with duplicates</b>. '+
    'Select which entry to <b>KEEP</b> in each group. The others will be deleted.</div>';

  dupGroups.forEach(function(key,gi){
    var grp=groups[key];
    var parts=key.split('||');
    h+='<div style="margin-bottom:14px;border:1px solid rgba(220,50,50,0.4);border-radius:8px;overflow:hidden">';
    h+='<div style="background:rgba(220,50,50,0.1);padding:7px 12px;font-size:12px;font-weight:700;color:var(--crit,#e53)">'+
      '\u26a0 Group '+(gi+1)+': '+parts[0]+' · '+(parts[1]||'').toUpperCase()+' · HM Start: '+parts[2]+'</div>';
    h+='<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">';
    h+='<tr style="background:var(--surface2)"><th style="padding:5px 8px">KEEP</th><th style="padding:5px 8px">Date</th><th style="padding:5px 8px">Type</th><th style="padding:5px 8px">Operator</th><th style="padding:5px 8px">HM Start</th><th style="padding:5px 8px">HM End</th><th style="padding:5px 8px">Hours</th><th style="padding:5px 8px">Work</th></tr>';
    grp.forEach(function(r,ri){
      var bg=ri===0?'rgba(0,200,100,0.07)':'rgba(220,50,50,0.07)';
      h+='<tr id="duprow_'+gi+'_'+ri+'" style="border-top:1px solid var(--line);background:'+bg+'" onclick="mlogDedupPick('+gi+','+ri+')">';
      h+='<td style="padding:5px 8px;text-align:center"><input type="radio" name="dup'+gi+'" '+(ri===0?'checked':'')+' onclick="mlogDedupPick('+gi+','+ri+')"></td>';
      h+='<td style="padding:5px 8px;font-family:monospace;white-space:nowrap">'+r.date+'</td>';
      h+='<td style="padding:5px 8px">'+(r.mtype||'—')+'</td>';
      h+='<td style="padding:5px 8px">'+(r.operator||'—')+'</td>';
      h+='<td style="padding:5px 8px;font-family:monospace">'+(r.hmStart||'0')+'</td>';
      h+='<td style="padding:5px 8px;font-family:monospace">'+(r.hmEnd||'—')+'</td>';
      h+='<td style="padding:5px 8px;font-weight:700;color:var(--ok)">'+(r.hours||'—')+'</td>';
      h+='<td style="padding:5px 8px;max-width:120px;font-size:11px">'+(r.work||'—')+'</td>';
      h+='</tr>';
    });
    h+='</table></div></div>';
  });

  window._mlogDupData={groups:groups, keys:dupGroups, picks:{}};
  dupGroups.forEach(function(key,gi){ window._mlogDupData.picks[gi]=0; });

  h+='<div style="display:flex;gap:10px;padding:4px 0 8px">';
  h+='<button class="btn pri" onclick="mlogDedupConfirm()" style="padding:10px 24px;font-size:14px">\u2705 Delete Duplicates</button>';
  h+='<button class="btn" onclick="closeModal()">Cancel</button>';
  h+='</div></div>';

  modal('Duplicate Review — Machine Log', h, '', true);
}


function mlogDedupPick(gi, ri){
  if(!window._mlogDupData) return;
  window._mlogDupData.picks[gi]=ri;
  // Update row colors
  var key=window._mlogDupData.keys[gi];
  var grp=window._mlogDupData.groups[key]||[];
  grp.forEach(function(r,i){
    var row=document.getElementById('duprow_'+gi+'_'+i);
    if(row) row.style.background=i===ri?'rgba(0,200,100,0.07)':'rgba(220,50,50,0.07)';
  });
}


function mlogDedupConfirm(){
  var data=window._mlogDupData;
  if(!data){closeModal();return;}
  var toDelete=new Set();
  data.keys.forEach(function(key,gi){
    var grp=data.groups[key]||[];
    var keepIdx=data.picks[gi]||0;
    grp.forEach(function(r,i){ if(i!==keepIdx) toDelete.add(r.id); });
  });
  if(!toDelete.size){closeModal();toast('Nothing to delete');return;}
  S.machineLogs=S.machineLogs.filter(function(r){return !toDelete.has(r.id);});
  save(); closeModal(); render();
  toast('\u2705 Removed '+toDelete.size+' duplicate'+(toDelete.size>1?'s':''));
}

/* ================= MURUM / TRIP SHEET ================= */
function lbSyncToTrips(){
  if(!S.lb) S.lb={};
  if(!S.trips) S.trips=[];
  var CFT_MULT={hava:600,dumper:300,msand:1,gitti:1,murum:0};
  var LABELS={msand:'M-SAND',gitti:'GITTI',hava:'HAVA',dumper:'DUMPER',murum:'MURUM'};
  // Build fast lookup of existing trips by key
  var existing={};
  S.trips.forEach(function(t){
    var key=(t.date||'')+'__'+(t.src||'')+'__'+(t.cum||0);
    existing[key]=true;
  });
  Object.keys(LABELS).forEach(function(reg){
    if(!S.lb[reg]||!S.lb[reg].length) return;
    // MURUM: already in S.trips as original trip entries — don't re-add from lb to avoid double counting
    if(reg==='murum') return;
    var label=LABELS[reg];
    var isTrips=(reg==='hava'||reg==='dumper');
    S.lb[reg].forEach(function(entry){
      var d=entry.date||''; if(!d) return;
      var rawQty;
      if(isTrips){
        rawQty=+(entry.trips||0);
      } else if(reg==='murum'){
        rawQty=+(entry.qty||0); // murum qty is CUM, use as-is, no default
      } else {
        // gitti/msand: qty is like "600 cft", parse the number
        rawQty=parseFloat(String(entry.qty||'0').replace(/[^0-9.]/g,''))||0;
      }
      if(rawQty<=0) return; // skip zero-quantity entries — don't add to trip sheet
      var cum=isTrips?(rawQty*(reg==='dumper'?300:600)):rawQty;
      var siteId=(entry.site==='Barela'&&S.sites[1])? S.sites[1].id:(S.sites[0]?S.sites[0].id:'');
      var src=label+' '+(entry.site||'Bypass')+(entry.party?' — '+entry.party:'');
      var key=d+'__'+src+'__'+cum;
      if(!existing[key]){
        existing[key]=true;
        S.trips.push({id:uid(),billed:'',date:d,chalan:'LB-'+(S.trips.length+1),
          tipper:'',src:src,site:siteId,party:entry.party||'',machine:'',cum:cum});
      }
    });
  });
}

function P_trips(){
  if(!S.trips) S.trips=[];
  // NOTE: lbSyncToTrips NOT called here — logbook entries are in separate pages
  // Trip Sheet only shows S.trips (murum chalan entries)
  // Ensure every trip has an id
  S.trips.forEach(function(t){ if(!t.id) t.id=uid(); });
  // Dedup by id
  var seenT={};
  var finalTrips=S.trips.filter(function(t){
    if(seenT[t.id]) return false;
    seenT[t.id]=true; return true;
  });
  var rows=finalTrips.filter(t=>siteOK(t.site)).slice().sort((a,b)=>a.date<b.date?1:-1);
  var unb=rows.filter(t=>!t.billed);
  // isCFT: true if quantity is CFT (M-Sand/Gitti/Hava/Dumper) — includes LB- synced entries
  function isCFT(r){
    var s=(r.src||r.material||r.chalan||'').toUpperCase();
    // MURUM is CUM not CFT — never count as CFT
    if(s.indexOf('MURUM')>=0||s.indexOf('EARTH')>=0) return false;
    return s.indexOf('HAVA')>=0||s.indexOf('DUMPER')>=0||s.indexOf('GITTI')>=0||
           s.indexOf('M-SAND')>=0||s.indexOf('MSAND')>=0||s.indexOf('SAND')>=0;
  }
  // isMisrouted: manually-added entries that belong in logbook (not LB- synced ones)
  function isMisrouted(r){
    if((r.chalan||'').startsWith('LB-')) return false;
    if(!r.src&&!r.material) return false;
    return isCFT(r);
  }
  const murumCum=R2(rows.filter(r=>!isCFT(r)).reduce((s,t)=>s+t.cum,0));
  const cftCum=R2(rows.filter(r=>isCFT(r)).reduce((s,t)=>s+t.cum,0));
  const uMurumCum=R2(unb.filter(r=>!isCFT(r)).reduce((s,t)=>s+t.cum,0));
  const uCftCum=R2(unb.filter(r=>isCFT(r)).reduce((s,t)=>s+t.cum,0));
  const cum=R2(murumCum+cftCum), ucum=R2(uMurumCum+uCftCum);
  let h=pageHead('Murum & Earth Trip Sheet','Hard Murum only here · M-Sand/Gitti/Hava/Dumper → use Logbook section · HSN 2505 · GST 5%',
    '<button class="btn sm" style="background:rgba(99,179,237,0.15);color:#63b3ed" onclick="fixAllDates()">📅 Fix Dates</button>'+
    '<button class="btn sm" onclick="tripSheetDedup()">🧹 Dedup</button>'+
    '<button class="btn" onclick="expTrips()">Export CSV</button>'+
    '<button class="btn" onclick="murumBillForm()">Raise supply bill</button>'+
    '<button class="btn pri" onclick="smartTripAdd()">+ Trip</button>');
  // No auto-move — user controls their data manually via Dedup button
  h+='<div class="tiles">'+
   tile('a','Total trips',String(rows.length),'FY 2026-27')+
   tile('s','Quantity carried',fmtI(murumCum,2)+' CUM + '+fmtI(cftCum,2)+' CFT','Murum=CUM · Hava/Dumper/Gitti/M-Sand=CFT')+
   tile('w','Unbilled',fmtI(uMurumCum,2)+' CUM + '+fmtI(uCftCum,2)+' CFT',unb.length+' trips pending')+
   tile('g','Royalty booked',fmtC(balOf('5413')),'Mineral permit fees')+
  '</div>';
  h+='<div class="card"><header><h3>Trip register</h3><span class="sub">Chalan-wise</span></header>'+
   tbl([{l:'Date',k:'date',f:r=>'<span class="mono">'+dmyS(r.date)+'</span>'},
        {l:'Chalan',k:'chalan',mono:1},
        {l:'Tipper',k:'tipper',mono:1},
        {l:'Source',k:'src',f:r=>'<div style="max-width:260px">'+esc(r.src)+'</div>'},
        {l:'Site',f:r=>esc(scode(r.site))},
        {l:'Supplier',f:r=>esc(pname(r.party))},
        {l:'Cum',n:1,f:r=>fmtI(r.cum,2)},
        {l:'Status',f:r=>r.billed?'<span class="pill g">'+esc(r.billed)+'</span>':'<span class="pill w">Unbilled</span>'},
        {l:'',cls:'act',f:r=>r.billed?'':'<button class="btn sm gh" onclick="tripForm(\''+r.id+'\')">Edit</button>'+
          '<button class="btn sm gh dngr" onclick="delRec(\'trips\',\''+r.id+'\',\'Trip\')">Del</button>'}],
      rows,{emptyTitle:'No trips recorded',empty:'Log each tipper trip with its chalan number.'})+'</div>';
  return h;
}
function deleteAllMisrouted(){
  function isCFTsrc(r){ var s=(r.src||r.material||'').toUpperCase();
    if(s.indexOf('MURUM')>=0||s.indexOf('EARTH')>=0) return false;
    return s.indexOf('HAVA')>=0||s.indexOf('DUMPER')>=0||s.indexOf('GITTI')>=0||s.indexOf('M-SAND')>=0||s.indexOf('MSAND')>=0||s.indexOf('SAND')>=0; }
  const wrong=S.trips.filter(r=>isCFTsrc(r));
  if(!wrong.length){toast('No misrouted entries found');return;}
  if(!confirm('Move '+wrong.length+' M-Sand/Gitti/Hava/Dumper entries to their correct Logbook sections? (Removes from Trip Sheet)')) return;
  // Map src to register
  var SRC_MAP=[
    {pat:/m[\s-]?sand|msand/i,reg:'msand'},
    {pat:/gitti/i,reg:'gitti'},
    {pat:/hava/i,reg:'hava'},
    {pat:/dumper/i,reg:'dumper'}
  ];
  if(!S.lb) S.lb={};
  ['msand','gitti','hava','dumper'].forEach(function(k){if(!S.lb[k])S.lb[k]=[];});
  var moved=0;
  wrong.forEach(function(t){
    var reg=null;
    for(var i=0;i<SRC_MAP.length;i++){if(SRC_MAP[i].pat.test(t.src||'')){reg=SRC_MAP[i].reg;break;}}
    if(!reg) return;
    var site=/barela/i.test(t.src||'')?'Barela':'Bypass';
    var party=(t.party||(t.src||'').split(/[—-]/).pop().trim()||'');
    var isTrip=(reg==='hava'||reg==='dumper');
    var mult=reg==='dumper'?300:600;
    var entry;
    if(isTrip){
      var trips=t.cum>0?Math.round(t.cum/mult):0;
      if(!trips) return;
      entry={date:toISO(t.date)||t.date,trips:trips,payment:'',site:site};
    } else {
      entry={date:toISO(t.date)||t.date,party:party,qty:(t.cum||600)+' cft',site:site,remark:''};
    }
    S.lb[reg].push(entry);
    moved++;
  });
  S.trips=S.trips.filter(r=>!isCFTsrc(r));
  save(); render();
  toast('✅ Moved '+moved+' entries to Logbook sections. Check M-Sand, Gitti, Hava, Dumper pages.');
}

function tripSheetDedup(){
  if(!S.trips||!S.trips.length){toast('No trips');return;}
  var seen={}, dups=[];
  S.trips.forEach(function(t){
    // Key: date + chalan + cum (if chalan blank, use date+src+cum)
    var key=(t.date||'')+'|'+(t.chalan||t.src||'')+'|'+(t.cum||0);
    if(seen[key]) dups.push(t);
    else seen[key]=t;
  });
  if(!dups.length){toast('✅ No duplicates in '+S.trips.length+' trips');return;}
  // Show what will be removed
  if(!confirm('Remove '+dups.length+' duplicate trip'+(dups.length>1?'s':'')+' from Trip Sheet?')) return;
  var ids=new Set(dups.map(function(d){return d.id;}));
  S.trips=S.trips.filter(function(t){return !ids.has(t.id);});
  save(); render();
  toast('✅ Removed '+ids.size+' duplicate'+(ids.size>1?'s':''));
}

function saveAtt(){
  const d=document.getElementById('f_adate').value, st=document.getElementById('f_asite').value,
        wk=document.getElementById('f_awork').value;
  if(!d){ toast('Pick a date',true); return; }
  let n=0;
  S.labour.filter(w=>w.status==='Active').forEach(w=>{
    const days=+document.getElementById('ad_'+w.id).value, ot=+document.getElementById('ao_'+w.id).value;
    if(!days&&!ot) return;
    const ex=S.attendance.find(a=>a.date===d&&a.site===st&&a.worker===w.id);
    if(ex){ ex.days=days; ex.ot=ot; ex.work=wk; logAudit('U','Attendance',dmyS(d),w.name+' → '+days+' day'); }
    else { S.attendance.push({id:uid(),date:d,site:st,worker:w.id,days:days,rate:w.rate,ot:ot,work:wk,billed:''});
      logAudit('C','Attendance',dmyS(d),w.name+' · '+days+' day at '+scode(st)); }
    n++;
  });
  S.attendance.sort((a,b)=>a.date<b.date?-1:1);
  save(); closeModal(); render(); toast(n+' worker'+(n===1?'':'s')+' marked for '+dmyS(d));
}

  }
  if(tab==='grn'){
    h+='<div class="card">'+tbl([
      {l:'GRN',k:'no',mono:1,f:r=>'<b class="mono">'+esc(r.no)+'</b>'},
      {l:'Date',f:r=>dmyS(r.date)},

      {l:'Site',f:r=>esc(scode(r.site))},
      {l:'Materials',f:r=>r.lines.map(l=>{const it=ITEM(l.item)||{};return esc(it.name)+' — '+fmtI(l.qty,3)+' '+esc(it.unit);}).join('<br>')},

      S.grn.filter(g=>siteOK(g.site)).slice().sort((a,b)=>a.date<b.date?1:-1),{emptyTitle:'No goods received yet'})+'</div>';
  }
  if(tab==='iss'){
    h+='<div class="card">'+tbl([
      {l:'Note',k:'no',mono:1,f:r=>'<b class="mono">'+esc(r.no)+'</b>'},

        {l:'Balance value',n:1,f:r=>fmtI(r.bv,0)}],ev)+'</div>';
  }

   {k:'date',l:'Receipt date',t:'date',req:1,def:today()},
   {k:'mode',l:'Mode',t:'sel',opts:['NEFT','RTGS','IMPS','Cheque','UPI','Cash'],def:'RTGS'},

}

  dl('KAPL_sales_register_FY2026-27.csv',csv([['Invoice','Date','Client','GSTIN','Site','HSN/SAC','Taxable','CGST','SGST','IGST','Total','Retention','Client TDS','Receivable','Received']].concat(
    S.sales.map(b=>{const p=P(b.party)||{};return [b.no,b.date,p.name,p.gstin,scode(b.site),b.hsn,b.taxable,b.cgst,b.sgst,b.igst,b.gross,b.retention,b.clientTds,b.receivable,b.received||0];}))),'text/csv');
