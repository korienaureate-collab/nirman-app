/* ================= VENDOR BILLS ================= */
function P_purch(){
  const tab=S.ui.tab||'all';
  let rows=S.purchases.filter(b=>siteOK(b.site)).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(tab==='open') rows=rows.filter(b=>R2(b.net-(b.paid||0))>0.5);
  if(tab==='rcm') rows=rows.filter(b=>b.rcm);
  if(tab==='msme') rows=rows.filter(b=>msmeDue(b));
  const all=S.purchases.filter(b=>siteOK(b.site));
  const due=R2(all.reduce((s,b)=>s+R2(b.net-(b.paid||0)),0));
  const overdue=all.filter(b=>{const d=msmeDue(b);return d&&d<today()&&R2(b.net-(b.paid||0))>0.5;});
  let h=pageHead('Vendor Bills & Purchases','Material, sub-contract, machinery hire and service bills with GST and TDS applied',
    '<button class="btn" onclick="expPurch()">Export CSV</button>'+
    '<button class="btn pri" onclick="purchForm()">+ New bill</button>');
  h+='<div class="tiles">'+
   tile('a','Bills booked',String(all.length),fmtC(all.reduce((s,b)=>s+b.taxable,0))+' taxable')+
   tile('s','ITC claimed',fmtC(all.reduce((s,b)=>s+b.cgst+b.sgst+b.igst,0)),'Subject to GSTR-2B match')+
   tile('w','TDS deducted',fmtC(all.reduce((s,b)=>s+b.tds,0)),'Across '+new Set(all.filter(b=>b.tds).map(b=>b.tdsSec)).size+' sections')+
   tile(overdue.length?'c':'g','MSME overdue',String(overdue.length),overdue.length?'Disallowable u/s 43B(h)':'All MSME dues within 45 days')+
  '</div>';
  if(overdue.length) h+='<div class="warnbox" style="margin-bottom:14px"><span>⚑</span><div><b>'+overdue.length+
    ' MSME bill'+(overdue.length===1?'':'s')+' past the 45-day limit.</b> Under section 43B(h) of the Income-tax Act the expense is '+
    'disallowed in the year of accrual unless the micro or small supplier is actually paid within 45 days. Total exposure '+
    fmtC(overdue.reduce((s,b)=>s+R2(b.net-(b.paid||0)),0))+'.</div></div>';
  h+='<div class="tabs">'+[['all','All bills'],['open','Open ('+all.filter(b=>R2(b.net-(b.paid||0))>0.5).length+')'],
    ['rcm','Reverse charge'],['msme','MSME suppliers']].map(t=>
    '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="S.ui.tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>';
  h+='<div class="card">'+tbl([
    {l:'Bill',f:r=>'<b class="mono">'+esc(r.no)+'</b><div class="hint">'+esc(r.vendorRef||r.kind)+'</div>'},
    {l:'Date',f:r=>'<span class="mono">'+dmyS(r.date)+'</span>'},
    {l:'Vendor',f:r=>{const p=P(r.party)||{};return esc(p.name)+'<div class="hint">'+(p.msme&&p.msme!=='Not Registered'?
      '<span class="pill s">'+esc(p.msme)+'</span> ':'')+esc(p.gstin||'Unregistered')+'</div>';}},
    {l:'Site',f:r=>esc(scode(r.site))},
    {l:'Head',f:r=>'<span class="hint">'+esc(accName(r.expAc||(r.kind==='Material Purchase'?'—':'')))+'</span>'},
    {l:'Taxable',n:1,f:r=>fmtI(r.taxable,0)},
    {l:'GST',n:1,f:r=>r.rcm?'<span class="pill w">RCM '+r.rcmRate+'%</span>':(r.gstRate?fmtI(r.cgst+r.sgst+r.igst,0):'—')},
    {l:'TDS',n:1,f:r=>r.tds?fmtI(r.tds,0)+'<div class="hint">'+esc(r.tdsSec)+' @'+r.tdsRate+'%</div>':'<span class="hint">—</span>'},
    {l:'Net payable',n:1,f:r=>'<b>'+fmtI(r.net,0)+'</b>'},
    {l:'Due',n:1,f:r=>{const d=R2(r.net-(r.paid||0)), m=msmeDue(r);
      if(d<=0.5) return '<span class="pill g">Paid</span>';
      return '<b style="color:var(--crit)">'+fmtI(d,0)+'</b>'+(m?'<div class="hint">MSME by '+dmyS(m)+'</div>':'');}},
    {l:'',cls:'act',f:r=>'<button class="btn sm" onclick="viewDoc(\'purch\',\''+r.id+'\')">View</button>'+
      (R2(r.net-(r.paid||0))>0.5?'<button class="btn sm gh" onclick="payForm(\''+r.id+'\')">Pay</button>'+
       '<button class="btn sm wa" onclick="waSendDoc(\'purch\',\''+r.id+'\')" title="Send on WhatsApp">'+ICONS.wa+'</button>':'')}],
    rows,{emptyTitle:'No bills in this view'})+'</div>';
  return h;
}
function purchForm(){
  const F=[
   {k:'kind',l:'Bill type',t:'sel',opts:['Expense','Service','Sub-contract','Machinery Hire','Labour Contract','Material Purchase'],req:1},
   {k:'date',l:'Bill date',t:'date',req:1,def:today()},
   {k:'party',l:'Vendor',t:'sel',opts:optAll(),req:1,onchange:'vendorDefaults()'},
   {k:'site',l:'Site',t:'sel',opts:optSites(),req:1},
   {k:'vendorRef',l:'Vendor invoice no.',t:'text',req:1},
   {k:'expAc',l:'Expense / cost head',t:'sel',opts:optAcc(['COGS','EXP','FA','DEP']),req:1,def:'5401'},
   {k:'hsn',l:'HSN / SAC',t:'text'},
   {k:'qty',l:'Quantity',t:'num'},{k:'unit',l:'Unit',t:'text'},
   {k:'rate',l:'Rate (₹)',t:'num',oninput:'syncAmt()'},
   {k:'taxable',l:'Taxable value (₹)',t:'num',req:1},
   {k:'gstRate',l:'GST rate %',t:'sel',opts:[0,5,12,18,28],def:18},
   {k:'rcm',l:'Reverse charge — tax payable by us, not by the vendor',t:'chk',w:2},
   {k:'tdsSec',l:'TDS section',t:'sel',opts:Object.keys(TDS_SEC).map(k=>[k,k+' — '+TDS_SEC[k].label]),blank:'— no TDS —'},
   {k:'narration',l:'Description',t:'ta',w:2,req:1}
  ];
  openForm('New vendor bill',F,{site:S.ui.site!=='ALL'?S.ui.site:'S1'},o=>{
    const r=buildVendorBill(o); toast('Bill '+r.no+' booked — '+(r.tds?'TDS '+rs(r.tds)+' deducted':'no TDS'));
    setTimeout(()=>viewDoc('purch',r.id),300);
  },true,'<p class="hint">TDS is applied only once the section threshold is crossed, counting what has already been paid to this vendor during the year.</p>');
}
function vendorDefaults(){
  const p=P(document.getElementById('f_party').value); if(!p) return;
  const t=document.getElementById('f_tdsSec'); if(t&&p.tds) t.value=p.tds;
  const r=document.getElementById('f_rcm'); if(r) r.checked=!!p.rcm;
  const g=document.getElementById('f_gstRate'); if(g&&p.rcm&&p.rcmRate) g.value=p.rcmRate;
}
function payForm(id){
  const b=S.purchases.find(x=>x.id===id), m=msmeDue(b);
  openForm('Pay bill — '+b.no,[
   {k:'date',l:'Payment date',t:'date',req:1,def:today()},
   {k:'mode',l:'Mode',t:'sel',opts:['NEFT','RTGS','IMPS','Cheque','UPI','Cash'],def:'NEFT'},
   {k:'ac',l:'Paid from',t:'sel',opts:optAcc(['CASH','BANK']),def:'1103',req:1}],
   {},o=>{ payBill(id,o.date,o.mode,o.ac); toast('Payment posted'); },false,
   '<div class="kv" style="margin-top:8px"><dt>Net payable</dt><dd>'+rs(R2(b.net-(b.paid||0)))+'</dd>'+
   '<dt>TDS held</dt><dd>'+(b.tds?rs(b.tds)+' u/s '+b.tdsSec:'None')+'</dd>'+
   (m?'<dt>MSME limit</dt><dd>'+dmyS(m)+(m<today()?' <span class="pill c">overdue</span>':'')+'</dd>':'')+'</div>');
}
function expPurch(){
  dl('KAPL_purchase_register_FY2026-27.csv',csv([['Bill','Date','Vendor','GSTIN','Vendor Inv','Site','Head','Taxable','CGST','SGST','IGST','RCM','TDS Sec','TDS Rate','TDS','Net','Paid']].concat(
    S.purchases.map(b=>{const p=P(b.party)||{};return [b.no,b.date,p.name,p.gstin,b.vendorRef,scode(b.site),accName(b.expAc),
      b.taxable,b.cgst,b.sgst,b.igst,b.rcmTax||0,b.tdsSec,b.tdsRate,b.tds,b.net,b.paid||0];}))),'text/csv');
  toast('Purchase register exported');
}
</script>

<script>
/* ================= PRINTABLE DOCUMENTS ================= */
function coHead(){ const c=S.company;
  return '<div class="cohead-row">'+(c.logoMark?'<img class="cologo" src="'+c.logoMark+'" alt="">':'')+
   '<div><h2>'+esc(c.name)+'</h2><div class="co">'+esc(c.unit)+'<br>'+esc(c.addr)+'<br>'+
   'GSTIN '+esc(c.gstin)+' · PAN '+esc(c.pan)+' · TAN '+esc(c.tan)+'<br>CIN '+esc(c.cin)+' · '+esc(c.udyam)+'</div></div></div>'; }
function pfield(k,v){ return '<div class="pf"><div class="k">'+esc(k)+'</div><div class="v">'+(v||'—')+'</div></div>'; }
function viewDoc(kind,id){
  const b=(kind==='sales'?S.sales:S.purchases).find(x=>x.id===id); if(!b) return;
  const p=P(b.party)||{}; const isSale=kind==='sales';
  const intra=isIntra(p);
  let h='<div class="paper" id="pdoc"><div class="ph">'+coHead()+
   '<div><div class="dt">'+(isSale?'Tax Invoice':'Vendor Bill — Booked')+'</div>'+
   '<div class="dn">'+esc(b.no)+'</div><div class="dn" style="color:var(--muted)">'+dmyS(b.date)+'</div></div></div>';
  h+='<div class="pgrid">'+
   '<div>'+pfield(isSale?'Billed to':'Supplier',esc(p.name)+'<br><span style="color:var(--muted);font-size:11px">'+
     esc(p.addr||'')+'<br>GSTIN '+esc(p.gstin||'Unregistered')+' · PAN '+esc(p.pan||'—')+'</span>')+
     pfield('Site / place of supply',esc(sname(b.site))+' — '+esc(S.company.state)+' ('+S.company.stateCode+')')+'</div>'+
   '<div>'+pfield('Financial year','2026-27')+
     pfield('Supply type',intra?'Intra-State — CGST + SGST':'Inter-State — IGST')+
     pfield('Document type',esc(b.kind))+
     (b.vendorRef?pfield('Supplier reference',esc(b.vendorRef)):'')+
     (b.rcm?pfield('Reverse charge','Yes — tax payable by recipient u/s 9(3)/9(4)'):pfield('Reverse charge','No'))+
   '</div></div>';
  h+='<table><thead><tr><th style="width:34px">Sr</th><th>HSN / SAC</th><th>Description</th><th class="n">Qty</th>'+
    '<th class="n">Unit</th><th class="n">Rate</th><th class="n">Taxable value</th></tr></thead><tbody>'+
   '<tr><td>1</td><td class="mono">'+esc(b.hsn||'—')+'</td><td>'+esc(b.narration)+'</td>'+
   '<td class="n">'+(b.qty?fmtI(b.qty,2):'—')+'</td><td class="n">'+esc(b.unit||'—')+'</td>'+
   '<td class="n">'+(b.rate?fmtI(b.rate,2):'—')+'</td><td class="n">'+fmtI(b.taxable)+'</td></tr>';
  if(b.meta&&b.meta.adj) h+='<tr><td></td><td></td><td>Certified commercial adjustment / rounding to match approved bill value</td>'+
    '<td class="n"></td><td class="n"></td><td class="n"></td><td class="n">'+fmtI(b.meta.adj)+'</td></tr>';
  h+='<tr class="tot"><td colspan="6">Taxable value</td><td class="n">'+fmtI(b.taxable)+'</td></tr>';
  if(b.cgst) h+='<tr><td colspan="6" style="text-align:right">CGST @ '+(b.gstRate/2)+'%</td><td class="n">'+fmtI(b.cgst)+'</td></tr>';
  if(b.sgst) h+='<tr><td colspan="6" style="text-align:right">SGST @ '+(b.gstRate/2)+'%</td><td class="n">'+fmtI(b.sgst)+'</td></tr>';
  if(b.igst) h+='<tr><td colspan="6" style="text-align:right">IGST @ '+b.gstRate+'%</td><td class="n">'+fmtI(b.igst)+'</td></tr>';
  if(b.rcm) h+='<tr><td colspan="6" style="text-align:right">GST under reverse charge @ '+b.rcmRate+'% (paid by recipient)</td><td class="n">'+fmtI(b.rcmTax)+'</td></tr>';
  h+='<tr class="tot"><td colspan="6">'+(b.rcm?'Bill total (excl. RCM tax)':'Invoice total')+'</td><td class="n">'+fmtI(b.gross)+'</td></tr>';
  if(isSale){
    if(b.retention) h+='<tr><td colspan="6" style="text-align:right">Less: retention @ '+b.retPct+'%</td><td class="n">('+fmtI(b.retention)+')</td></tr>';
    if(b.clientTds) h+='<tr><td colspan="6" style="text-align:right">Less: TDS deducted by client @ '+b.tdsPct+'%</td><td class="n">('+fmtI(b.clientTds)+')</td></tr>';
    h+='<tr class="tot"><td colspan="6">Net receivable</td><td class="n">'+fmtI(b.receivable)+'</td></tr>';
  }else{
    if(b.tds) h+='<tr><td colspan="6" style="text-align:right">Less: TDS u/s '+b.tdsSec+' @ '+b.tdsRate+'%</td><td class="n">('+fmtI(b.tds)+')</td></tr>';
    h+='<tr class="tot"><td colspan="6">Net payable</td><td class="n">'+fmtI(b.net)+'</td></tr>';
  }
  h+='</tbody></table>';
  h+='<div class="words"><b>Amount in words:</b> '+words(isSale?b.receivable:b.net)+'</div>';
  if(b.tds&&!isSale) h+='<p style="font-size:11px;color:var(--muted)">TDS basis — '+esc(b.tdsReason)+
    '. Deposit by the 7th of the following month vide Challan ITNS-281; report in Form 26Q for the quarter.</p>';
  if(b.rcm) h+='<p style="font-size:11px;color:var(--muted)">Reverse charge: tax of '+rs(b.rcmTax)+
    ' is to be paid in cash through GSTR-3B Table 3.1(d); the corresponding credit is claimed in Table 4(A)(3) of the same return.</p>';
  /* measurement annexure */
  if(b.meta&&b.meta.hours!==undefined) h+=mbAbstract(b);
  if(b.meta&&b.meta.trips!==undefined) h+=tripAbstract(b);
  h+='<div class="sign"><div>'+esc(isSale?'Prepared by':'Checked by Accountant')+'</div><div>Site-in-charge — certified</div>'+
    '<div>For '+esc(S.company.name)+'<br><span style="font-size:10px">'+esc(S.company.signatory)+', '+esc(S.company.designation)+'</span></div></div>';
  h+='</div>';
  const due=isSale?R2(b.receivable-(b.received||0)):R2(b.net-(b.paid||0));
  modal((isSale?'Tax Invoice ':'Vendor Bill ')+b.no,h,
   '<button class="btn" onclick="closeModal()">Close</button>'+
   '<button class="btn" onclick="printEl()">Print / PDF</button>'+
   '<button class="btn wa" onclick="waSendDoc(\''+kind+'\',\''+b.id+'\')">'+ICONS.wa+' Send on WhatsApp</button>'+
   (due>0.5?'<button class="btn" onclick="waMarkSettled(\''+kind+'\',\''+b.id+'\')">Mark cleared — WhatsApp confirmed</button>':'')+
   '<button class="btn pri" onclick="closeModal();go(\''+(isSale?'sales':'purch')+'\')">Done</button>',true);
}
function waSendDoc(kind,id){
  const b=(kind==='sales'?S.sales:S.purchases).find(x=>x.id===id); if(!b) return;
  const p=P(b.party)||{}; const isSale=kind==='sales';
  const due=isSale?R2(b.receivable-(b.received||0)):R2(b.net-(b.paid||0));
  const amt=isSale?b.receivable:b.net;
  let msg=(isSale?'Tax Invoice ':'Bill ')+b.no+' dated '+dmyS(b.date)+' — '+S.company.name+'\n'+
   (isSale?'Billed to':'From')+': '+(p.name||'—')+'\nSite: '+sname(b.site)+'\n'+
   'Amount: '+rs(amt)+(due>0.5?'\nBalance due: '+rs(due):'\nStatus: Fully settled')+
   (isSale&&due>0.5&&S.company.bank?'\n\nPlease pay to:\n'+S.company.name+'\n'+S.company.bank:'')+
   (isSale&&due>0.5&&S.company.upi?'\nUPI: '+S.company.upi:'')+
   '\n\nSent from Nirman Ledger — '+S.company.unit;
  const phone=p.phone||p.mobile||'';
  waShare(phone,msg);
  logAudit('U',isSale?'Sales Invoice':'Vendor Bill',b.no,'Shared on WhatsApp'+(phone?' to '+phone:' — recipient chosen in WhatsApp'));
  save();
}
function quickDemand(){
  openForm('WhatsApp payment demand',[
   {k:'qname',l:'Contact name',t:'text',req:1},
   {k:'qphone',l:'WhatsApp number',t:'text',req:1,hint:'With country code, e.g. 91XXXXXXXXXX — a fresh number is added to the party master automatically.'},
   {k:'qamt',l:'Amount demanded (₹)',t:'num',req:1},
   {k:'qsite',l:'Site',t:'sel',opts:optSites(),blank:'— none / head office —',def:S.ui.site!=='ALL'?S.ui.site:''},
   {k:'qpurpose',l:'Purpose / narration',t:'ta',w:2,req:1}
  ],{},o=>{
    let party=S.parties.find(p=>p.phone&&waDigits(p.phone)===waDigits(o.qphone));
    if(!party){
      party={id:uid(),name:o.qname,type:'Customer',cat:'Ad-hoc / WhatsApp',gstin:'',pan:'',
        gstTreat:'Unregistered',state:S.company.stateCode,tds:'',tdsRate:0,msme:'',terms:0,
        phone:o.qphone,addr:'',ac:'1201'};
      S.parties.push(party);
      logAudit('C','Party',party.id,party.name+' — added automatically from a WhatsApp payment demand');
    }
    const rec=buildSalesBill({date:today(),party:party.id,site:o.qsite||'',revAc:'7008',
      narration:o.qpurpose,taxable:+o.qamt,gstRate:0,retPct:0,tdsPct:0,hsn:'',qty:1,unit:'Lot',
      rate:+o.qamt,kind:'WhatsApp Payment Demand'});
    const msg='Payment request — '+S.company.name+'\nRef: '+rec.no+' dated '+dmyS(rec.date)+'\n'+
     'To: '+party.name+'\nFor: '+o.qpurpose+'\nAmount: '+rs(rec.receivable)+
     (S.company.bank?'\n\nPlease pay to:\n'+S.company.name+'\n'+S.company.bank:'')+
     (S.company.upi?'\nUPI: '+S.company.upi:'')+
     '\n\nSent from Nirman Ledger — '+S.company.unit;
    waShare(party.phone,msg);
    logAudit('U','Sales Invoice',rec.no,'WhatsApp demand sent to '+party.phone);
    toast('Demand '+rec.no+' generated — WhatsApp opened to send it');
  },true,'<p class="hint">This raises a real voucher — it shows up in Vouchers, Day Book and Sales Invoices straight away — '+
   'and opens WhatsApp with the request ready to send. A page like this one cannot listen for an incoming WhatsApp message on its own; '+
   'once the money actually arrives, open the invoice from Sales Invoices and use “Mark cleared — WhatsApp confirmed” to settle the account in one step.</p>');
}
function waMarkSettled(kind,id){
  if(kind==='sales'){
    const b=S.sales.find(x=>x.id===id); if(!b) return;
    const due=R2(b.receivable-(b.received||0)); if(due<=0){ toast('Already fully received'); return; }
    if(!confirm('Confirm '+rs(due)+' received via WhatsApp / UPI and clear this account?')) return;
    receiveBill(id,today(),'UPI (WhatsApp confirmed)','1103');
  }else{
    const b=S.purchases.find(x=>x.id===id); if(!b) return;
    const due=R2(b.net-(b.paid||0)); if(due<=0){ toast('Already fully paid'); return; }
    if(!confirm('Confirm '+rs(due)+' paid via WhatsApp / UPI and clear this account?')) return;
    payBill(id,today(),'UPI (WhatsApp confirmed)','1103');
  }
  save(); closeModal(); render(); toast('Account fully cleared');
}
function mbAbstract(b){
  const m=MACH(b.meta.machine)||{};
  const logs=S.machineLogs.filter(l=>b.meta.logs.indexOf(l.id)>=0);
  let h='<div style="page-break-before:always"></div><h3 style="margin-top:26px;font-size:15px">Annexure A — Machine deployment &amp; measurement abstract</h3>'+
   '<p style="font-size:11px;color:var(--muted)">To be read with the machine log book, site photographs, MB entries and the work order. '+
   (b.meta.wo?'Work order '+esc(b.meta.wo)+'. ':'')+'Machine '+esc(m.code||'')+' — '+esc(m.name||'')+' ('+esc(m.reg||'')+').</p>'+
   '<table><thead><tr><th>Date</th><th>Site</th><th>Operator</th><th>Work executed</th><th class="n">Machine hours</th></tr></thead><tbody>';
  logs.slice(0,60).forEach(l=>h+='<tr><td class="mono">'+dmyS(l.date)+'</td><td>'+esc(scode(l.site))+'</td><td>'+esc(l.operator||'')+
    '</td><td>'+esc(l.work||'')+'</td><td class="n">'+fmtI(l.hours,2)+'</td></tr>');
  if(logs.length>60) h+='<tr><td colspan="5" style="color:var(--muted)">… '+(logs.length-60)+' further entries in the machine log book</td></tr>';
  h+='<tr class="tot"><td colspan="4">Total machine hours ('+logs.length+' working days)</td><td class="n">'+fmtI(b.meta.hours,2)+'</td></tr>'+
   '<tr><td colspan="4" style="text-align:right">Rate per machine hour</td><td class="n">'+fmtI(b.meta.rate)+'</td></tr>'+
   '<tr class="tot"><td colspan="4">Gross value</td><td class="n">'+fmtI(R2(b.meta.hours*b.meta.rate))+'</td></tr></tbody></table>';
  return h;
}
function tripAbstract(b){
  const trips=S.trips.filter(t=>b.meta.tripIds.indexOf(t.id)>=0);
  const byDate={};
  trips.forEach(t=>{ byDate[t.date]=byDate[t.date]||{n:0,c:0}; byDate[t.date].n++; byDate[t.date].c+=t.cum; });
  let h='<div style="page-break-before:always"></div><h3 style="margin-top:26px;font-size:15px">Annexure A — Trip sheet &amp; quantity abstract</h3>'+

function vchSum(n){ let d=0,c=0;

  el.innerHTML=Math.abs(d-c)<0.02&&d>0?'<span style="color:var(--good)">Balanced — ready to post.</span>':
    'Difference '+rs(Math.abs(R2(d-c)))+' — debits must equal credits.';
}
function saveVch(type,n){
  const lines=[];
  for(let i=0;i<n;i++){ const a=document.getElementById('va_'+i).value;
    const d=+document.getElementById('vd_'+i).value||0, c=+document.getElementById('vc_'+i).value||0;
    if(a&&(d||c)) lines.push({ac:a,dr:d,cr:c,note:document.getElementById('vn_'+i).value}); }
  if(lines.length<2){ toast('A voucher needs at least two entries',true); return; }
  try{
    const v=postVoucher({type:type,date:document.getElementById('f_vdate').value,
      narration:document.getElementById('f_vnar').value,site:document.getElementById('f_vsite').value,lines:lines});

    v.lines.forEach(l=>{ if(l.ac===code) rows.push({date:v.date,no:v.no,type:VT[v.type]||v.type,

  });
  let bal=a.obSide==='Dr'?(a.ob||0):-(a.ob||0);
  rows.forEach(r=>{ bal=R2(bal+r.dr-r.cr); r.bal=bal; });
  const drT=R2(rows.reduce((s,r)=>s+r.dr,0)), crT=R2(rows.reduce((s,r)=>s+r.cr,0));
  let h=pageHead('Ledger Accounts','Account-wise postings with running balance',

<script>
/* ================= FINANCIAL STATEMENTS (Schedule III) ================= */
function statements(upto){
  const b=balances(upto||FY_END);
  const sum=cls=>R2(S.coa.filter(a=>cls.indexOf(a.cls)>=0).reduce((s,a)=>s+b[a.code].bal,0));
  const lines=cls=>S.coa.filter(a=>cls.indexOf(a.cls)>=0&&Math.abs(b[a.code].bal)>0.004)
    .map(a=>({code:a.code,name:a.name,v:b[a.code].bal}));
  const rev=-sum(['INC']), oi=-sum(['OI']);
  const EMPCODES=['6101','6102','6103','6104','6105'], FINCODES=['6601','6602','6603','6604','6605','6606'];
  const TAXCODES=['6804','6805']; /* current & deferred tax — excluded from operating expenses, shown as tax below the line */
  const bb=c=>b[c]?b[c].bal:0;
  const mat=R2(S.coa.filter(a=>a.cls==='COGS'&&a.code<'5200').reduce((s,a)=>s+bb(a.code),0));
  const emp=R2(S.coa.filter(a=>(a.cls==='COGS'&&a.code>='5200'&&a.code<'5300')||EMPCODES.indexOf(a.code)>=0)
    .reduce((s,a)=>s+bb(a.code),0));
  const subc=R2(S.coa.filter(a=>a.cls==='COGS'&&a.code>='5300'&&a.code<'5500').reduce((s,a)=>s+bb(a.code),0));
  const fin=R2(FINCODES.reduce((s,c)=>s+bb(c),0));
  const dep=sum(['DEP']);
  const othExp=R2(sum(['EXP','OEX'])-R2(EMPCODES.reduce((s,c)=>s+bb(c),0))-fin-R2(TAXCODES.reduce((s,c)=>s+bb(c),0)));
  const totExp=R2(mat+emp+subc+fin+dep+othExp);
  const pbt=R2(rev+oi-totExp);
  const taxPosted=R2(TAXCODES.reduce((s,c)=>s+bb(c),0));
  /* Use the actual provision booked in the ledger; only estimate (unbooked, informational) if none has been posted yet */
  const tax=taxPosted>0.004?taxPosted:R2(Math.max(0,pbt)*0.2517);
  const taxIsEstimate=taxPosted<=0.004;
  const pat=R2(pbt-(taxIsEstimate?0:tax));
  /* balance sheet */
  const eq=R2(-sum(['EQ']));
  const fa=R2(sum(['FA'])+sum(['ACCDEP']));
  const inv=sum(['STOCK']), ar=sum(['AR']), cash=sum(['CASH','BANK']), oca=sum(['OCA']);
  const ap=R2(-sum(['AP'])), ocl=R2(-sum(['OCL'])), ltl=R2(-sum(['LTL']));
  return {b,lines,rev,oi,mat,emp,subc,fin,dep,othExp,totExp,pbt,tax,taxIsEstimate,pat,eq,fa,inv,ar,cash,oca,ap,ocl,ltl,
    assets:R2(fa+inv+ar+cash+oca), liabs:R2(eq+pat+ap+ocl+ltl)};
}

function msmeSummary(){
  const by={};

    h+='<p class="hint" style="max-width:76ch;margin-top:12px">Section 16(2)(aa) allows credit only where the supplier has reported the '+
     'invoice and it appears in your GSTR-2B. The second proviso to section 16(2) requires the credit to be reversed with interest if the '+

  if(tab==='rcm'){

/* ================= TDS ================= */
function P_tds(){
  const tab=S.ui.tab||'reg';
  const all=S.purchases.filter(b=>b.tdsSec);
  const ded=all.filter(b=>b.tds>0);
  const tot=R2(ded.reduce((s,b)=>s+b.tds,0));
  const pending=tdsPayable();
  let h=pageHead('TDS Register','Deduction, deposit and Form 26Q reporting · TAN '+S.company.tan,
   '<button class="btn" onclick="expTDS()">Export 26Q data</button><button class="btn pri" onclick="tdsDeposit()">Record challan</button>');
  h+='<div class="tiles">'+
   tile('a','TDS deducted',fmtC(tot),ded.length+' bills this year')+
   tile(pending>0?'c':'g','Undeposited',fmtC(pending),'Due by the 7th of the following month')+
   tile('s','Sections in use',String(new Set(ded.map(b=>b.tdsSec)).size),Object.keys(TDS_SEC).length+' configured')+
   tile('w','TDS on our receipts',fmtC(balOf('1507')),'Claim in the income-tax return')+
  '</div>';

   .map(t=>'<button class="tab'+(tab===t[0]?' on':'')+'" onclick="S.ui.tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>';
  if(tab==='reg'){
    h+='<div class="card">'+tbl([
     {l:'Bill',k:'no',mono:1},{l:'Date',f:r=>dmyS(r.date)},{l:'Deductee',f:r=>esc(pname(r.party))},
     {l:'PAN',f:r=>{const q=P(r.party)||{};return q.pan?'<span class="mono">'+esc(q.pan)+'</span>':'<span class="pill c">No PAN</span>';}},
     {l:'Section',f:r=>'<span class="pill a">'+esc(r.tdsSec)+'</span>'},
     {l:'Amount paid',n:1,f:r=>fmtI(r.taxable,0)},
     {l:'Rate',n:1,f:r=>r.tdsRate?r.tdsRate+'%':'—'},
     {l:'TDS',n:1,f:r=>r.tds?'<b>'+fmtI(r.tds,0)+'</b>':'—'},
     {l:'Basis',f:r=>'<div class="hint" style="max-width:300px">'+esc(r.tdsReason||'')+'</div>'},
     {l:'Deposit by',f:r=>{const d=new Date(r.date); const m=d.getUTCMonth();
       const due=new Date(Date.UTC(d.getUTCFullYear(),m+1,7)).toISOString().slice(0,10);
       return r.tds?'<span class="mono">'+dmyS(due)+'</span>':'—';}}],
     all.slice().sort((a,b)=>a.date<b.date?1:-1),{emptyTitle:'No TDS-liable bills yet'})+'</div>';
  }
  if(tab==='sec'){
    const by={};
    all.forEach(b=>{ by[b.tdsSec]=by[b.tdsSec]||{s:b.tdsSec,base:0,tds:0,n:0,parties:new Set()};
      by[b.tdsSec].base+=b.taxable; by[b.tdsSec].tds+=b.tds; by[b.tdsSec].n++; by[b.tdsSec].parties.add(b.party); });
    h+='<div class="card">'+tbl([
     {l:'Section',f:r=>'<b>'+esc(r.s)+'</b>'},{l:'Nature of payment',f:r=>esc(TDS_SEC[r.s].label)},
     {l:'Single-bill limit',n:1,f:r=>fmtI(TDS_SEC[r.s].single,0)},
     {l:'Annual limit',n:1,f:r=>fmtI(TDS_SEC[r.s].annual,0)},
     {l:'Rate',n:1,f:r=>TDS_SEC[r.s].co+'%'},
     {l:'Deductees',n:1,f:r=>r.parties.size},{l:'Bills',n:1,f:r=>r.n},
     {l:'Amount paid',n:1,f:r=>fmtI(r.base,0)},{l:'TDS deducted',n:1,f:r=>'<b>'+fmtI(r.tds,0)+'</b>'},
     {l:'Liability a/c',f:r=>'<span class="mono">'+TDS_SEC[r.s].ac+'</span> '+fmtI(-balOf(TDS_SEC[r.s].ac),0)}],
     Object.values(by))+'</div>';
    h+='<p class="hint" style="max-width:78ch;margin-top:12px">Rates shown are for deductees who are companies or firms. '+
     'Where the deductee is an individual or HUF, section 194C is 1% instead of 2%. Without a valid PAN, section 206AA applies '+
     'the higher of the prescribed rate or 20%. Late deposit attracts interest at 1.5% per month under section 201(1A), '+
     'and late filing of the quarterly return attracts ₹200 per day under section 234E.</p>';
  }
  if(tab==='thr'){
    const by={};
    S.purchases.forEach(b=>{ if(!b.tdsSec) return; const k=b.party+'|'+b.tdsSec;
      by[k]=by[k]||{p:b.party,s:b.tdsSec,ytd:0,tds:0,max:0};
      by[k].ytd+=b.taxable; by[k].tds+=b.tds; by[k].max=Math.max(by[k].max,b.taxable); });
    h+='<div class="card"><header><h3>Vendor-wise threshold position</h3>'+
     '<span class="sub">Once the aggregate crosses the annual limit, TDS applies to the whole amount, not just the excess</span></header>'+
     tbl([{l:'Vendor',f:r=>esc(pname(r.p))},{l:'Section',f:r=>'<span class="pill a">'+esc(r.s)+'</span>'},
      {l:'Paid year to date',n:1,f:r=>fmtI(r.ytd,0)},
      {l:'Annual limit',n:1,f:r=>fmtI(TDS_SEC[r.s].annual,0)},
      {l:'Headroom',f:r=>{const pct=Math.min(100,r.ytd/TDS_SEC[r.s].annual*100);
        return '<div class="bar" style="width:90px"><i style="width:'+pct+'%;background:'+(pct>=100?'var(--crit)':pct>70?'var(--warn)':'var(--good)')+
        '"></i></div><span class="hint">'+fmtI(pct,0)+'%</span>';}},
      {l:'Largest single bill',n:1,f:r=>fmtI(r.max,0)},
      {l:'TDS so far',n:1,f:r=>'<b>'+fmtI(r.tds,0)+'</b>'},
      {l:'',f:r=>r.ytd>TDS_SEC[r.s].annual?'<span class="pill c">Crossed</span>':
        (r.max>=TDS_SEC[r.s].single?'<span class="pill w">Single-bill limit hit</span>':'<span class="pill g">Below limit</span>')}],
      Object.values(by).sort((a,b)=>b.ytd-a.ytd))+'</div>';
  }
  if(tab==='q'){
    const qs=[['Q1','2026-04-01','2026-06-30','2026-07-31'],['Q2','2026-07-01','2026-09-30','2026-10-31'],
      ['Q3','2026-10-01','2026-12-31','2027-01-31'],['Q4','2027-01-01','2027-03-31','2027-05-31']];
    h+='<div class="card"><header><h3>Form 26Q — quarterly statement of TDS on payments other than salary</h3></header>'+
     tbl([{l:'Quarter',f:r=>'<b>'+r[0]+'</b>'},{l:'Period',f:r=>dmyS(r[1])+' — '+dmyS(r[2])},
      {l:'Deductees',n:1,f:r=>String(new Set(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).map(b=>b.party)).size)},
      {l:'Bills',n:1,f:r=>String(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).length)},
      {l:'Amount paid',n:1,f:r=>fmtI(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).reduce((s,b)=>s+b.taxable,0),0)},
      {l:'TDS',n:1,f:r=>'<b>'+fmtI(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).reduce((s,b)=>s+b.tds,0),0)+'</b>'},
      {l:'Return due',f:r=>'<span class="mono">'+dmyS(r[3])+'</span>'},
      {l:'',f:r=>r[3]<today()?'<span class="pill c">Past due</span>':'<span class="pill g">Upcoming</span>'}],qs)+'</div>';
    h+='<div class="card" style="margin-top:14px"><header><h3>Form 24Q — salary TDS</h3></header>'+
     '<div class="body"><div class="kv"><dt>Section</dt><dd>192 — salary</dd>'+
     '<dt>Deducted this year</dt><dd>'+rs(S.payroll.filter(p=>p.kind==='SALARY').reduce((s,p)=>s+p.tds,0))+'</dd>'+
     '<dt>Employees on roll</dt><dd>'+S.staff.filter(e=>e.status==='Active').length+'</dd>'+
     '<dt>Form 16 due</dt><dd>15 June 2027 for FY 2026-27</dd></div></div></div>';
  }
  return h;
}
function tdsDeposit(){
  openForm('Record TDS challan (ITNS-281)',[
   {k:'date',l:'Deposit date',t:'date',req:1,def:today()},
   {k:'sec',l:'Section',t:'sel',opts:Object.keys(TDS_SEC).map(k=>[k,k+' — '+TDS_SEC[k].label]),req:1},
   {k:'amt',l:'Amount (₹)',t:'num',req:1},

function P_audit(){
  const q=(S.ui.aq||'').toLowerCase();

  const opf=S.ui.aop||'';

  let h=pageHead('Audit Trail','Every create, edit and delete — Rule 3, Companies (Accounts) Rules 2014',
   '<button class="btn" onclick="expAudit()">Export CSV</button>');
  h+='<div class="warnbox" style="margin-bottom:14px"><span>&#128274;</span><div><b>This log cannot be disabled.</b> '+
   'Every posting, edit and deletion anywhere in the system is written here automatically, with the date, time and user. '+
   'It satisfies the edit-log requirement in the proviso to Rule 3(1) of the Companies (Accounts) Rules, 2014.</div></div>';
  h+='<div class="tiles">'+
   tile('g','Created',String(S.audit.filter(a=>a.op==='C').length),'')+
   tile('w','Modified',String(S.audit.filter(a=>a.op==='U').length),'')+
   tile('c','Deleted',String(S.audit.filter(a=>a.op==='D').length),'')+
   tile('a','Total entries',String(S.audit.length),'Since the books were opened')+
  '</div>';

   '<label class="f" style="margin:0"><span>Action</span><select class="in" onchange="S.ui.aop=this.value;render()">'+
   '<option value="">All</option><option value="C"'+(opf==='C'?' selected':'')+'>Created</option>'+
   '<option value="U"'+(opf==='U'?' selected':'')+'>Modified</option>'+
   '<option value="D"'+(opf==='D'?' selected':'')+'>Deleted</option></select></label></div></div>';
  h+='<div class="card">'+tbl([
   {l:'Timestamp',f:r=>'<span class="mono">'+new Date(r.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</span>'},
   {l:'Action',f:r=>'<span class="audit op-'+r.op+'">'+({C:'CREATE',U:'UPDATE',D:'DELETE'}[r.op])+'</span>'},

  return h;
}

function migrateTripsToLb(){
  if(!S.lb) S.lb={};
  ['murum','gitti','msand','hava','dumper'].forEach(function(k){ if(!S.lb[k]) S.lb[k]=[]; });
  if(!S.trips||!S.trips.length) return 0;

  // Map trip src labels to logbook registers
  var SRC_MAP=[
    {pat:/m[\s-]?sand|msand/i, reg:'msand'},
    {pat:/gitti/i,              reg:'gitti'},
    {pat:/hava/i,               reg:'hava'},
    {pat:/dumper/i,             reg:'dumper'},
    {pat:/murum|murrum|earth/i, reg:'murum'}
  ];
  var added=0;

  S.trips.forEach(function(t){
    var src=t.src||'';
    if(!src) return;
    // Find which register this trip belongs to
    var reg=null;
    for(var i=0;i<SRC_MAP.length;i++){
      if(SRC_MAP[i].pat.test(src)){reg=SRC_MAP[i].reg;break;}
    }
    if(!reg) return;

    // Detect site from src string
    var site=/barela/i.test(src)?'Barela':'Bypass';

    // Extract real party name from src — format is "M-SAND Bypass — Madan Yadav"
    // Split on em-dash (—) or regular dash surrounded by spaces
    var parts=src.split(/\s*[—\-]{1,2}\s*/);
    var party=parts.length>1?parts[parts.length-1].trim():(t.party||'');
    // If party looks like a src label (all caps, no spaces of real name), use t.party instead
    if(!party||/^(M-SAND|GITTI|HAVA|DUMPER|MURUM|BYPASS|BARELA)/i.test(party)) party=t.party||'';

    var tDate=toISO(t.date)||t.date;
    var isTrip=(reg==='hava'||reg==='dumper');
    var entry;

    if(isTrip){
      var mult=reg==='dumper'?300:600;
      var trips=t.cum>0?Math.round(t.cum/mult):0;
      entry={date:tDate, trips:trips, payment:'', site:site};
      // Skip zero-trip entries from migration (garbage data)
      if(trips<=0) return;
    } else if(reg==='murum'){
      // qty = CUM value (numeric), remark = chalan/src for reference
      entry={date:tDate, qty:+(t.cum||0), remark:t.chalan||(t.src||'').split('—').pop().trim()||'', site:site};
      if(!entry.qty||entry.qty<=0) return; // skip zero-cum murum entries
    } else {
      entry={date:tDate, party:party, qty:(t.cum||600)+' cft', site:site, remark:''};
    }

    // Check not already in lb (by date + site, loose match)
    var exists=S.lb[reg].find(function(r){
      return (toISO(r.date)||r.date)===tDate && (r.site||'Bypass')===site;
    });
    if(!exists){ S.lb[reg].push(entry); added++; }
  });

  if(added>0) save();
  return added;
}

function fixAllDates(){
  var fixed=0;
  // Fix machineLogs
  (S.machineLogs||[]).forEach(function(r){
    var n=toISO(r.date); if(n&&n!==r.date){r.date=n;fixed++;}
  });
  // Fix trips
  (S.trips||[]).forEach(function(t){
    var n=toISO(t.date); if(n&&n!==t.date){t.date=n;fixed++;}
  });
  // Fix all logbook registers
  if(S.lb){
    ['murum','gitti','msand','hava','dumper'].forEach(function(reg){
      (S.lb[reg]||[]).forEach(function(r){
        var n=toISO(r.date); if(n&&n!==r.date){r.date=n;fixed++;}
      });
    });
  }
  // Also fix wrong year 2024→2026 if all other data is 2026
  var allYears=new Set();
  (S.machineLogs||[]).forEach(function(r){if(r.date)allYears.add(r.date.slice(0,4));});
  (S.trips||[]).forEach(function(t){if(t.date)allYears.add(t.date.slice(0,4));});
  var yearFixed=0;
  if(allYears.has('2026')&&allYears.has('2024')){
    if(confirm('Found entries with year 2024 mixed with 2026. Fix 2024→2026?')){
      (S.machineLogs||[]).forEach(function(r){if((r.date||'').startsWith('2024-')){r.date=r.date.replace('2024-','2026-');yearFixed++;}});
      (S.trips||[]).forEach(function(t){if((t.date||'').startsWith('2024-')){t.date=t.date.replace('2024-','2026-');yearFixed++;}});
      if(S.lb){['murum','gitti','msand','hava','dumper'].forEach(function(reg){
        (S.lb[reg]||[]).forEach(function(r){if((r.date||'').startsWith('2024-')){r.date=r.date.replace('2024-','2026-');yearFixed++;}});
      });}
    }
  }
  save(); render();
  toast('\u2705 Fixed '+fixed+' date formats'+(yearFixed?' + '+yearFixed+' year corrections':''));
}

function restoreJSON(inp){
  const f=inp.files[0]; if(!f) return;

    if(!confirm('Restore this backup? Your current books in this browser will be replaced.')) return;
            if(!j.lb) j.lb={};
            if(!j.lb.murum) j.lb.murum=[];
            if(!j.lb.gitti) j.lb.gitti=[];
            if(!j.lb.msand) j.lb.msand=[];
            if(!j.lb.hava)  j.lb.hava=[];
            if(!j.lb.dumper)j.lb.dumper=[];
    S=j;
    // Normalize dates immediately after restore
    if(S.machineLogs) S.machineLogs.forEach(function(l){ l.date=toISO(l.date)||l.date; });
    if(S.trips) S.trips.forEach(function(t){ t.date=toISO(t.date)||t.date; });
    if(!S.lb) S.lb={};
    ['murum','gitti','msand','hava','dumper'].forEach(function(k){ if(!S.lb[k]) S.lb[k]=[]; });
    // Only migrate if logbook is completely empty (avoid adding on top of existing data)
    var lbHasData=['msand','gitti','hava','dumper','murum'].some(function(k){
      return S.lb&&S.lb[k]&&S.lb[k].length>0;
    });
    var migrated=lbHasData?0:migrateTripsToLb();
    logAudit('C','Backup','—','Restored from uploaded backup');
    save(); render();
    toast('✅ Backup restored'+(migrated?' — '+migrated+' logbook entries added':' — logbook data preserved'));
  }catch(e){ toast('Could not read backup: '+e.message,true); } };
  rd.readAsText(f);
}
function resetBooks(){
  if(!confirm('This will permanently delete ALL data in this browser and start fresh. Are you sure?\n\nDownload a backup first if you want to keep your current data.')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}

<script>
/* =================================================================
   AI RECORD SCANNER — Nirman Ledger  (✨ AI)
   Architecture:
     • Frontend-only: no API key ever leaves the server.
     • All vision calls go to  POST /api/ai/document-scan
     • The backend (Express/FastAPI/etc.) proxies to the vision AI.
     • If the endpoint returns a non-200, the scanner degrades
       gracefully and shows a "connect backend" banner.
     • NEVER posts automatically — user must click APPROVE & POST.
   ================================================================= */

'use strict';

/* ── state ── */
const AIS = {
  draft     : null,
  file      : null,

  chat      : [],

  geminiModel : (()=>{ try{
    const VALID=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-3.6-flash'];
    const saved=localStorage.getItem('kapl_gemini_model')||'';
    return VALID.includes(saved) ? saved : 'gemini-2.0-flash';
  }catch(e){ return 'gemini-2.0-flash'; } })(),
  geminiModels: (()=>{ try{ const m=localStorage.getItem('kapl_gemini_models'); return m?JSON.parse(m):[]; }catch(e){ return []; } })(),
};

/* ── helpers ── */
function aiConfLabel(c){

    sales_invoice:'Sales Invoice', ra_bill:'RA Bill',
    jcb_machine_bill:'JCB / Machine Bill', jcb_machine_log:'JCB Machine Log',
    murum_trip_sheet:'Murum Trip Sheet', material_grn:'Material Receipt / GRN',
    material_issue:'Material Issue Slip', labour_muster:'Labour Muster Roll',

/* ── party & site matching ── */
function aiMatchParty(name,gstin,pan){
  if(!name) return null;
  const nm=name.trim().toLowerCase();
  const g=(gstin||'').trim().toUpperCase();
  const p=(pan||'').trim().toUpperCase();
  // exact GSTIN / PAN
  let m=null;
  if(g) m=S.parties.find(x=>x.gstin&&x.gstin.toUpperCase()===g);
  if(!m&&p) m=S.parties.find(x=>x.pan&&x.pan.toUpperCase()===p);
  if(m) return {type:'matched',party:m,score:1.0};
  // fuzzy name
  const scored=S.parties.map(x=>{
    const xn=x.name.toLowerCase();
    const words=nm.split(/\s+/).filter(w=>w.length>2);
    const hits=words.filter(w=>xn.includes(w)).length;
    const score=words.length?hits/words.length:0;
    return {x,score};
  }).filter(x=>x.score>0.45).sort((a,b)=>b.score-a.score);
  if(scored.length===1) return {type:'matched',party:scored[0].x,score:scored[0].score};
  if(scored.length>1)   return {type:'multiple',parties:scored.slice(0,4).map(s=>s.x)};
  return {type:'new',name};
}
function aiMatchSite(name,code,wo){
  if(!name&&!code&&!wo) return null;
  const nm=(name||'').toLowerCase();
  const co=(code||'').toLowerCase();
  const w=(wo||'').toLowerCase();
  let m=S.sites.find(x=>co&&x.code.toLowerCase()===co);
  if(!m) m=S.sites.find(x=>nm&&x.name.toLowerCase()===nm);
  if(!m&&w) m=S.sites.find(x=>(x.code+x.name).toLowerCase().includes(w.slice(0,5)));
  if(m) return {type:'matched',site:m};
  // partial name
  const scored=S.sites.map(x=>{
    const sc=(nm.length>3&&x.name.toLowerCase().includes(nm.slice(0,5)))?0.7:0;
    return {x,sc};
  }).filter(x=>x.sc>0);
  if(scored.length===1) return {type:'matched',site:scored[0].x};
  return null;
}

/* ── duplicate detection ── */
function aiCheckDuplicate(docType,vendorRef,amount,partyId,date){
  const list=[...S.purchases,...S.sales];
  for(const b of list){
    const sameRef  = vendorRef&&b.vendorRef&&b.vendorRef.toLowerCase()===vendorRef.toLowerCase();
    const sameAmt  = Math.abs((b.gross||b.taxable||0)-amount)<1;
    const sameParty= partyId&&b.party===partyId;
    const sameDate = date&&b.date===date;
    if(sameRef&&sameAmt&&sameParty) return {isDuplicate:true,record:b};
    if(sameRef&&sameParty&&sameDate) return {isDuplicate:true,record:b};
  }
  return {isDuplicate:false};
}

/* ── suggest accounting entry ── */
function aiSuggestAccounting(draft){
  const d=draft.fields||{};
  const dt=draft.documentType;
  const lines=[];
  const warns=[];

  // simple rule-based engine — mirrors the existing buildVendorBill / buildSalesBill logic
  const taxable = parseFloat(d.taxableValue||d.taxable||0)||0;
  const cgst    = parseFloat(d.cgst||0)||0;
  const sgst    = parseFloat(d.sgst||0)||0;
  const igst    = parseFloat(d.igst||0)||0;
  const tds     = parseFloat(d.tds||0)||0;
  const total   = parseFloat(d.total||d.invoiceTotal||0)||(taxable+cgst+sgst+igst);

  if(dt==='vendor_invoice'||dt==='purchase_bill'||dt==='expense_bill'){
    // expense / purchase
    const expAc=d.suggestedExpAc||'5110';
    const party=draft.partyMatch?.party;
    const partyAc=(party&&party.ac)||'2101';
    if(taxable) lines.push({side:'Dr',ac:expAc,name:accName(expAc),amt:taxable,note:d.narration||''});
    if(cgst)    lines.push({side:'Dr',ac:'1501',name:'GST Input — CGST',amt:cgst});
    if(sgst)    lines.push({side:'Dr',ac:'1502',name:'GST Input — SGST',amt:sgst});
    if(igst)    lines.push({side:'Dr',ac:'1503',name:'GST Input — IGST',amt:igst});
    const net=R2(total-tds);
    lines.push({side:'Cr',ac:partyAc,name:accName(partyAc),amt:net});
    if(tds){
      const tdsSec=d.tdsSection||'194C';
      const tdsAc=(TDS_SEC[tdsSec]&&TDS_SEC[tdsSec].ac)||'2206';
      lines.push({side:'Cr',ac:tdsAc,name:accName(tdsAc),amt:tds,note:'TDS u/s '+tdsSec});
    }
  } else if(dt==='sales_invoice'||dt==='ra_bill'){
    const revAc=d.suggestedRevAc||'4101';
    const party=draft.partyMatch?.party;
    const partyAc=(party&&party.ac)||'1201';
    lines.push({side:'Dr',ac:partyAc,name:accName(partyAc),amt:total});
    lines.push({side:'Cr',ac:revAc,name:accName(revAc),amt:taxable});
    if(cgst) lines.push({side:'Cr',ac:'2201',name:'GST Output — CGST',amt:cgst});
    if(sgst) lines.push({side:'Cr',ac:'2202',name:'GST Output — SGST',amt:sgst});
    if(igst) lines.push({side:'Cr',ac:'2203',name:'GST Output — IGST',amt:igst});
  } else if(dt==='material_grn'){
    const stockAc=d.suggestedStockAc||'1309';
    const party=draft.partyMatch?.party;
    const partyAc=(party&&party.ac)||'2101';
    if(taxable) lines.push({side:'Dr',ac:stockAc,name:accName(stockAc),amt:taxable});
    if(cgst)    lines.push({side:'Dr',ac:'1501',name:'GST Input — CGST',amt:cgst});
    if(sgst)    lines.push({side:'Dr',ac:'1502',name:'GST Input — SGST',amt:sgst});
    const net=R2(total-tds);
    lines.push({side:'Cr',ac:partyAc,name:accName(partyAc),amt:net});
    if(tds) lines.push({side:'Cr',ac:'2206',name:'TDS Payable — 194Q',amt:tds});
  } else {
    warns.push('Document type "'+aiDocTypeLabel(dt)+'" — please select the correct accounting treatment manually.');
  }

  // balance check
  const drTotal=R2(lines.filter(l=>l.side==='Dr').reduce((s,l)=>s+l.amt,0));
  const crTotal=R2(lines.filter(l=>l.side==='Cr').reduce((s,l)=>s+l.amt,0));
  const balanced=Math.abs(drTotal-crTotal)<0.02;
  if(!balanced) warns.push('Debit ('+rs(drTotal)+') ≠ Credit ('+rs(crTotal)+') — please review amounts before posting.');

  return {lines,balanced,warns,drTotal,crTotal};
}

/* ── validate draft before posting ── */
function aiValidateDraft(draft){
  const errors=[];
  const d=draft.fields||{};
  if(!draft.documentType||draft.documentType==='unknown') errors.push('Document type not identified.');
  if(!draft.partyMatch?.party&&!draft.partyMatch?.newPartyName) errors.push('Party / vendor not identified.');
  if(!draft.accounting||!draft.accounting.balanced) errors.push('Accounting entry is not balanced (Dr ≠ Cr).');
  if(draft.duplicateCheck?.isDuplicate) errors.push('Possible duplicate — another record matches this invoice.');
  const taxable=parseFloat(d.taxableValue||0);
  const cgst=parseFloat(d.cgst||0);
  const sgst=parseFloat(d.sgst||0);
  const igst=parseFloat(d.igst||0);
  const total=parseFloat(d.total||0);
  if(taxable>0&&total>0){
    const computed=R2(taxable+cgst+sgst+igst);
    if(Math.abs(computed-total)>1) errors.push('Totals do not reconcile: taxable+GST='+rs(computed)+' but invoice total='+rs(total)+'.');
  }
  return errors;
}

/* ── call AI backend ── */
async function aiScanDocument(file){
  const key = AIS.geminiKey;
  if(!key) throw new Error('Please enter your free Gemini API key first (click the key icon above).');

  // Convert file to base64
  const b64=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('File read failed'));
    r.readAsDataURL(file);
  });

  const mimeType = file.type||'image/jpeg';

  // Build context about existing parties/sites/accounts for matching
  const partiesCtx = S.parties.map(p=>`${p.name} (GSTIN:${p.gstin||'-'} PAN:${p.pan||'-'})`).join(', ');
  const sitesCtx   = S.sites.map(s=>`${s.id}:${s.name}(${s.code})`).join(', ');

  // Build a focused prompt based on what kind of document this likely is
  // We detect keywords from filename to give Gemini a head start
  const fname = (AIS.file?.name||'').toLowerCase();
  const isLikelyMlog  = fname.includes('jcb')||fname.includes('machine')||fname.includes('mlog');
  const isLikelyMurum = fname.includes('murum')||fname.includes('earth')||fname.includes('trip');

  const promptJCB = `Look at this handwritten JCB / Machine hour register image.
It has columns: DATE | NAME OF PARTY | ON READING (opening meter) | OFF READING (closing meter) | TOTAL HOURS.
Extract every row. "Nill", "Null", "Mill" = 0. Ditto marks (" or ,,) = same name as above.
Return ONLY this JSON (no markdown, no explanation):
{"documentType":"jcb_machine_log","isRegister":true,"registerTitle":"JCB Machine","confidence":0.95,"lineItems":[{"date":"YYYY-MM-DD","partyName":"","openingReading":0,"closingReading":0,"hours":0,"remarks":""}],"fields":{"vendorName":"","invoiceDate":"","total":0,"narration":"","site":""},"fieldConf":{},"partyMatch":{"matchedName":"","confidence":0},"siteMatch":{"matchedId":"","confidence":0},"warnings":[],"duplicateCheck":{"possibleDuplicate":false}}`;

  const promptMurum = `Look at this handwritten Murum / Earth / Material trip register image.
It has columns: DATE | NAME OF SUPPLIER | QTY (cum) | CHALAN NO | REMARKS.
Extract every row. "Nill" or "Null" = 0 cum. Ditto marks = same supplier as above.
Return ONLY this JSON (no markdown, no explanation):
{"documentType":"murum_trip_sheet","isRegister":true,"registerTitle":"MURUM","confidence":0.95,"lineItems":[{"date":"YYYY-MM-DD","supplierName":"","chalan":"","tipper":"","cum":0,"remarks":""}],"fields":{"vendorName":"","invoiceDate":"","total":0,"narration":"","site":""},"fieldConf":{},"partyMatch":{"matchedName":"","confidence":0},"siteMatch":{"matchedId":"","confidence":0},"warnings":[],"duplicateCheck":{"possibleDuplicate":false}}`;

  const promptGeneral = `You are a construction site logbook AI for Nirman Ledger. Analyze this image carefully.

STEP 1: Identify document type:
- Hard Murum/Earth trips register → documentType:"murum_trip_sheet"
- M-Sand (manufactured sand) register → documentType:"msand"
- Gitti (stone chips/aggregate) register → documentType:"gitti"  
- Hava (blowing/compaction) register → documentType:"hava"
- Dumper trips register → documentType:"dumper"
- JCB/Excavator/Machine hour log → documentType:"jcb_machine_log"
- Invoice/Bill/Receipt → documentType:"purchase_invoice" or "sales_invoice"
- Anything else → documentType:"other"

STEP 2: Extract ALL rows. Look at page title/header to identify type.

For MURUM register: lineItems=[{date,supplierName,cum,chalan,remarks}]
For M-SAND register: lineItems=[{date,party,qty,site,remark}] where site=Bypass or Barela from context
For GITTI register: lineItems=[{date,party,qty,site,remark}]
For HAVA register: lineItems=[{date,trips,payment,site}]
For DUMPER register: lineItems=[{date,trips,payment,site}]
For JCB/MACHINE: lineItems=[{date,partyName,openingReading,closingReading,hours,remarks}]

Sites context: ${sitesCtx}
If the page says "Page 8" or "Bypass" → site=Bypass. If "Page 13" or "Barela" → site=Barela.
"Nill","Null","Mill","MILL" = mill day (skip or set trips=0). Ditto marks = same as row above.

Return ONLY valid JSON (no markdown, no explanation):
{"documentType":"","isRegister":true,"registerTitle":"","confidence":0.9,"lineItems":[],"fields":{"vendorName":"","invoiceNumber":"","invoiceDate":"","total":0,"narration":"","site":""},"fieldConf":{},"partyMatch":{"matchedName":"","confidence":0},"siteMatch":{"matchedId":"","confidence":0},"warnings":[],"duplicateCheck":{"possibleDuplicate":false}}

Dates as dd/mm/yyyy or YYYY-MM-DD. Return ALL rows you can see. Return ONLY JSON.`;

  const prompt = isLikelyMlog ? promptJCB : isLikelyMurum ? promptMurum : promptGeneral;

  const model = AIS.geminiModel || 'gemini-2.0-flash';
  const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

  // Only use responseMimeType on models that support it (flash variants)
  const supportsJsonMime = model.includes('flash');
  const genConfig = { temperature: 0.1, maxOutputTokens: 4096 };
  if(supportsJsonMime) genConfig.responseMimeType = 'application/json';

  const body = {
    contents: [{
      parts: [
        { text: prompt },
        { inline_data: { mime_type: mimeType, data: b64 } }
      ]
    }],
    generationConfig: genConfig
  };

  // Use XMLHttpRequest instead of fetch — fetch() is blocked by browsers when
  // the page is opened from a local file:// path (CORS / mixed-content policy).
  // XHR works reliably from both file:// and http:// contexts.
  const geminiData = await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', geminiUrl, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 60000; // 60s timeout for large images
    xhr.onload = () => {
      if(xhr.status === 200){
        try{ resolve(JSON.parse(xhr.responseText)); }
        catch(e){ reject(new Error('Gemini returned non-JSON response. Try again.')); }
      } else if(xhr.status === 400){
        reject(new Error('Invalid API key or request. Check your Gemini API key.'));
      } else if(xhr.status === 404){
        reject(new Error('Model "'+model+'" not found. Please select a different model from the dropdown.'));
      } else if(xhr.status === 429){
        reject(new Error('Gemini rate limit reached. Please wait a moment and try again.'));
      } else {
        let msg = 'Gemini API error '+xhr.status;
        try{ const e=JSON.parse(xhr.responseText); msg+=': '+(e?.error?.message||xhr.responseText).slice(0,200); }catch(e2){}
        reject(new Error(msg));
      }
    };
    xhr.onerror   = () => reject(new Error('Network error — cannot reach Google API. Check your internet connection.'));
    xhr.ontimeout = () => reject(new Error('Request timed out after 60s. Try a smaller/clearer image.'));
    xhr.send(JSON.stringify(body));
  });
  let rawText = '';
  // Collect all text parts (some models split across parts)
  const parts = geminiData?.candidates?.[0]?.content?.parts || [];
  rawText = parts.map(p=>p.text||'').join('');

  // Robust JSON extraction — handle markdown fences, leading text, trailing text
  // 1. Strip ```json ... ``` or ``` ... ``` fences
  rawText = rawText.replace(/^[\s\S]*?```(?:json)?\s*/i, s => s.includes('{') ? '' : s)
                   .replace(/```[\s\S]*$/,'').trim();
  // 2. If still not starting with {, find the first { and last }
  const first = rawText.indexOf('{');
  const last  = rawText.lastIndexOf('}');
  if(first > 0 || (first === -1 && last === -1)){
    if(first !== -1 && last !== -1) rawText = rawText.slice(first, last+1);
  }
  rawText = rawText.trim();

  let parsed;
  try{ parsed = JSON.parse(rawText); }
  catch(e){
    // Last resort: try to extract JSON with a regex
    const m = rawText.match(/\{[\s\S]+\}/);
    if(m){ try{ parsed = JSON.parse(m[0]); }catch(e2){} }
    if(!parsed) throw new Error('AI returned unreadable response. Please try again or switch to gemini-2.0-flash model.');
  }

  // Normalise to our expected format
  if(!parsed.documentType) throw new Error('AI could not identify this document. Please try a clearer image.');

  // Ensure lineItems is always an array
  if(!Array.isArray(parsed.lineItems)) parsed.lineItems = [];
  // If AI detected a register with line items, flag it
  if(parsed.lineItems.length > 0) parsed.isRegister = true;

  // Map partyMatch to system format
  const pm = parsed.partyMatch||{};
  if(pm.matchedName && pm.confidence > 0.6){
    const found = S.parties.find(p=>p.name===pm.matchedName);
    if(found) parsed._resolvedParty = found;
  }
  // Map siteMatch
  const sm = parsed.siteMatch||{};
  if(sm.matchedId){
    const foundSite = S.sites.find(s=>s.id===sm.matchedId);
    if(foundSite) parsed._resolvedSite = foundSite;
  }

  return parsed;
}

/* ── approve & post ── */
function aiApproveAndPost(){
  const draft=AIS.draft;
  if(!draft){toast('No draft to post.',true);return;}

  // Final validation
  const errors=aiValidateDraft(draft);
  if(errors.length){
    toast(errors[0],true);
    return;
  }

  // Duplicate guard (with override)
  if(draft.duplicateCheck?.isDuplicate&&!draft._dupOverride){
    if(!confirm('⚠️ Possible duplicate detected.\n\n'+
      'An existing record appears to match this invoice. Post anyway?')) return;
    draft._dupOverride=true;
  }

  try{
    const d=draft.fields||{};
    const dt=draft.documentType;
    const partyId=draft.partyMatch?.party?.id||(()=>{
      if(draft.partyMatch?.newPartyName){
        // auto-create minimal party
        const np={id:uid(),name:draft.partyMatch.newPartyName,type:'Vendor',cat:'Material Supplier',
          gstin:d.gstin||'',pan:d.pan||'',gstTreat:'Unregistered',state:'23',tds:'',
          tdsRate:0,msme:'',terms:30,phone:'',addr:'',ac:'2101'};
        S.parties.push(np);
        logAudit('C','Party',np.id,'AI Scanner: New party '+np.name);
        return np.id;
      }
      return null;
    })();
    const siteId=draft.siteMatch?.site?.id||'S4';
    const taxable=R2(parseFloat(d.taxableValue||d.taxable||0));
    const total=R2(parseFloat(d.total||d.invoiceTotal||0)||(taxable+(parseFloat(d.cgst||0))+(parseFloat(d.sgst||0))+(parseFloat(d.igst||0))));
    const gstRate=parseFloat(d.gstRate||((d.cgst&&taxable)?(R2(parseFloat(d.cgst)/taxable*200)):18));
    const date=d.invoiceDate||today();
    const vendorRef=d.invoiceNumber||'AI-SCAN-'+Date.now();
    const narr=d.narration||aiDocTypeLabel(dt)+' — AI Scanner';
    let rec=null;

    if(dt==='vendor_invoice'||dt==='purchase_bill'||dt==='expense_bill'||dt==='material_grn'){
      const expAc=d.suggestedExpAc||(dt==='material_grn'?'1309':'5110');
      const tdsSec=d.tdsSection&&TDS_SEC[d.tdsSection]?d.tdsSection:'';
      if(dt==='material_grn'&&d.items&&d.items.length){
        // try addGRN if items specified
        const lines=d.items.map(it=>{
          const found=S.items.find(x=>x.name.toLowerCase().includes((it.name||'').toLowerCase().slice(0,4)));
          return {item:found?found.id:'',qty:parseFloat(it.qty||1),rate:parseFloat(it.rate||taxable),gst:gstRate};
        }).filter(l=>l.item);
        if(lines.length){
          rec=addGRN({date,party:partyId,site:siteId,vendorRef,
            narration:narr,lines});
        }
      }
      if(!rec){
        rec=buildVendorBill({date,party:partyId,site:siteId,vendorRef,
          narration:narr,taxable,gstRate,tdsSec,expAc,
          kind:aiDocTypeLabel(dt),hsn:d.hsn||'',
          qty:parseFloat(d.quantity||0),unit:d.unit||'',rate:parseFloat(d.rate||0)});
      }
    } else if(dt==='sales_invoice'||dt==='ra_bill'){
      const revAc=d.suggestedRevAc||'4101';
      rec=buildSalesBill({date,party:partyId,site:siteId,narration:narr,
        taxable,gstRate,retPct:parseFloat(d.retention||0),
        tdsPct:parseFloat(d.tdsRate||0),revAc,
        kind:aiDocTypeLabel(dt),hsn:d.hsn||'995432',
        qty:parseFloat(d.quantity||1),unit:d.unit||'Lot',rate:taxable});
    } else {
      // Generic voucher for other types
      const lines=[];
      (draft.accounting?.lines||[]).forEach(l=>{
        if(l.side==='Dr') lines.push({ac:l.ac,dr:l.amt,cr:0,note:l.note||''});
        else              lines.push({ac:l.ac,dr:0,cr:l.amt,note:l.note||''});
      });
      if(!lines.length) throw new Error('Cannot generate accounting entry for this document type. Please enter manually.');
      const v=postVoucher({type:'JV',date,narration:narr,site:siteId,lines});
      rec={no:v.no,id:v.id};
    }

    logAudit('C','AI Scanner',rec.no,'Posted from AI draft — '+aiDocTypeLabel(dt)+
      (partyId?' · '+pname(partyId):'')+' · '+rs(total));

    // update history
    const hid=draft._histId;
    if(hid){
      const hi=AIS.history.find(h=>h.id===hid);
      if(hi){hi.status='posted';hi.voucher=rec.no;}
    }

    AIS.stage='done';
    AIS.draft=null;
    save();
    render();
    toast('✅ Posted successfully as '+rec.no);
    setTimeout(()=>{
      if(draft.documentType==='sales_invoice'||draft.documentType==='ra_bill'){
        viewDoc('sales',rec.id);
      } else if(rec.id){
        viewDoc('purch',rec.id);
      }
    },600);
  }catch(e){
    toast('Error: '+e.message,true);
  }
}

/* ── chat with the draft ── */
async function aiChatSend(){
  const inp=document.getElementById('ai-chat-input');
  if(!inp||!inp.value.trim()) return;
  const msg=inp.value.trim();
  inp.value='';
  AIS.chat.push({role:'user',text:msg});

  // Simple local command interpretation first
  const lower=msg.toLowerCase();
  const draft=AIS.draft;
  if(!draft){AIS.chat.push({role:'ai',text:'No draft loaded. Please upload a document first.'});renderAIScanPanel();return;}

  let handled=false;
  // "change X to Y" patterns
  const changeMatch=lower.match(/(?:change|set|update)\s+([\w\s]+?)\s+to\s+(.+)/);
  if(changeMatch){
    const field=changeMatch[1].trim();
    const val=changeMatch[2].trim();
    const f=draft.fields=draft.fields||{};
    if(field.includes('qty')||field.includes('quantity')) {f.quantity=val;handled=true;}
    if(field.includes('rate')) {f.rate=val;handled=true;}
    if(field.includes('taxable')) {f.taxableValue=val;handled=true;}
    if(field.includes('site')){
      const s=S.sites.find(x=>x.code.toLowerCase()===val.toLowerCase()||x.id.toLowerCase()===val.toLowerCase());
      if(s){draft.siteMatch={type:'matched',site:s};handled=true;}
    }
    if(field.includes('gstin')) {f.gstin=val;handled=true;}
    if(field.includes('tds section')||field.includes('tds')){f.tdsSection=val;handled=true;}
    if(handled){
      // Re-run accounting suggestion
      draft.accounting=aiSuggestAccounting(draft);
      logAudit('U','AI Scanner Draft','—','User chat: '+msg);
      AIS.chat.push({role:'ai',text:'Updated. Please review the draft.'});
      renderAIScanPanel();return;
    }
  }
  if(lower.includes('cash purchase')||lower.includes('make cash')){
    draft.fields=draft.fields||{};draft.fields.paymentMode='Cash';
    draft.accounting=aiSuggestAccounting(draft);
    AIS.chat.push({role:'ai',text:'Noted as cash purchase. Expense head unchanged.'});handled=true;
  }
  if(lower.includes('no tds')||lower.includes('remove tds')){
    draft.fields=draft.fields||{};draft.fields.tds='0';draft.fields.tdsSection='';
    draft.accounting=aiSuggestAccounting(draft);
    AIS.chat.push({role:'ai',text:'TDS removed from draft.'});handled=true;
  }
  if(!handled){
    // For anything else, send to backend AI chat endpoint (if available)
    try{
      const resp=await fetch('/api/ai/chat',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:msg,draft:AIS.draft,context:'nirman-ledger'})});
      if(resp.ok){
        const data=await resp.json();
        if(data.updatedDraft) AIS.draft=data.updatedDraft;
        AIS.chat.push({role:'ai',text:data.reply||'Done.'});
      } else {
        AIS.chat.push({role:'ai',text:'I understand "'+msg+'". Please edit the fields directly in the form above, then click Approve & Post.'});
      }
    }catch(e){
      AIS.chat.push({role:'ai',text:'Chat backend not connected. Please edit the highlighted fields directly and use Approve & Post.'});
    }
  }
  renderAIScanPanel();
}

        const rem=item.remarks||item.remark||item.work||'';

    const theadLb='<tr><th style="padding:6px 8px">Date</th><th style="padding:6px 8px">Qty/Trips</th><th style="padding:6px 8px">Party/Name</th><th style="padding:6px 8px">Site</th><th style="padding:6px 8px">Remark</th><th></th></tr>';
    const summaryBar=isMlog?('<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill a">'+mlogTotalHrs.toFixed(1)+' hrs total</span><span class="pill g">'+mlogWorkingDays+' working days</span><span class="pill w">'+mlogNilDays+' nil days</span></div>'):'';
    h+=`<div style="background:var(--good-soft);color:var(--good);padding:10px 16px;border-radius:6px;margin-bottom:16px;font-size:13px">

    </div>
    ${summaryBar}
    <div class="tw" style="margin-bottom:16px;overflow-x:auto"><table class="t" style="width:100%">

    ${isMlog?`<div style="background:var(--surface2,#1a1a1a);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">

          <option value="roller" ${(AIS.lbDraft&&AIS.lbDraft.mtype)==='roller'?'selected':''}>🛞 Road Roller</option>
        </select>
      </label>
      <label style="font-size:13px;display:flex;align-items:center;gap:6px">
        <b>Machine:</b>
        <select id="mlogMachineReview" class="in" style="padding:4px 8px;font-size:13px" onchange="AIS.lbDraft.machineId=this.value">
          ${S.machines.map(m=>`<option value="${m.id}">${m.code} — ${m.name}</option>`).join('')}
        </select>
      </label>
      <label style="font-size:13px;display:flex;align-items:center;gap:6px">
        <b>Site:</b>
        <select id="mlogSiteReview" class="in" style="padding:4px 8px;font-size:13px" onchange="AIS.lbDraft.siteId=this.value">
          ${S.sites.map(s=>`<option value="${s.id}">${s.code} — ${s.name}</option>`).join('')}
        </select>
      </label>
    </div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn pri" onclick="aiConfirmLogbook()">✅ Confirm & Save to ${regLabel}</button>
      <button class="btn" onclick="AIS.stage='idle';AIS.lbDraft=null;S.lbDraft=null;save();renderAIScanPanel()">✖ Cancel — Discard</button>
    </div>`;
    return h;
  } else if(AIS.stage==='review'){
    // No lbDraft means normal invoice review
    if(AIS.draft){
      h+=aiRenderReview();
    } else {
      // Nothing to review — reset
      AIS.stage='idle';
      h+=aiRenderUploadZone();
    }
  } else if(AIS.stage==='done'){
    h+='<div class="card"><div class="body" style="text-align:center;padding:40px 20px">'+
      '<div style="font-size:48px;margin-bottom:12px">✅</div>'+
      '<h3>Posted successfully!</h3>'+
      '<p class="hint">The accounting entry has been created in the books.</p>'+
      '<button class="btn pri" onclick="AIS.stage=\'idle\';AIS.draft=null;AIS.file=null;AIS.previewUrl=null;AIS.chat=[];renderAIScanPanel()">Scan another document</button>'+
      '</div></div>';
  }

  return h;
}

async function aiSaveGeminiKey(){
  const k=document.getElementById('geminiKeyInput').value.trim();
  if(!k){ toast('Please enter your Gemini API key',true); return; }
  const btn=document.getElementById('geminiSaveBtn');
  btn.textContent='Testing...'; btn.disabled=true;
  try{
    // Fetch actual available models from Google
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
    const data=await r.json();
    if(!r.ok) throw new Error(data?.error?.message||'Invalid API key');
    // Filter to vision-capable flash/pro models
    const models=(data.models||[])
      .filter(m=>m.name&&m.supportedGenerationMethods&&
        m.supportedGenerationMethods.includes('generateContent')&&
        (m.name.includes('flash')||m.name.includes('pro'))&&
        !m.name.includes('thinking')&&!m.name.includes('embedding'))
      .map(m=>m.name.replace('models/',''))
      .sort((a,b)=>b.localeCompare(a));
    if(!models.length) throw new Error('No compatible models found for this key');
    AIS.geminiKey=k;
    AIS.geminiModels=models;
    // Prefer gemini-2.5-flash > gemini-2.0-flash > first available
    const PREFERRED=['gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash'];
    AIS.geminiModel = PREFERRED.find(p=>models.includes(p)) || models[0];
    try{ localStorage.setItem('kapl_gemini_key',k); }catch(e){}
    try{ localStorage.setItem('kapl_gemini_model',AIS.geminiModel); }catch(e){}
    try{ localStorage.setItem('kapl_gemini_models',JSON.stringify(models)); }catch(e){}
    toast('✅ Gemini connected! Model: '+AIS.geminiModel);
    renderAIScanPanel();
  }catch(e){
    toast('❌ '+e.message,true);
    btn.textContent='Save & Connect'; btn.disabled=false;
  }
}

/* ── Register / Logbook multi-row import review ── */
function aiRenderRegisterReview(){
  const draft = AIS.draft;
  const items = draft.lineItems || [];
  const title = draft.registerTitle || aiDocTypeLabel(draft.documentType);
  const docType = draft.documentType;

  // Determine columns based on document type
  const isMurum = docType === 'murum_trip_sheet';
  const isMlog  = docType === 'jcb_machine_log';
  const isLabour= docType === 'labour_muster';

  // Build editable table
  let tableHead = '';
  let tableRows = '';

  if(isMurum){
    tableHead = `<tr>
      <th>Date</th><th>Supplier</th><th>Chalan</th><th>Vehicle</th><th style="text-align:right">Qty (cum)</th><th>Remarks</th><th></th>

            onchange="AIS.draft.lineItems[${i}].date=this.value"></td>

            onchange="AIS.draft.lineItems[${i}].supplierName=this.value"></td>
        <td><input type="text" class="in" style="min-width:80px;font-size:12px" value="${esc(item.chalan||item.chalanNo||'')}"
            onchange="AIS.draft.lineItems[${i}].chalan=this.value"></td>
        <td><input type="text" class="in" style="min-width:90px;font-size:12px" value="${esc(item.tipper||item.vehicle||'')}"
            onchange="AIS.draft.lineItems[${i}].tipper=this.value"></td>
        <td><input type="number" class="in" style="min-width:70px;font-size:12px;text-align:right" value="${item.cum||item.quantity||0}"
            onchange="AIS.draft.lineItems[${i}].cum=parseFloat(this.value)||0"></td>
        <td><input type="text" class="in" style="min-width:80px;font-size:12px" value="${esc(item.remarks||'')}"

        <td><button class="btn sm dngr" onclick="AIS.draft.lineItems.splice(${i},1);renderAIScanPanel()">✕</button></td>
      </tr>`;
    });
  } else if(isMlog){
    tableHead = `<tr><th>Date</th><th>Party / Operator</th><th style="text-align:right">Opening Reading</th><th style="text-align:right">Closing Reading</th><th style="text-align:right">Hours</th><th>Remarks</th><th></th></tr>`;
    items.forEach((item,i)=>{
      const party = item.partyName||item.machine||item.party||'';
      const open  = item.openingReading||item.opening||0;
      const close = item.closingReading||item.closing||0;
      const hrs   = item.hours||(close&&open?(close-open).toFixed(1):0);
      tableRows += `<tr>
        <td><input type="date" class="in" style="min-width:130px;font-size:12px" value="${esc(item.date||'')}"
            onchange="AIS.draft.lineItems[${i}].date=this.value"></td>
        <td><input type="text" class="in" style="min-width:120px;font-size:12px" value="${esc(party)}"
            onchange="AIS.draft.lineItems[${i}].partyName=this.value"></td>
        <td><input type="number" class="in" style="min-width:90px;font-size:12px;text-align:right" value="${open}"
            onchange="AIS.draft.lineItems[${i}].openingReading=parseFloat(this.value)||0;
              const c=AIS.draft.lineItems[${i}].closingReading||0;

              renderAIScanPanel()"></td>
        <td><input type="number" class="in" style="min-width:90px;font-size:12px;text-align:right" value="${close}"
            onchange="AIS.draft.lineItems[${i}].closingReading=parseFloat(this.value)||0;

        <td><input type="number" class="in" style="min-width:70px;font-size:12px;text-align:right" value="${hrs}"
            onchange="AIS.draft.lineItems[${i}].hours=parseFloat(this.value)||0"></td>

      </tr>`;

/* Import register line items into the appropriate S.* collection */
function aiImportRegister(){
  const draft = AIS.draft;
  const items = draft.lineItems || [];
  const docType = draft.documentType;
  const site = draft.siteMatch?.site?.id || '';
  const partyId = draft._importPartyId || '';

  if(!site){ toast('Please select a site first',true); return; }
  if(!items.length){ toast('No rows to import',true); return; }

  let imported = 0;
  let skipped  = 0;

  if(docType === 'murum_trip_sheet'){
    items.forEach((item,idx)=>{
      const cum = parseFloat(item.cum||item.quantity)||0;
      // Skip null/zero rows if user wants — but we keep them (0 cum = no delivery that day)
      // We skip rows with no date
      if(!item.date){ skipped++; return; }
      const chalNo = item.chalan || item.chalanNo || ('AI-'+(1000+S.trips.length+idx));
      S.trips.push({
        id    : uid(),
        date  : item.date,
        chalan: chalNo,
        site  : site,
        party : item._partyId || partyId,
        tipper: item.tipper || item.vehicle || '',
        src   : item.source || draft.registerTitle || 'Murum',
        cum   : cum,
        billed: ''
      });
      imported++;
    });
    logAudit('C','AI Register Import','murum_trip_sheet',imported+' trips from register scan ('+skipped+' skipped)');
    save();
    render();
    toast('✅ Imported '+imported+' trip entries into Trip Sheet'+(skipped?' ('+skipped+' skipped)':''));

  } else if(docType === 'jcb_machine_log'){
    const importMtype = draft._importMtype || 'roller';
    // Find the machine to assign — prefer one matching the mtype category
    const ROLLER_TYPES=['Roller','Road Roller','Compactor'];
    const JCB_TYPES=['Backhoe Loader','Excavator'];
    function findMachine(item){
      // 1. try to match by name from AI
      const byName = S.machines.find(m=>m.name===item.machine||m.name===item.partyName);
      if(byName) return byName.id;
      // 2. try to match by mtype category field
      const byCat = S.machines.find(m=>(m.cat||'')===importMtype);
      if(byCat) return byCat.id;
      // 3. try by type keyword
      const byType = importMtype==='roller'
        ? S.machines.find(m=>ROLLER_TYPES.some(t=>((m.type||'')+'|'+(m.name||'')).toLowerCase().indexOf(t.toLowerCase())>=0))
        : S.machines.find(m=>JCB_TYPES.some(t=>((m.type||'')+'|'+(m.name||'')).toLowerCase().indexOf(t.toLowerCase())>=0));
      if(byType) return byType.id;
      // 4. fallback to first machine
      return S.machines[0]?.id || '';
    }
    items.forEach(item=>{
      if(!item.date){ skipped++; return; }
      const machId = findMachine(item);
      const hrs = parseFloat(item.hours)||0;
      const open = parseFloat(item.openingReading)||0;
      const close = parseFloat(item.closingReading)||0;
      S.machineLogs.push({
        id      : uid(),
        date    : item.date,
        mtype   : importMtype,
        machine : machId,
        site    : item.site || site,
        hours   : hrs,
        hmStart : open,
        hmEnd   : close,
        operator: item.partyName||item.machine||'',
        work    : item.remarks || '',
        billed  : ''
      });
      imported++;
    });
    logAudit('C','AI Register Import','jcb_machine_log',imported+' log entries · '+items.reduce((s,r)=>s+(parseFloat(r.hours)||0),0).toFixed(1)+' hrs total');
    save();
    render();
    toast('✅ Imported '+imported+' machine log entries ('+items.reduce((s,r)=>s+(parseFloat(r.hours)||0),0).toFixed(1)+' hrs total)');

  } else {
    // Generic — just save to a custom register (show trip sheet as fallback for murum variants)
    toast('ℹ Import for "'+aiDocTypeLabel(docType)+'" registers — please use Trip Sheet or Machine Log for now',true);
    return;
  }

  // Mark scan as done
  const hid = draft._histId;
  if(hid){ const hi=AIS.history.find(h=>h.id===hid); if(hi){ hi.status='posted'; hi.voucher='IMPORT'; } }
  AIS.stage='done';
  AIS.draft=null; AIS.file=null; AIS.previewUrl=null; AIS.chat=[];
  renderAIScanPanel();
}

/* ── file handling ── */
function aiHandleDrop(e){
  e.preventDefault();
  const el=document.getElementById('aiDropZone');
  if(el) el.classList.remove('dragover');
  const f=e.dataTransfer?.files?.[0];
  if(f) aiHandleFile(f);
}
function aiHandleFile(f){
  if(!f) return;
  AIS.file=f;
  if(AIS.previewUrl) URL.revokeObjectURL(AIS.previewUrl);
  AIS.previewUrl=URL.createObjectURL(f);
  aiRunScan();
}
