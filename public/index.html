/* ── Confirm logbook review and save ── */
function aiConfirmLogbook(){
  if(!AIS.lbDraft||!AIS.lbDraft.items||!AIS.lbDraft.items.length){
    toast('No entries to save',true); return;
  }
  const ld=AIS.lbDraft;
  const smSimple=ld.sm||{site:{name:'Bypass'}};
  // For machine log: read selected mtype and machine from dropdowns
  if(ld.target==='mlog'){
    const mtSel=document.getElementById('mlogMtypeReview');
    const mSel=document.getElementById('mlogMachineReview');
    ld.mtype=mtSel?mtSel.value:'jcb';
    ld.machineId=mSel?mSel.value:(S.machines[0]&&S.machines[0].id||'');
    // Stamp each item with selected mtype and machineId
    const siteSel=document.getElementById('mlogSiteReview');
    ld.siteId=siteSel?siteSel.value:(S.sites[0]&&S.sites[0].id||'');
    ld.items.forEach(function(item){
      item.mtype=ld.mtype;
      item.machineId=ld.machineId;
      item.siteId=ld.siteId;
    });
  }
  aiPostToLogbook(ld.target, ld.items, ld.title, smSimple);
  AIS.lbDraft=null;
  S.lbDraft=null;
  save();
}

/* ── Route scanned logbook data to the correct register ── */
function aiPostToLogbook(page, lineItems, title, siteMatch){
  if(!S.lb) S.lb={};
  // Determine register name from page
  const regMap={'lb_msand':'msand','lb_gitti':'gitti','lb_hava':'hava','lb_dumper':'dumper','lb_murum':null,'mlog':null};
  const reg=regMap[page];

  // Detect site from siteMatch or from register title
  const defaultSite=(siteMatch&&siteMatch.site&&siteMatch.site.name)||'Bypass';
  const siteIsBarela=defaultSite.toLowerCase().includes('barela');

  if(page==='mlog'){
    // Machine log entries
    const added=[];
    lineItems.forEach(item=>{
      const rawDate=item.date||item.Date||'';
      const entry={
        id:uid(), billed:'',
        date:toISO(rawDate)||rawDate,
        mtype:item.mtype||'jcb',
        machine:item.machineId||(S.machines.find(function(m){return m.cat===(item.mtype||'jcb');})||S.machines[0]||{}).id||'',
        site:item.siteId||S.sites[0]&&S.sites[0].id||'',
        operator:item.partyName||item.operator||item.operatorName||'',
        hmStart:+(item.openingReading||item.hmStart||0),
        hmEnd:+(item.closingReading||item.hmEnd||0),
        hours:+(item.hours||item.totalHours||0),
        diesel:+(item.diesel||0),
        work:item.remarks||item.work||''
      };
      if(entry.hours<=0&&entry.hmEnd>entry.hmStart) entry.hours=+(entry.hmEnd-entry.hmStart).toFixed(2);
      S.machineLogs.push(entry);
      added.push(entry);
    });
    save(); go('mlog');
    toast('✅ '+added.length+' machine log entries added from photo');
    return;
  }

  if(page==='lb_murum'){
    // Murum goes to S.lb.murum (Hard Murum logbook)
    if(!S.lb.murum) S.lb.murum=[];
    const added=[];
    lineItems.forEach(item=>{
      const qty=+(item.cum||item.qty||item.quantity||item.trips||0);
      const itemDate=item.date||item.Date||'';
      if(!itemDate) return;
      // Dedup check
      const dup=S.lb.murum.find(function(r){return r.date===itemDate&&+r.qty===qty;});
      if(dup) return;
      const entry={
        date:itemDate,
        qty:qty,
        remark:item.remarks||item.remark||item.chalan||item.supplierName||''
      };
      S.lb.murum.push(entry);
      added.push(entry);
    });
    save(); go('lb_murum');
    toast('✅ '+added.length+' entries added to Hard Murum logbook');
    return;
  }

  // All other logbook registers (msand, gitti, hava, dumper)
  if(!S.lb[reg]) S.lb[reg]=[];
  const isTrip=(reg==='hava'||reg==='dumper');
  const added=[];
  lineItems.forEach(item=>{
    if(!item.date&&!item.Date) return;
    const itemDate=item.date||item.Date||'';
    // Auto-detect site from item content
    const itemText=JSON.stringify(item).toLowerCase();
    const itemSite=itemText.includes('barela')?'Barela':(itemText.includes('bypass')?'Bypass':(siteIsBarela?'Barela':'Bypass'));
    let entry;
    if(isTrip){
      entry={
        date:itemDate,
        trips:+(item.trips||item.qty||item.quantity||0),
        payment:item.payment||item.amount||'',
        site:itemSite
      };
    } else {
      entry={
        date:itemDate,
        party:item.party||item.partyName||item.supplierName||'',
        qty:item.qty||item.quantity||item.cum||'600 cft',
        site:itemSite,
        remark:item.remarks||item.remark||item.chalan||''
      };
    }
    S.lb[reg].push(entry);
    added.push(entry);

    // Also add to S.trips for Trip Sheet visibility
  });
  save(); go(page);
  toast('✅ '+added.length+' entries saved to '+title+' logbook');
}

/* ── orchestrate scan ── */
async function aiRunScan(){
  if(!AIS.file) return;
  // Manual stage — no auto-tick timer that can get stuck
  const progressTimer=null; // kept for clearInterval() calls below (no-ops)
  AIS.stage='uploading'; renderAIScanPanel();
  await new Promise(r=>setTimeout(r,300));
  AIS.stage='analyzing'; renderAIScanPanel();

  try{
    const raw=await aiScanDocument(AIS.file);
    AIS.stage='extracting'; renderAIScanPanel();

    // Validate JSON shape
    if(!raw||!raw.documentType){
      throw new Error('AI returned an unexpected response. Check the backend /api/ai/document-scan endpoint.');
    }

    // ── LOGBOOK ROUTING — runs FIRST, before any accounting logic ────
    const LOGBOOK_TYPES={
      'msand':'lb_msand','msand':'lb_msand','m_sand':'lb_msand','sand':'lb_msand','manufactured':'lb_msand',
      'gitti':'lb_gitti','gitti_20mm':'lb_gitti','stone':'lb_gitti','chips':'lb_gitti','aggregate':'lb_gitti',
      'hava':'lb_hava','hava_600':'lb_hava','blowing':'lb_hava','compaction':'lb_hava',
      'dumper':'lb_dumper','dumper_300':'lb_dumper','tipper':'lb_dumper',
      'murum':'lb_murum','murum_trip':'lb_murum','murum_trip_sheet':'lb_murum',
      'hard_murum':'lb_murum','earth':'lb_murum','soil':'lb_murum','murrum':'lb_murum',
      'jcb_machine_log':'mlog','machine_log':'mlog','jcb':'mlog','excavator':'mlog','backhoe':'mlog',
      'labour_muster':'skip','muster':'skip','attendance':'skip'
    };
    const dtLower=(raw.documentType||'').toLowerCase().replace(/[^a-z0-9]/g,'_');
    const titleLower=(raw.registerTitle||'').toLowerCase();
    const rawStr=(dtLower+' '+titleLower);
    let lbTarget=null;
    for(const [key,page] of Object.entries(LOGBOOK_TYPES)){
      if(rawStr.includes(key)){lbTarget=page;break;}
    }
    if(!lbTarget){
      if(/m[\s-]?sand/.test(rawStr)) lbTarget='lb_msand';
      else if(/gitti/.test(rawStr)) lbTarget='lb_gitti';
      else if(/hava/.test(rawStr)) lbTarget='lb_hava';
      else if(/dumper/.test(rawStr)) lbTarget='lb_dumper';
      else if(/murum|murrum|earth|soil/.test(rawStr)) lbTarget='lb_murum';
      else if(/jcb|machine|excavat|roller/.test(rawStr)) lbTarget='mlog';
      // Detect from isRegister flag — any register page is a logbook
      else if(raw.isRegister && raw.lineItems && raw.lineItems.length){
        // Try to guess from line items content
        const liStr=JSON.stringify(raw.lineItems).toLowerCase();
        if(/msand|m-sand|m_sand|sand/.test(liStr)) lbTarget='lb_msand';
        else if(/gitti/.test(liStr)) lbTarget='lb_gitti';
        else if(/hava/.test(liStr)) lbTarget='lb_hava';
        else if(/dumper/.test(liStr)) lbTarget='lb_dumper';
        else if(/murum|murrum|earth/.test(liStr)) lbTarget='lb_murum';
        else if(/jcb|machine|hour|reading/.test(liStr)) lbTarget='mlog';
      }
    }

    if(lbTarget){
      if(lbTarget==='skip'){
        AIS.stage='idle';
        toast('Detected as attendance/muster — use Logbook section to enter manually.',true);
        renderAIScanPanel();
        return;
      }
      // Simple site detection
      const smSimple={site:{id:S.sites[0]&&S.sites[0].id||'',name:'Bypass'}};
      if((raw.registerTitle||'').toLowerCase().includes('barela')||
         (raw.fields&&raw.fields.site||'').toLowerCase().includes('barela')){
        smSimple.site={id:S.sites[1]&&S.sites[1].id||'',name:'Barela'};
      }
      if(raw.lineItems && raw.lineItems.length){
        // ── SHOW REVIEW SCREEN before saving — store in S so it survives re-render ──
        S.lbDraft={target:lbTarget, items:raw.lineItems, title:raw.registerTitle||raw.documentType, sm:smSimple};
        save();
        AIS.stage='review';
        AIS.lbDraft=S.lbDraft; // sync to AIS for this render
        renderAIScanPanel();
        return;
      } else {
        AIS.stage='idle';
        toast('Detected as logbook page but no entries extracted. Try a clearer/closer photo.',true);
        renderAIScanPanel();
        return;
      }
    }
    // ── END LOGBOOK ROUTING — only invoices/bills reach below ─────────

    // Party & site matching — for invoices only
    const pm = raw._resolvedParty
      ? { type:'matched', party:raw._resolvedParty, score:1.0 }
      : aiMatchParty(raw.fields?.vendorName||raw.fields?.customerName,
                     raw.fields?.gstin, raw.fields?.pan);
    const sm = raw._resolvedSite
      ? { type:'matched', site:raw._resolvedSite }
      : aiMatchSite(raw.fields?.site||raw.siteMatch?.siteName,
                    raw.fields?.siteCode, raw.fields?.workOrderNumber);

    // Duplicate check
    const partyId=pm?.party?.id||null;
    const amount=parseFloat(raw.fields?.total||raw.fields?.invoiceTotal||raw.fields?.taxableValue||0);
    const dup=aiCheckDuplicate(raw.documentType,raw.fields?.invoiceNumber,amount,partyId,raw.fields?.invoiceDate);

    // Build draft (for invoices/bills — normal accounting flow)
    const draft={
      documentType   : raw.documentType,
      confidence     : raw.confidence||0.7,
      fields         : raw.fields||{},
      fieldConf      : raw.fieldConf||raw.fieldConfidence||{},
      partyMatch     : pm||{type:'new',name:raw.fields?.vendorName||''},
      siteMatch      : sm,
      duplicateCheck : dup,
      warnings       : raw.warnings||[],
      isRegister     : !!raw.isRegister,
      registerTitle  : raw.registerTitle||'',
      lineItems      : raw.lineItems||[],
      _histId        : uid(),
    };
    draft.accounting=aiSuggestAccounting(draft);

    // History entry
    const hentry={
      id:draft._histId, ts:Date.now(),
      docType:draft.documentType,
      party:pm?.party?.name||raw.fields?.vendorName||'—',
      amount, confidence:draft.confidence,
      status:'draft', voucher:null,
      _draft:draft
    };
    AIS.history.unshift(hentry);

    AIS.draft=draft;
    AIS.stage='review';
    AIS.chat=[];
    logAudit('C','AI Scanner',hentry.id,
      'Scanned: '+aiDocTypeLabel(draft.documentType)+
      (pm?.party?' · '+pm.party.name:'')+' · conf '+Math.round(draft.confidence*100)+'%');
    renderAIScanPanel();

  }catch(err){
    clearInterval(progressTimer);
    AIS.stage='idle';
    toast('AI scan failed: '+err.message,true);
    // update history status
    if(AIS.history[0]) AIS.history[0].status='error';
    renderAIScanPanel();
  }
}
</script>



<script>
/* ================= WHATSAPP INBOX — AUTO POLLING ================= */
let WA_POLL_TIMER=null;
const WA_CFG_KEY='nirman_wa_cfg';
function waCfg(){ try{ return JSON.parse(localStorage.getItem(WA_CFG_KEY)||'{}'); }catch(e){ return {}; } }
function waCfgSet(o){ localStorage.setItem(WA_CFG_KEY,JSON.stringify({...waCfg(),...o})); }
function waInboxInit(){ if(!S.waInbox) S.waInbox=[]; }

function waIsDuplicate(entry){
  if(entry.type==='mlog') return S.machineLogs.some(l=>l.date===entry.date&&Math.abs((l.hmStart||0)-(entry.hmStart||0))<0.5&&Math.abs((l.hmEnd||0)-(entry.hmEnd||0))<0.5);
  if(entry.type==='trip') return S.trips.some(t=>t.date===entry.date&&(t.vehicle||'')===(entry.vehicle||'')&&(t.trips||0)===(entry.trips||0));
  if(entry.type==='voucher') return S.vouchers.some(v=>v.date===entry.date&&Math.abs((v.amount||0)-(entry.amount||0))<1&&(v.narr||'').slice(0,20)===(entry.narr||'').slice(0,20));
  return false;
}

function waApprove(id){
  waInboxInit();
  const item=S.waInbox.find(x=>x.id===id); if(!item) return;
  if(waIsDuplicate(item)&&!confirm('⚠️ Possible duplicate — same date & readings exist. Save anyway?')) return;
  if(item.type==='mlog') S.machineLogs.push({id:uid(),billed:'',date:item.date,mtype:item.mtype||'jcb',machine:item.machineId||S.machines[0]?.id||'',site:item.siteId||S.sites[0]?.id||'',operator:item.operator||'',hmStart:item.hmStart||0,hmEnd:item.hmEnd||0,hours:item.hours||0,work:item.work||'',diesel:item.diesel||0});
  else if(item.type==='trip') S.trips.push({id:uid(),date:item.date,vehicle:item.vehicle||'',site:item.siteId||S.sites[0]?.id||'',material:item.material||'',trips:item.trips||0,rate:item.rate||0,party:item.partyId||''});
  else if(item.type==='voucher') S.vouchers.push({id:uid(),type:item.vtype||'PV',date:item.date,narr:item.narr||'',amount:item.amount||0,dr:item.dr||'',cr:item.cr||'',ref:item.ref||''});
  item.status='approved'; save(); render(); toast('✅ Saved to records');
}
function waReject(id){ waInboxInit(); const item=S.waInbox.find(x=>x.id===id); if(!item) return; item.status='rejected'; save(); render(); toast('Rejected'); }
function waDelete(id){ waInboxInit(); S.waInbox=S.waInbox.filter(x=>x.id!==id); save(); render(); }

async function waParseMessage(rawText,mediaBase64,mediaType){
  const cfg=waCfg(); const key=cfg.geminiKey||AIS?.geminiKey;
  if(!key) throw new Error('Set Gemini API key in AI Record Scanner first');
  const model=AIS?.geminiModel||'gemini-2.0-flash';
  const prompt=`Parse this WhatsApp message from a construction site worker in India. Return ONLY a JSON array, no markdown:
[{"type":"mlog|trip|voucher","mtype":"jcb|roller","date":"YYYY-MM-DD","operator":"","hmStart":0,"hmEnd":0,"hours":0,"work":"","vehicle":"","material":"","trips":0,"rate":0,"amount":0,"narr":"","vtype":"PV","dr":"","cr":"","ref":""}]
Rules:
- JCB/excavator/backhoe→mlog+jcb, roller/compactor→mlog+roller, trips/murum/sand/truck/tipper→trip
- payment/rs/rupees/paid/expense/salary/wages/purchase/material/broom/labour→voucher
- IMPORTANT: Extract rupee amount from "rs500","rs 700","₹500","500 rs" as the "amount" field number
- For voucher narr: use person name + purpose e.g. "Om rs500"→narr="Om - payment", amount=500
- "Misara rs700 for broom"→narr="Misara - broom purchase", amount=700
- If no date use today: ${new Date().toISOString().slice(0,10)}
Message: ${rawText||'(see image)'}`;
  const parts=[{text:prompt}];
  if(mediaBase64&&mediaType) parts.push({inlineData:{mimeType:mediaType,data:mediaBase64}});
  const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.1}})});
  const data=await resp.json();
  if(!resp.ok) throw new Error(data.error?.message||'Gemini error');
  let raw=data.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
  raw=raw.replace(/```json|```/g,'').trim(); return JSON.parse(raw);
}

async function waPoll(){
  const cfg=waCfg(); if(!cfg.serverUrl) return;
  try{
    const headers={'ngrok-skip-browser-warning':'1'};
    if(cfg.serverToken) headers['Authorization']='Bearer '+cfg.serverToken;
    const since = cfg.lastPoll||0;
    const resp=await fetch(cfg.serverUrl+'/messages?since='+since,{headers});
    if(!resp.ok) return;
    const msgs=await resp.json(); 
    waCfgSet({lastPoll:Date.now()}); 
    waInboxInit();
    let added=0;
    for(const msg of (msgs||[])){
      let entries=[];
      try{
        let mediaB64=null;
        if(msg.mediaUrl){
          try{
            const mr=await fetch(cfg.serverUrl+'/media?url='+encodeURIComponent(msg.mediaUrl),{headers:{'ngrok-skip-browser-warning':'1',...(cfg.serverToken?{'Authorization':'Bearer '+cfg.serverToken}:{})}});
            if(mr.ok){ const blob=await mr.blob(); mediaB64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob);}); }
          }catch(e){}
        }
        entries=await waParseMessage(msg.text||msg.caption||'',mediaB64,msg.mediaType||'image/jpeg');
      }catch(e){ entries=[]; }
      // If AI parsing failed or returned nothing, add as raw voucher so it still shows
      if(!entries||entries.length===0){
        entries=[{type:'voucher',date:new Date().toISOString().slice(0,10),narr:msg.text||msg.caption||'(media)',amount:0,vtype:'PV'}];
      }
      entries.forEach(e=>S.waInbox.unshift({...e,id:uid(),waId:msg.id,status:'pending',source:'whatsapp',from:msg.from,ts:msg.ts||Date.now(),rawText:msg.text||msg.caption||''}));
      added++;
    }
    if(added>0){ save(); render(); toast('📱 '+added+' new WhatsApp message(s)'); }
  }catch(e){ console.warn('WA poll:',e); }
}
function waStartPolling(){ if(WA_POLL_TIMER) clearInterval(WA_POLL_TIMER); const cfg=waCfg(); if(!cfg.serverUrl) return; waPoll(); WA_POLL_TIMER=setInterval(waPoll,30000); }

async function waPasteAndParse(){
  const txt=document.getElementById('waPasteBox')?.value?.trim(); if(!txt){ toast('Paste a message first',true); return; }
  const btn=document.getElementById('waParseBtn'); btn.disabled=true; btn.textContent='AI reading...';
  try{
    const entries=await waParseMessage(txt,null,null); waInboxInit();
    entries.forEach(e=>S.waInbox.unshift({...e,id:uid(),status:'pending',source:'manual',ts:Date.now(),rawText:txt}));
    save(); render(); document.getElementById('waPasteBox').value='';
    toast('✅ '+entries.length+' entr'+(entries.length===1?'y':'ies')+' added');
  }catch(err){ toast('AI parse failed: '+err.message,true); }
  finally{ btn.disabled=false; btn.textContent='📤 Parse with AI'; }
}
function waSaveServerUrl(){
  const url=(document.getElementById('waServerUrl')?.value||'').trim().replace(/\/$/,'');
  const token=(document.getElementById('waServerToken')?.value||'').trim();
  waCfgSet({serverUrl:url,serverToken:token}); toast('Connected — auto-polling every 30s'); waStartPolling(); render();
}

function P_wainbox(){
  waInboxInit(); const cfg=waCfg();
  const pending=S.waInbox.filter(x=>x.status==='pending');
  const done=S.waInbox.filter(x=>x.status!=='pending').slice(0,30);
  const recentLogs=S.machineLogs.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,8);

      <div><span style="color:var(--muted)">Hours</span><br><b style="font-size:1.05rem">${item.hours||0}</b></div>
      ${item.work?`<div style="grid-column:1/-1"><span style="color:var(--muted)">Work</span><br>${esc(item.work)}</div>`:''}
    </div>`;
    else if(item.type==='trip') det=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:0.8rem;margin:8px 0">
      <div><span style="color:var(--muted)">Date</span><br><b>${item.date||'—'}</b></div>
      <div><span style="color:var(--muted)">Vehicle</span><br><b>${esc(item.vehicle||'—')}</b></div>
      <div><span style="color:var(--muted)">Material</span><br><b>${esc(item.material||'—')}</b></div>
      <div><span style="color:var(--muted)">Trips</span><br><b style="font-size:1.05rem">${item.trips||0}</b></div>
    </div>`;
    else det=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:0.8rem;margin:8px 0">
      <div><span style="color:var(--muted)">Date</span><br><b>${item.date||'—'}</b></div>
      <div><span style="color:var(--muted)">Amount</span><br><b style="font-size:1.05rem">₹${item.amount||0}</b></div>
      ${item.narr?`<div style="grid-column:1/-1"><span style="color:var(--muted)">Details</span><br>${esc(item.narr)}</div>`:''}
    </div>`;
    return `<div style="border:1.5px solid ${bc};border-radius:10px;margin-bottom:8px;background:var(--surface);overflow:hidden">
      <div style="padding:8px 12px;background:var(--ground);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <span>${icon}</span><b style="font-size:0.83rem">${label}</b>
        <span style="font-size:0.7rem;color:var(--muted)">${item.source==='whatsapp'?'📱 '+esc(item.from||'WA'):'✍️ Manual'}</span>
        ${isDup?'<span style="margin-left:auto;font-size:0.68rem;background:var(--warn);color:#000;padding:1px 7px;border-radius:20px;font-weight:700">⚠ DUPLICATE</span>':''}
        ${item.status!=='pending'?`<span style="margin-left:auto;font-size:0.72rem;color:${bc};font-weight:600">${item.status==='approved'?'✅ Approved':'❌ Rejected'}</span>`:''}
      </div>
      <div style="padding:10px 12px">
        ${det}
        ${item.rawText?`<div style="font-size:0.7rem;color:var(--muted);border-top:1px solid var(--border);padding-top:6px;margin-top:2px">"${esc(item.rawText.slice(0,100))}${item.rawText.length>100?'…':''}"</div>`:''}
        ${item.status==='pending'?`<div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn pri" style="flex:1;padding:7px;font-size:0.85rem" onclick="waApprove('${item.id}')">✅ Yes — Save</button>
          <button class="btn dngr" style="flex:1;padding:7px;font-size:0.85rem" onclick="waReject('${item.id}')">❌ No</button>
        </div>`:`<button class="btn sm gh dngr" style="margin-top:6px;font-size:0.72rem" onclick="waDelete('${item.id}')">Remove</button>`}
      </div>
    </div>`;
  }

  let h=pageHead('📱 WhatsApp Inbox','Auto-reads messages from operators → you approve or reject each entry',
    `<button class="btn" onclick="waPoll()">🔄 Refresh</button>
     <button class="btn" onclick="S.waInbox=S.waInbox.filter(x=>x.status==='pending');save();render()">Clear done</button>`);

  // Server config
  h+=`<div class="card" style="margin-bottom:14px"><div style="padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <b style="font-size:0.8rem;white-space:nowrap">🔗 Your webhook server</b>
    <input id="waServerUrl" class="in" style="flex:1;min-width:180px;font-size:0.8rem;padding:5px 10px" placeholder="https://your-server.com" value="${esc(cfg.serverUrl||'')}">
    <input id="waServerToken" class="in" style="width:140px;font-size:0.8rem;padding:5px 10px" placeholder="Token (optional)" value="${esc(cfg.serverToken||'')}">
    <button class="btn pri sm" onclick="waSaveServerUrl()">Connect</button>
    <span style="font-size:0.72rem;color:${cfg.serverUrl?'var(--ok)':'var(--muted)'}">${cfg.serverUrl?'● Live — polling every 30s':'● Not connected'}</span>
  </div></div>`;

  // Split screen
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">`;

function lbAiAdd(register){
  const promptEl=document.getElementById('lb-ai-prompt-'+register);
  const prompt=promptEl?promptEl.value.trim():'';
  const btn=document.getElementById('lb-ai-btn-'+register);
  const isTrip=(register==='hava'||register==='dumper');
  const schema=isTrip
    ?'JSON array of objects, each with: date (string dd/mm/yyyy), trips (number), payment (string), site ("Bypass" or "Barela")'
    :'JSON array of objects, each with: date (string dd/mm/yyyy), party (string), qty (string e.g. "600 cft"), site ("Bypass" or "Barela"), remark (string)';

  function callAI(msgContent){
    if(btn){btn.disabled=true; btn.textContent='AI reading...';}
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user',content:msgContent}]
      })
    })
    .then(r=>r.json())
    .then(d=>{
      const text=d.content.map(c=>c.text||'').join('');
      const clean=text.replace(/```json|```/g,'').trim();
      // find JSON array in response
      const match=clean.match(/\[[\s\S]*\]/);
      if(!match) throw new Error('No JSON array found in AI response');
      const arr=JSON.parse(match[0]);
      if(!Array.isArray(arr)||!arr.length) throw new Error('AI returned empty list');
      if(!S.lb[register]) S.lb[register]=[];
      arr.forEach(obj=>S.lb[register].push(obj));
      save(); render();
      toast('✅ '+arr.length+' row'+(arr.length>1?'s':'')+' added by AI');
      if(promptEl) promptEl.value='';
    })
    .catch(e=>{ alert('AI error: '+e.message); })
    .finally(()=>{if(btn){btn.disabled=false; btn.textContent='✨ AI Add';}});
  }

  // Check if image file is selected
  const imgEl=document.getElementById('lb-ai-img-'+register);
  if(imgEl&&imgEl.files&&imgEl.files[0]){
    const file=imgEl.files[0];
    const reader=new FileReader();
    reader.onload=function(ev){
      const b64=ev.target.result.split(',')[1];
      const mt=file.type||'image/jpeg';
      const instructions='This is a photo of a construction site logbook page. Extract ALL entries as '+schema+'. For site: if the page header or entry mentions "Barela" use "Barela", otherwise use "Bypass". Return ONLY the JSON array, no explanation.';
      callAI([
        {type:'image',source:{type:'base64',media_type:mt,data:b64}},
        {type:'text',text:instructions+(prompt?' Also note: '+prompt:'')}
      ]);
    };
    reader.readAsDataURL(file);
    return;
  }

  // Text-only
  if(!prompt){alert('Type a description or upload a photo first');return;}
  callAI('Extract logbook entries from this text and return ONLY a '+schema+'. Auto-detect site: "barela"→Barela else Bypass. Text: "'+prompt+'"');
}
/* ---- Core editable table — pass real global indices ---- */
function lbFindDupIndices(register){
  if(!S.lb||!S.lb[register]) return {};
  var seen={}, dups={};
  S.lb[register].forEach(function(r,i){
    if(r._nodup) return; // user marked this as "not a duplicate" - skip
    var d=(r.date||'').replace(/[^0-9]/g,'');
    var q=String(r.trips||r.qty||'').replace(/[^0-9]/g,'');
    var p=(r.party||'').toLowerCase().trim();
    var s=(r.site||'');
    var key=d+'|'+q+'|'+p+'|'+s;
    if(seen[key]!==undefined){ dups[i]=true; dups[seen[key]]=true; }
    else seen[key]=i;
  });
  return dups;
}
function lbMarkNotDup(register,idx){
  if(!S.lb||!S.lb[register]||!S.lb[register][idx]) return;
  S.lb[register][idx]._nodup=true;
  save(); render();
  toast('\u2705 Marked as genuine entry — will no longer show as duplicate');
}

  cols.forEach(function(c){h+='<th>'+c+'</th>';});

function lbDedup(register){
  if(!S.lb) S.lb={}; if(!S.lb[register]) S.lb[register]=[];
  if(!S.trips) S.trips=[];
  // 1. Dedup the logbook array
  var before=S.lb[register].length;
  var seen={};
  S.lb[register]=S.lb[register].filter(function(r){
    if(r._nodup) return true; // user marked as genuine — never auto-remove
    var d=(r.date||'').replace(/[^0-9]/g,'');
    var q=String(r.trips||r.qty||r.cum||'').replace(/[^0-9]/g,'');
    var p=(r.party||r.partyName||'').toLowerCase().trim();
    var s=(r.site||'');
    // Include remark so same-date+qty but different remark = NOT a duplicate
    var rm=(r.remark||r.remarks||'').toLowerCase().trim().slice(0,20);
    var key=d+'|'+q+'|'+p+'|'+s+'|'+rm;
    if(seen[key]) return false;
    seen[key]=true; return true;
  });
  var removed=before-S.lb[register].length;
  // Only dedup the logbook — never touch S.trips
  save(); render();
  toast(removed>0?'✅ Removed '+removed+' duplicate'+(removed>1?'s':''):'✅ No duplicates found');
}

  var isTrip=(register==='hava'||register==='dumper');
  var added=0;
  lines.forEach(function(line){
    var parts=line.split(',').map(function(p){return p.trim();});
    if(!parts[0]) return;
    var entry;
    if(isTrip){
      entry={date:parts[0]||'',trips:+(parts[1]||0),payment:parts[2]||'',site:parts[3]||site};
    } else {
      entry={date:parts[0]||'',party:parts[1]||'',qty:parts[2]||'600 cft',site:parts[3]||site,remark:parts[4]||''};
    }
    S.lb[register].push(entry);
    added++;
  });
  save(); closeModal(); render();
  toast('✅ Added '+added+' entr'+(added===1?'y':'ies'));
}

function lbAiAddSite(register,site){
  var promptEl=document.getElementById('lb-ai-prompt-'+register+'-'+site);
  var imgEl=document.getElementById('lb-ai-img-'+register+'-'+site);
  var btn=document.getElementById('lb-ai-btn-'+register+'-'+site);
  var prompt=promptEl?promptEl.value.trim():'';
  if(!imgEl||!imgEl.files||!imgEl.files[0]){
    if(!prompt){toast('Type a description or upload a photo first',true);return;}
  }
  if(btn){btn.disabled=true;btn.textContent='Reading...';}
  var isTrip=(register==='hava'||register==='dumper');
  var isMurum=(register==='murum');
  var schema=isTrip
    ?'JSON array: [{date,trips,payment,site}] — site is "Bypass" or "Barela"'
    :isMurum
    ?'JSON array: [{date,qty,remark}] — qty is number of trips/CUM'
    :'JSON array: [{date,party,qty,site,remark}] — site is "Bypass" or "Barela", qty like "600 cft"';

  function processAIResponse(text){
    var clean=text.replace(/```json|```/g,'').trim();
    var match=clean.match(/\[[\s\S]*\]/);
    if(!match) throw new Error('No data found in response');
    var arr=JSON.parse(match[0]);
    if(!Array.isArray(arr)||!arr.length) throw new Error('No entries found');
    if(!S.lb) S.lb={};
    if(!S.lb[register]) S.lb[register]=[];
    var added=0;
    arr.forEach(function(item){
      item.date=toISO(item.date)||item.date;
      if(!item.site) item.site=site;
      // Normalize site to match section
      if(site==='Bypass') item.site='Bypass';
      if(site==='Barela') item.site='Barela';
      S.lb[register].push(item);
      added++;
    });
    save(); render();
    toast('✅ '+added+' entr'+(added>1?'ies':'y')+' added to '+register.toUpperCase()+' logbook');
    if(promptEl) promptEl.value='';
    if(imgEl) imgEl.value='';
  }

  // Use the same API endpoint as AI Record Scanner
  function callAPI(messages){
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,
        system:'You are a construction site register reader. Extract data exactly as shown in the register. Return ONLY valid JSON array, no explanation.',
        messages:messages})
    })
    .then(function(r){
      if(!r.ok) throw new Error('API error '+r.status);
      return r.json();
    })
    .then(function(d){
      var text=(d.content||[]).map(function(c){return c.text||'';}).join('');
      processAIResponse(text);
    })
    .catch(function(e){
      // Fallback: try via aiScanDocument if direct fetch fails
      toast('Direct API failed, trying scanner...', true);
      if(imgEl&&imgEl.files&&imgEl.files[0]){
        AIS.file=imgEl.files[0];
        AIS.lbDraft={target:'lb_'+register, items:[], title:register, sm:{site:{name:site}}};
        aiRunScan();
      } else {
        toast('AI error: '+e.message+'. Try using AI Record Scanner page instead.',true);
      }
    })
    .finally(function(){
      if(btn){btn.disabled=false;btn.textContent='✨ AI Add';}
    });
  }

  if(imgEl&&imgEl.files&&imgEl.files[0]){
    var reader=new FileReader();
    reader.onload=function(ev){
      var b64=ev.target.result.split(',')[1];
      var mt=imgEl.files[0].type||'image/jpeg';
      callAPI([{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mt,data:b64}},
        {type:'text',text:'This is a construction site '+register+' register. Extract ALL date entries. Site='+site+'. Return ONLY: '+schema}
      ]}]);
    };
    reader.readAsDataURL(imgEl.files[0]);
    return;
  }
  callAPI([{role:'user',content:'Extract from: "'+prompt+'". Return ONLY: '+schema+'. Site='+site}]);
}

/* ── Password lock ── */
const APP_PWD='Peecee';
function tryUnlock(){
  const v=document.getElementById('lockInput').value;
  if(v===APP_PWD){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('lockInput').value='';
    document.getElementById('lockErr').textContent='';
  } else {
    document.getElementById('lockErr').textContent='Incorrect password. Try again.';
    document.getElementById('lockInput').value='';
    document.getElementById('lockInput').focus();
  }
}
function showLock(){
  const ls=document.getElementById('lockScreen');
  ls.style.display='flex';
  setTimeout(()=>document.getElementById('lockInput').focus(),100);
}

/* ── Clear all data ── */
function clearAllDataPrompt(){
  const pwd=prompt('Enter password to clear ALL data:');
  if(pwd===null) return;
  if(pwd!==APP_PWD){ toast('Wrong password — data not cleared',true); return; }
  if(!confirm('This will DELETE every entry, machine log, trip, muster, voucher and bill from this browser.\n\nThis CANNOT be undone. Are you absolutely sure?')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=seed(); S.lb={gitti:[],msand:[],hava:[],dumper:[],murum:[]}; save();
  toast('All data cleared. Fresh start.');
  render();
}

function render(){
  // Always sort machineLogs newest first before rendering
  if(S.machineLogs&&S.machineLogs.length>1){
    S.machineLogs.sort(function(a,b){return (toISO(a.date)||a.date)<(toISO(b.date)||b.date)?1:-1;});
  }
  renderNav();
  $('#crumb').innerHTML=esc(TITLES[S.ui.page||'dash']||'Dashboard')+
    (S.ui.site!=='ALL'?' <em>&middot; '+esc(scode(S.ui.site))+'</em>':'');
  const fn=PAGES[S.ui.page]||P_dash;
  let html;
  try{ html=fn(); }
  catch(e){ html='<div class="card"><div class="body"><b style="color:var(--crit)">Something went wrong rendering this page.</b>'+
    '<p class="hint">'+esc(e.message)+'</p><button class="btn" onclick="go(\'dash\')">Back to dashboard</button></div></div>'; }
  $('#view').innerHTML=html;
  const sel=$('#siteSel');
  if(sel){ sel.innerHTML='<option value="ALL">All sites</option>'+
    S.sites.map(s=>'<option value="'+s.id+'"'+(S.ui.site===s.id?' selected':'')+'>'+esc(s.code)+'</option>').join(''); }
  $('#gstChip').textContent=S.company.gstin;
}
function boot(){
  let t='light';
  try{ t=localStorage.getItem('kapl_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  const ic=document.getElementById('themeIc'); if(ic) ic.textContent=t==='dark'?'☾':'☀';
  load();

  /* Init logbook data */
  if(!S.lb){S.lb={gitti:[],msand:[],hava:[],dumper:[],murum:[]};save();}
  if(!S.lb.dumper) S.lb.dumper=[];
  if(!S.lb.murum) S.lb.murum=[];

  /* Seed machines if none registered */
  if(!S.machines||S.machines.length===0){
    S.machines=[
      {id:'mach-rr-01',code:'RR-01',name:'Road Roller 2-1-1-म',cat:'roller',type:'Road Roller',
       reg:'',own:'Hired',owner:'',rate:800,unit:'Machine Hour',diesel:'Company',hmOpen:3100,status:'Active'},
      {id:'mach-jcb-01',code:'JCB-01',name:'JCB — Madam Yadav',cat:'jcb',type:'Backhoe Loader',
       reg:'',own:'Hired',owner:'',rate:1200,unit:'Machine Hour',diesel:'Company',hmOpen:4522,status:'Active'}
    ];
    save();
  } else {
    // Ensure seeded machines have cat field even if loaded from old localStorage
    var needSave=false;
    S.machines.forEach(function(m){
      if(!m.cat){
        if(m.type==='Road Roller'||m.type==='Roller'||m.code.indexOf('RR')>=0) m.cat='roller';
        else if(m.type==='Backhoe Loader'||m.type==='Excavator'||m.code.indexOf('JCB')>=0) m.cat='jcb';
        needSave=true;
      }
    });
    // If only roller exists and no JCB, add default JCB
    if(!S.machines.find(function(m){return m.cat==='jcb';})){
      S.machines.push({id:'mach-jcb-01',code:'JCB-01',name:'JCB — Madam Yadav',cat:'jcb',type:'Backhoe Loader',
        reg:'',own:'Hired',owner:'',rate:1200,unit:'Machine Hour',diesel:'Company',hmOpen:4522,status:'Active'});
      needSave=true;
    }
    if(needSave) save();
  }

  /* Seed sites if none registered */
  if(!S.sites||S.sites.length===0){
    S.sites=[
      {id:'site-bypass',code:'0001',name:'Bypass Site'},
      {id:'site-barela',code:'0002',name:'Barela Site'}
    ];
    save();
  }

  if(!S.ui.page) S.ui.page='dash';
  updateBrandUI();
  render();
  waStartPolling();
  // Resume auto-sync if PIN was previously saved
  var _savedPin=localStorage.getItem('nirman_auto_sync_pin');
  if(_savedPin){ SYNC_PIN=_savedPin; startAutoSync(_savedPin); }
  showLock();
}
boot();
