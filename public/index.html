<script>
/* ==================================================================
   TAX ON PROFITS, AND MONEY BORROWED TO EARN THEM

   The point of this page is that the tax number comes out of the books
   that are already here, rather than out of a margin borrowed from some
   other company's return. A projection basis is kept alongside so the two
   can be read against each other — but the books are the default.

   Section 200 of the Income-tax Act, 2025 (the old s.115BAA concessional
   regime) charges a domestic company 22%, with a surcharge of 10% and a
   health & education cess of 4% on top. That surcharge is FLAT at every
   level of income, not stepped at ₹1 crore, so there is no marginal
   relief to compute and the effective rate is 25.168% throughout.
   ================================================================== */
function DEFAULT_TAX(){
  return {regime:'200', basis:'books', projTurnover:55500000, projMargin:19.94, paid:[]};
}
const REGIMES={
 '200':{label:'s.200 concessional — 22%', base:22, sur:10, cess:4,
        note:'Flat 10% surcharge at every income level, so no marginal relief arises.'},
 'normal':{label:'Normal domestic rate — 30%', base:30, sur:7, cess:4,
        note:'Surcharge 7% above ₹1 Cr and 12% above ₹10 Cr, with marginal relief at each step.'},
 'small':{label:'Turnover ≤ ₹400 Cr — 25%', base:25, sur:7, cess:4,
        note:'Surcharge 7% above ₹1 Cr and 12% above ₹10 Cr, with marginal relief at each step.'}
};
/* surcharge with marginal relief where the regime actually steps */
function taxOn(income,regKey){
  const r=REGIMES[regKey]||REGIMES['200'];
  const inc=Math.max(0,R2(income));
  const base=R2(inc*r.base/100);
  let sur;
  if(regKey==='200'){ sur=R2(base*r.sur/100); }        /* flat — no threshold, no relief */
  else {
    const pct = inc>100000000?12 : inc>10000000?7 : 0;
    sur=R2(base*pct/100);
    /* marginal relief: extra tax cannot exceed the income above the threshold */
    [[10000000,7],[100000000,12]].forEach(([th])=>{
      if(inc>th){
        const atTh=R2(th*r.base/100);
        const excess=R2(inc-th), extra=R2(base+sur-atTh);
        if(extra>excess) sur=R2(Math.max(0,sur-(extra-excess)));
      }
    });
  }
  const cess=R2((base+sur)*r.cess/100);
  return {income:inc, base:base, sur:sur, cess:cess, total:R2(base+sur+cess),
          eff:inc?R2((base+sur+cess)/inc*100):0, reg:r};
}
/* days a borrowing is outstanding inside this financial year */
function loanDaysInFY(l){
  const a=(l.from&&l.from>FY_START)?l.from:FY_START;
  const b=(l.to&&l.to<FY_END)?l.to:FY_END;
  if(!l.from) return 0;
  const d=daysBetween(a,b);
  return d>0?d:0;
}
function loanInterest(l){
  const days=loanDaysInFY(l);
  return {days:days, amt:R2((+l.amount||0)*(+l.rate||0)/100*days/365)};
}
/* what the books themselves say, and what that annualises to */
function taxBasis(){
  const pl=fyPL();
  const upto=today()<FY_END?today():FY_END;
  const elapsed=Math.max(1,daysBetween(FY_START,upto));
  const annualiseFactor=365/elapsed;
  const booksAnnual=R2(pl.pbt*annualiseFactor);
  const proj=R2((+S.tax.projTurnover||0)*(+S.tax.projMargin||0)/100);
  const operating=S.tax.basis==='books'?booksAnnual:proj;
  let deductible=0, capitalised=0;
  S.loans.forEach(l=>{ const i=loanInterest(l).amt;
    if(l.purpose==='capital') capitalised+=i; else deductible+=i; });
  const taxable=R2(operating-deductible);
  return {pl:pl, elapsed:elapsed, factor:annualiseFactor, booksAnnual:booksAnnual, proj:proj,
          operating:R2(operating), deductible:R2(deductible), capitalised:R2(capitalised),
          taxable:taxable, tax:taxOn(taxable,S.tax.regime)};
}
const ADV=[['2026-06-15','15 June',15],['2026-09-15','15 September',45],
           ['2026-12-15','15 December',75],['2027-03-15','15 March',100]];
const advPaidUpto=d=>R2((S.tax.paid||[]).filter(p=>p.date<=d).reduce((s,p)=>s+(+p.amount||0),0));

/* ================= SENDING A DOCUMENT TO THE PARTY =================
   No server and no messaging API is involved. These build a normal link that
   hands the text to whatever the Mac already has: WhatsApp opens with the
   message typed out, Mail opens with the subject and body filled in. You still
   press send yourself, which is what keeps it honest — nothing leaves this
   machine on its own. */
function waDigits(phone){
  let d=String(phone||'').replace(/\D/g,'');
  if(!d) return '';
  /* A leading zero means an STD landline. 0755-2551234 strips down to
     7552551234, which looks exactly like a mobile but is not one — reject it
     rather than open WhatsApp on a number that will never receive anything. */
  if(d[0]==='0') return '';
  if(d.length===13&&d.slice(0,3)==='910') return '';
  if(d.length===12&&d.slice(0,2)==='91') d=d.slice(2);
  return /^[6-9]\d{9}$/.test(d)?'91'+d:'';
}
const waLink=(phone,text)=>'https://wa.me/'+waDigits(phone)+'?text='+encodeURIComponent(text);
const mailLink=(email,subj,body)=>'mailto:'+encodeURIComponent(email||'')+
  '?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
const inr=n=>'Rs '+fmtI(n);

/* the plain-text version of a bill — what actually gets sent */
function docText(kind,b){
  const p=P(b.party)||{}, isSale=kind==='sales', c=S.company;
  const L=[];
  L.push(isSale?'TAX INVOICE — '+c.name:'BILL BOOKED — '+c.name);
  L.push('');
  L.push((isSale?'Invoice no: ':'Bill no: ')+b.no);
  L.push('Date: '+dmyS(b.date));
  L.push((isSale?'Billed to: ':'Supplier: ')+(p.name||''));
  if(b.vendorRef) L.push('Your ref: '+b.vendorRef);
  L.push('Site: '+sname(b.site));
  L.push('');
  L.push(b.narration);
  L.push('');
  if(b.qty) L.push('Quantity: '+fmtI(b.qty,2)+' '+(b.unit||'')+' @ '+inr(b.rate));
  L.push('Taxable value: '+inr(b.taxable));
  if(b.cgst) L.push('CGST '+(b.gstRate/2)+'%: '+inr(b.cgst));
  if(b.sgst) L.push('SGST '+(b.gstRate/2)+'%: '+inr(b.sgst));
  if(b.igst) L.push('IGST '+b.gstRate+'%: '+inr(b.igst));
  L.push((isSale?'Invoice total: ':'Bill total: ')+inr(b.gross));
  if(isSale){
    if(b.retention) L.push('Less retention '+b.retPct+'%: '+inr(b.retention));
    if(b.clientTds) L.push('Less TDS by client '+b.tdsPct+'%: '+inr(b.clientTds));
    L.push('Net receivable: '+inr(b.receivable));
    const due=R2(b.receivable-(b.received||0));
    L.push(due>0.5?'Outstanding: '+inr(due):'Settled in full.');
  }else{
    if(b.tds) L.push('Less TDS u/s '+b.tdsSec+' @ '+b.tdsRate+'%: '+inr(b.tds));
    L.push('Net payable: '+inr(b.net));
    const due=R2(b.net-(b.paid||0));
    L.push(due>0.5?'Outstanding: '+inr(due):'Paid in full.');
  }
  L.push('');
  L.push(words(isSale?b.receivable:b.net));
  if(b.backdated) L.push('(Document dated '+dmyS(b.date)+', entered in the books on '+
    dmyS(String(b.enteredOn||'').slice(0,10))+'.)');
  L.push('');
  L.push('— '+c.signatory+', '+c.designation);
  L.push(c.name+' · GSTIN '+c.gstin);
  return L.join('\n');
}

  if(b.adv){ b.advances.forEach(a=>{ const k=WKR(a.worker)||{};
    h+='<tr><td colspan="6" style="text-align:right">Less: advance paid to '+esc(k.name)+' / एडवांस</td><td class="n">('+fmtI(a.amt)+')</td></tr>'; }); }
  h+='<tr class="tot"><td colspan="6">Balance payable / बैलेंस देय</td><td class="n">'+fmtI(b.net)+'</td></tr></tbody></table>';
  h+='<div class="words"><b>Amount in words:</b> '+words(b.net)+'</div>';
  h+='<div style="font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:14px">B · Accounting summary</div>'+
   '<table><tbody>'+
   '<tr><td>Skilled labour wages — mistri, operator, bar bender (5201)</td><td class="n">'+fmtI(b.skill)+'</td></tr>'+
   '<tr><td>Unskilled labour wages — beldar, reja (5202)</td><td class="n">'+fmtI(b.unskill)+'</td></tr>'+
   (b.ot?'<tr><td>Overtime at 1.5× hourly rate (5204)</td><td class="n">'+fmtI(b.ot)+'</td></tr>':'')+
   (b.adv?'<tr><td>Advance recovered — credited to Advance to Staff / Labour (1403)</td><td class="n">('+fmtI(b.adv)+')</td></tr>':'')+
   '<tr class="tot"><td>Paid from '+esc(accName(b.payAc))+'</td><td class="n">'+fmtI(b.net)+'</td></tr></tbody></table>';
  h+='<p style="font-size:11px;color:var(--muted)">Verification — this bill is drawn from the daily muster roll for the period shown. '+
   'Rates are the agreed daily rates in the worker register. Where a handwritten site note is the source, the written line total is taken as the basis '+
   'and the entry is verifiable against the site register before payment.</p>';
  h+='<div class="sign"><div>तैयारकर्ता / Prepared by</div><div>जांचकर्ता / Accountant</div>'+
   '<div>स्वीकृतकर्ता / Authorised Signatory<br><span style="font-size:10px">'+esc(S.company.signatory)+'</span></div></div></div>';
  modal('Labour payment bill '+b.no,h,
   '<button class="btn" onclick="closeModal()">Close</button><button class="btn pri" onclick="printEl()">Print / PDF</button>',true);
}
function printEl(){
  const el=document.getElementById('pdoc'); if(!el) return;
  const keep=document.getElementById('view').innerHTML;
  document.getElementById('view').innerHTML=el.outerHTML;
  document.getElementById('modalHost').style.display='none';
  window.print();
  document.getElementById('view').innerHTML=keep;
  document.getElementById('modalHost').style.display='';
}
</script>

<script>
/* ================= VOUCHERS ================= */
const VT={PV:'Payment',RV:'Receipt',CV:'Contra',JV:'Journal',PB:'Purchase',SB:'Sales',
  MR:'Labour Payment',SAL:'Salary',MI:'Material Issue',GR:'Goods Receipt'};
function P_vch(){
  const f=S.ui.vt||'';
  let rows=S.vouchers.filter(v=>siteOK(v.site)||!v.site).slice().sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  if(f) rows=rows.filter(v=>v.type===f);
  let h=pageHead('Vouchers','Every posting in the books, double entry, in creation order',
    '<button class="btn" onclick="expVch()">Export CSV</button>'+
    '<button class="btn" onclick="newVch(\'JV\')">+ Journal</button>'+
    '<button class="btn" onclick="newVch(\'RV\')">+ Receipt</button>'+
    '<button class="btn pri" onclick="newVch(\'PV\')">+ Payment</button>');
  const cnt={}; S.vouchers.forEach(v=>cnt[v.type]=(cnt[v.type]||0)+1);
  h+='<div class="tabs"><button class="tab'+(!f?' on':'')+'" onclick="S.ui.vt=\'\';render()">All ('+S.vouchers.length+')</button>'+
    Object.keys(VT).filter(k=>cnt[k]).map(k=>'<button class="tab'+(f===k?' on':'')+'" onclick="S.ui.vt=\''+k+'\';render()">'+
      VT[k]+' ('+cnt[k]+')</button>').join('')+'</div>';
  h+='<div class="card">'+tbl([
    {l:'Voucher',f:r=>'<b class="mono">'+esc(r.no)+'</b>'+bdPill(r)+'<div class="hint">'+esc(VT[r.type]||r.type)+'</div>'},
    {l:'Date',f:r=>'<span class="mono">'+dmyS(r.date)+'</span>'},
    {l:'Narration',f:r=>'<div style="max-width:380px">'+esc(r.narration)+'</div>'+(r.site?'<div class="hint">'+esc(scode(r.site))+'</div>':'')},
    {l:'Entries',f:r=>r.lines.map(l=>'<span class="hint">'+(l.dr?'Dr ':'   Cr ')+esc(accName(l.ac))+'</span>').join('<br>')},
    {l:'Amount',n:1,f:r=>'<b>'+fmtI(r.amount,0)+'</b>'},
    {l:'',cls:'act',f:r=>'<button class="btn sm" onclick="viewVch(\''+r.id+'\')">Open</button>'}],
    rows.slice(0,300),{emptyTitle:'No vouchers'})+
    (rows.length>300?'<div class="hint" style="padding:9px 14px">Showing 300 of '+rows.length+' vouchers.</div>':'')+'</div>';
  return h;
}
function viewVch(id){
  const v=S.vouchers.find(x=>x.id===id); if(!v) return;
  let h='<div class="paper" id="pdoc"><div class="ph">'+coHead()+'<div><div class="dt">'+esc(VT[v.type]||v.type)+' Voucher</div>'+
   '<div class="dn">'+esc(v.no)+'</div><div class="dn" style="color:var(--muted)">'+dmyS(v.date)+'</div></div></div>';
  h+='<div class="pgrid"><div>'+pfield('Narration',esc(v.narration))+'</div><div>'+
    pfield('Site',esc(v.site?sname(v.site):'—'))+pfield('Posted',dmy((v.enteredOn||v.createdAt||'').slice(0,10)))+'</div></div>';
  if(v.backdated) h+='<div class="bdnote"><b>Back-dated by '+v.bdDays+' days.</b> Dated '+dmyS(v.date)+', entered '+
    dmyS(String(v.enteredOn||'').slice(0,10))+(v.bdReason?' — '+esc(v.bdReason):'')+'.</div>';
  h+='<table><thead><tr><th>Account</th><th>Particulars</th><th class="n">Debit ₹</th><th class="n">Credit ₹</th></tr></thead><tbody>';
  v.lines.forEach(l=>h+='<tr><td class="mono">'+esc(l.ac)+'</td><td>'+esc((acc(l.ac)||{}).name||l.ac)+
    (l.note?'<div style="color:var(--muted);font-size:11px">'+esc(l.note)+'</div>':'')+'</td>'+
    '<td class="n">'+(l.dr?fmtI(l.dr):'')+'</td><td class="n">'+(l.cr?fmtI(l.cr):'')+'</td></tr>');
  h+='<tr class="tot"><td colspan="2">Total</td><td class="n">'+fmtI(v.amount)+'</td><td class="n">'+fmtI(v.amount)+'</td></tr></tbody></table>';

     v.id+'\',\'user reversal\');save();closeModal();render();toast(\'Voucher reversed — logged\');}">Reverse</button>',true);

function newVch(type){
  let n=4;
  const two=type==='PV'||type==='RV'||type==='CV';
  let b='<div class="fg">'+fld({k:'vdate',l:'Date',t:'date',req:1,series:type,onchange:"bdCheck('vdate')"},today())+
    fld({k:'vsite',l:'Site',t:'sel',opts:optSites(),blank:'— none —'},S.ui.site!=='ALL'?S.ui.site:'')+'</div>'+
    fld({k:'vnar',l:'Narration',t:'ta',req:1},'');

  for(let i=0;i<n;i++) b+='<tr><td><select class="in" id="va_'+i+'"><option value="">— select —</option>'+
    S.coa.map(a=>'<option value="'+a.code+'">'+esc(a.code+' · '+a.name)+'</option>').join('')+'</select></td>'+
    '<td><input class="in" id="vn_'+i+'"></td>'+

    '<td class="n"><input class="in" type="number" step="0.01" id="vc_'+i+'" oninput="vchSum('+n+')"></td></tr>';
  b+='</tbody><tfoot><tr class="tot"><td colspan="2">Total</td><td class="n" id="vtd">0.00</td><td class="n" id="vtc">0.00</td></tr>'+
   '<tr><td colspan="4" class="hint" id="vdiff" style="padding:7px 12px">A voucher can only be saved when debits equal credits.</td></tr></tfoot></table></div>';
  b+=bdBlock();

   '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveVch(\''+type+'\','+n+')">Post voucher</button>',true);
  bdCheck('vdate');
}
function vchSum(n){ let d=0,c=0;
  for(let i=0;i<n;i++){ d+=+document.getElementById('vd_'+i).value||0; c+=+document.getElementById('vc_'+i).value||0; }
  document.getElementById('vtd').textContent=fmtI(d); document.getElementById('vtc').textContent=fmtI(c);
  const el=document.getElementById('vdiff');
  el.innerHTML=Math.abs(d-c)<0.02&&d>0?'<span style="color:var(--good)">Balanced — ready to post.</span>':
    'Difference '+rs(Math.abs(R2(d-c)))+' — debits must equal credits.';
}
function saveVch(type,n){
  const lines=[];
  for(let i=0;i<n;i++){ const a=document.getElementById('va_'+i).value;
    const d=+document.getElementById('vd_'+i).value||0, c=+document.getElementById('vc_'+i).value||0;
    if(a&&(d||c)) lines.push({ac:a,dr:d,cr:c,note:document.getElementById('vn_'+i).value}); }

  if(!bdGate('vdate')) return;
  try{
    const v=postVoucher({type:type,date:document.getElementById('f_vdate').value,
      narration:document.getElementById('f_vnar').value,site:document.getElementById('f_vsite').value,lines:lines});

function expVch(){

  S.vouchers.forEach(v=>v.lines.forEach(l=>rows.push([v.no,v.date,String(v.enteredOn||'').slice(0,10),v.bdDays||0,v.bdReason||'',

/* ================= LEDGERS ================= */

    v.lines.forEach(l=>{ if(l.ac===code) rows.push({date:v.date,no:v.no,type:VT[v.type]||v.type,

  rows.forEach(r=>{ bal=R2(bal+r.dr-r.cr); r.bal=bal; });

   S.coa.map(x=>'<option value="'+x.code+'"'+(x.code===code?' selected':'')+'>'+esc(x.code+' · '+x.name)+'</option>').join('')+

  h+='<div class="card"><header><h3>'+esc(a.code+' · '+a.name)+'</h3>'+
   '<span class="pill '+(CLS[a.cls].bs==='P'?'a':'s')+'">'+esc(CLS[a.cls].g)+'</span></header><div class="tw"><table class="t">'+
   '<thead><tr><th>Date</th><th>Voucher</th><th>Particulars</th><th class="n">Debit ₹</th><th class="n">Credit ₹</th><th class="n">Balance ₹</th></tr></thead><tbody>'+
   '<tr class="sub"><td colspan="5">Opening balance as on 1 Apr 2026</td><td class="n">'+
     fmtI(Math.abs(a.ob||0))+' '+(a.obSide)+'</td></tr>'+
   rows.map(r=>'<tr><td class="mono">'+dmyS(r.date)+'</td><td class="mono">'+esc(r.no)+'</td>'+
    '<td>'+esc(r.contra)+'<div class="hint">'+esc(r.note||r.nar)+'</div></td>'+
    '<td class="n">'+(r.dr?fmtI(r.dr):'')+'</td><td class="n">'+(r.cr?fmtI(r.cr):'')+'</td>'+
    '<td class="n">'+fmtI(Math.abs(r.bal))+' '+(r.bal>=0?'Dr':'Cr')+'</td></tr>').join('')+
   '<tr class="tot"><td colspan="3">Total movement</td><td class="n">'+fmtI(drT)+'</td><td class="n">'+fmtI(crT)+
     '</td><td class="n">'+fmtI(Math.abs(bal))+' '+(bal>=0?'Dr':'Cr')+'</td></tr></tbody></table></div></div>';
  return h;
}
function expLedger(){
  const code=S.ui.led||'1103', a=acc(code);
  const rows=[['Date','Voucher','Type','Particulars','Note','Debit','Credit']];
  S.vouchers.sort((x,y)=>x.date<y.date?-1:1).forEach(v=>v.lines.forEach(l=>{ if(l.ac===code)

/* ================= TRIAL BALANCE ================= */
function P_tb(){
  const upto=S.ui.tbTo||FY_END;
  const b=balances(upto);
  const rows=S.coa.map(a=>({a:a,x:b[a.code]})).filter(r=>Math.abs(r.x.bal)>0.004||r.x.dr||r.x.cr);
  const dr=R2(rows.reduce((s,r)=>s+(r.x.bal>0?r.x.bal:0),0));
  const cr=R2(rows.reduce((s,r)=>s+(r.x.bal<0?-r.x.bal:0),0));
  let h=pageHead('Trial Balance','As at '+dmy(upto)+' · every account with a balance',
   '<button class="btn" onclick="expTB()">Export CSV</button><button class="btn" onclick="window.print()">Print</button>');
  h+='<div class="card noprint" style="margin-bottom:14px"><div class="body row">'+

   '<div style="margin-left:auto">'+(Math.abs(dr-cr)<0.05?'<span class="pill g">Balanced — '+rs(dr)+'</span>':
     '<span class="pill c">Out by '+rs(Math.abs(R2(dr-cr)))+'</span>')+'</div></div></div>';
  let body='', grp='';
  rows.sort((x,y)=>x.a.code<y.a.code?-1:1).forEach(r=>{
    const g=CLS[r.a.cls].g;
    if(g!==grp){ grp=g; body+='<tr class="sub"><td colspan="5">'+esc(g)+'</td></tr>'; }
    body+='<tr><td class="mono">'+esc(r.a.code)+'</td><td>'+esc(r.a.name)+'</td>'+
     '<td class="n">'+(r.x.dr?fmtI(r.x.dr):'—')+'</td><td class="n">'+(r.x.cr?fmtI(r.x.cr):'—')+'</td>'+
     '<td class="n"><b>'+fmtI(Math.abs(r.x.bal))+' '+(r.x.bal>=0?'Dr':'Cr')+'</b></td></tr>';
  });
  h+='<div class="card"><div class="tw"><table class="t"><thead><tr><th>Code</th><th>Account</th>'+
   '<th class="n">Debit turnover</th><th class="n">Credit turnover</th><th class="n">Closing balance</th></tr></thead><tbody>'+
   body+'<tr class="tot"><td colspan="2">Total</td><td class="n"></td><td class="n"></td>'+
   '<td class="n">'+fmtI(dr)+' Dr / '+fmtI(cr)+' Cr</td></tr></tbody></table></div></div>';
  return h;
}
function expTB(){
  const b=balances(S.ui.tbTo||FY_END);
  dl('KAPL_trial_balance.csv',csv([['Code','Account','Group','Debit','Credit']].concat(
    S.coa.filter(a=>Math.abs(b[a.code].bal)>0.004).map(a=>[a.code,a.name,CLS[a.cls].g,
      b[a.code].bal>0?R2(b[a.code].bal):'',b[a.code].bal<0?R2(-b[a.code].bal):'']))),'text/csv');
  toast('Trial balance exported');
}
</script>

<script>
/* ================= FINANCIAL STATEMENTS (Schedule III) ================= */
function statements(upto){
  const b=balances(upto||FY_END);
  const sum=cls=>R2(S.coa.filter(a=>cls.indexOf(a.cls)>=0).reduce((s,a)=>s+b[a.code].bal,0));
  const lines=cls=>S.coa.filter(a=>cls.indexOf(a.cls)>=0&&Math.abs(b[a.code].bal)>0.004)
    .map(a=>({code:a.code,name:a.name,v:b[a.code].bal}));
  const rev=-sum(['INC']), oi=-sum(['OI']);
  const EMPCODES=['6101','6102','6103','6104','6105'], FINCODES=['6601','6602','6603','6604','6605','6606'];
  const TAXCODES=['6804','6805']; /* current & deferred tax — excluded from operating expenses, shown as tax below the line */
  const bb=c=>b[c]?b[c].bal:0;
  const mat=R2(S.coa.filter(a=>a.cls==='COGS'&&a.code<'5200').reduce((s,a)=>s+bb(a.code),0));
  const emp=R2(S.coa.filter(a=>(a.cls==='COGS'&&a.code>='5200'&&a.code<'5300')||EMPCODES.indexOf(a.code)>=0)
    .reduce((s,a)=>s+bb(a.code),0));
  const subc=R2(S.coa.filter(a=>a.cls==='COGS'&&a.code>='5300'&&a.code<'5500').reduce((s,a)=>s+bb(a.code),0));
  const fin=R2(FINCODES.reduce((s,c)=>s+bb(c),0));
  const dep=sum(['DEP']);
  const othExp=R2(sum(['EXP','OEX'])-R2(EMPCODES.reduce((s,c)=>s+bb(c),0))-fin-R2(TAXCODES.reduce((s,c)=>s+bb(c),0)));
  const totExp=R2(mat+emp+subc+fin+dep+othExp);
  const pbt=R2(rev+oi-totExp);
  const taxPosted=R2(TAXCODES.reduce((s,c)=>s+bb(c),0));
  /* Use the actual provision booked in the ledger; only estimate (unbooked, informational) if none has been posted yet */
  const tax=taxPosted>0.004?taxPosted:R2(Math.max(0,pbt)*0.2517);
  const taxIsEstimate=taxPosted<=0.004;
  const pat=R2(pbt-(taxIsEstimate?0:tax));
  /* balance sheet */
  const eq=R2(-sum(['EQ']));
  const fa=R2(sum(['FA'])+sum(['ACCDEP']));
  const inv=sum(['STOCK']), ar=sum(['AR']), cash=sum(['CASH','BANK']), oca=sum(['OCA']);
  const ap=R2(-sum(['AP'])), ocl=R2(-sum(['OCL'])), ltl=R2(-sum(['LTL']));
  return {b,lines,rev,oi,mat,emp,subc,fin,dep,othExp,totExp,pbt,tax,taxIsEstimate,pat,eq,fa,inv,ar,cash,oca,ap,ocl,ltl,
    assets:R2(fa+inv+ar+cash+oca), liabs:R2(eq+pat+ap+ocl+ltl)};
}

function msmeSummary(){
  const by={};
  S.purchases.forEach(b=>{ const d=msmeDue(b); if(!d) return;
    const due=R2(b.net-(b.paid||0)); if(due<=0.5) return;
    const p=P(b.party);

    by[b.party].v+=due; if(b.date<by[b.party].d) by[b.party].d=b.date;
    if(d<today()) by[b.party].od=true; });
  return Object.values(by);
}

      {l:'Amount paid',n:1,f:r=>fmtI(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).reduce((s,b)=>s+b.taxable,0),0)},
      {l:'TDS',n:1,f:r=>'<b>'+fmtI(S.purchases.filter(b=>b.tds>0&&b.date>=r[1]&&b.date<=r[2]).reduce((s,b)=>s+b.tds,0),0)+'</b>'},
      {l:'Return due',f:r=>'<span class="mono">'+dmyS(r[3])+'</span>'},
      {l:'',f:r=>r[3]<today()?'<span class="pill c">Past due</span>':'<span class="pill g">Upcoming</span>'}],qs)+'</div>';
    h+='<div class="card" style="margin-top:14px"><header><h3>Form 24Q — salary TDS</h3></header>'+
     '<div class="body"><div class="kv"><dt>Section</dt><dd>192 — salary</dd>'+

     '<dt>Employees on roll</dt><dd>'+S.staff.filter(e=>e.status==='Active').length+'</dd>'+
     '<dt>Form 16 due</dt><dd>15 June 2027 for FY 2026-27</dd></div></div></div>';
  }
  return h;
}

/* ================= CARRYING THE BOOKS BETWEEN DEVICES =================
   The books live in the browser on whichever machine you opened them on, so the
   Mac copy, the Windows copy and the online copy are three separate sets. One
   backup file moves the whole thing — every voucher, bill, master, policy and
   the audit trail. The only real danger is restoring an older file over newer
   work, so the backup is stamped with the device and the moment it was taken,
   and a restore that would move the books backwards says so before it runs. */
function guessDevice(){
  let p=''; try{ p=navigator.userAgentData&&navigator.userAgentData.platform||navigator.platform||''; }catch(e){}
  const online=location.protocol!=='file:';
  if(/Win/i.test(p)) return online?'Windows (online)':'Windows PC';
  if(/Mac/i.test(p)) return online?'Mac (online)':'Mac';
  return online?'Online copy':'This device';
}
const syncStamp=()=>{ S.sync=S.sync||{}; return S.sync; };
function deviceForm(){
  openForm('Name this device',[{k:'device',l:'What should this copy be called?',t:'text',req:1,w:2,
    hint:'It is written into every backup this copy takes, so you can tell the Mac file from the Windows one at a glance.'}],
    {device:syncStamp().device||guessDevice()},o=>{
      const was=S.sync.device; S.sync.device=o.device.trim();
      logAudit('U','Sync','Device','Renamed from “'+(was||'unnamed')+'” to “'+S.sync.device+'”');
    });
}
function backupJSON(){
  const st=syncStamp();
  st.device=st.device||guessDevice();
  st.savedAt=new Date().toISOString();
  const name='KAPL_Nirman_Ledger_'+String(st.device).replace(/[^A-Za-z0-9]+/g,'_')+'_'+today()+'.json';
  dl(name,JSON.stringify(S,null,2),'application/json');
  logAudit('C','Backup','—','Backup taken on '+st.device+' — '+S.vouchers.length+' vouchers');
  save(); render(); toast('Backup taken — '+S.vouchers.length+' vouchers');
}
function restoreJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const j=JSON.parse(rd.result);
    if(!j.company||!j.coa) throw new Error('This file is not a Nirman Ledger backup');
    const inSync=j.sync||{}, here=syncStamp();
    const inCount=(j.vouchers||[]).length, hereCount=S.vouchers.length;
    let msg='Restore these books into this copy?\n\n'+
      'Backup taken on: '+(inSync.device||'unnamed device')+
      (inSync.savedAt?'\nTaken at: '+dmyS(inSync.savedAt.slice(0,10))+' '+inSync.savedAt.slice(11,16):'')+
      '\nVouchers in the file: '+inCount+
      '\n\nThis copy ('+(here.device||guessDevice())+') currently holds '+hereCount+' vouchers'+
      (here.savedAt?', last backed up '+dmyS(here.savedAt.slice(0,10)):'')+'.';
    /* the backwards-restore guard — the one way to lose work in this design */
    const goingBack=(inSync.savedAt&&here.savedAt&&inSync.savedAt<here.savedAt)||inCount<hereCount;
    if(goingBack) msg='⚠ THIS FILE IS OLDER THAN WHAT IS IN THIS COPY.\n\n'+msg+
      '\n\nGoing ahead replaces '+hereCount+' vouchers with '+inCount+'. Anything entered here since that backup is gone.\n'+
      'If this copy is the newer one, cancel and take a backup here instead.';
    if(!confirm(msg)) return;
    const keepDevice=here.device||guessDevice();
    S=j;
    S.sync=S.sync||{};
    S.sync.device=keepDevice;                       /* this machine keeps its own name */
    S.sync.restoredAt=new Date().toISOString();
    S.sync.from=inSync.device||'unnamed device';
    logAudit('C','Backup','—','Restored onto '+keepDevice+' from a backup taken on '+S.sync.from+
      ' — '+hereCount+' vouchers replaced by '+inCount);
    save(); render();
    toast('Books restored from '+S.sync.from+' — '+inCount+' vouchers');
  }catch(e){ toast('Could not read backup: '+e.message,true); } };
  rd.readAsText(f);
}
function resetBooks(){
  if(!confirm('This clears all data in this browser and reloads the FY 2026-27 opening demo books. Continue?')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=seed(); demo(); logAudit('C','System','—','Books reset by user to opening demo data'); save(); render();
  toast('Books reset');
}
</script>

  const a=seriesAudit(pfx);

  modal('Re-sequence the '+pfx+' series',
   '<div class="warnbox" style="margin-bottom:12px"><b>Read this first</b><span>'+
   'Every '+esc(SER[pfx]||pfx)+' will be renumbered 001 upward in document-date order. '+
   'That is the right thing to do for an internal series, or before anything has left the office. '+
   'It is the wrong thing to do once invoices have gone to a client or a bill has been quoted in a payment advice — '+
   'a GST invoice number, once issued, should not change. Every number that moves is written to the audit trail and '+
   'cannot be removed from it.</span></div>'+
   '<div class="kv"><dt>Documents</dt><dd>'+a.count+'</dd><dt>Out of date order</dt><dd>'+a.outOfOrder+'</dd>'+
   '<dt>Lettered inserts</dt><dd>'+a.inserts+'</dd></div>'+
   fld({k:'rsWhy',l:'Reason for re-numbering',t:'text',w:2,hint:'Recorded against every number that moves.'},''),
   '<button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn dngr" onclick="doReseq(\''+pfx+'\')">Re-sequence '+a.count+' documents</button>');

function doReseq(pfx){

function postLoan(id){
  const l=S.loans.find(x=>x.id===id); if(!l) return;
  if(l.vch){ toast('Already posted as '+l.vch,true); return; }
  const v=postVoucher({type:'RV',date:l.from,narration:'Loan received — '+l.lender+' @ '+l.rate+'% p.a.',
    site:'S4',lines:[{ac:l.bankAc||'1103',dr:+l.amount,cr:0,note:l.lender},
                     {ac:l.ac||'2404',dr:0,cr:+l.amount,note:'Loan liability'}]});
  l.vch=v.no; logAudit('C','Borrowing',l.id,'Receipt posted as '+v.no);
  save(); render(); toast('Loan receipt posted as '+v.no+' — this is a liability, not income');
}
function accrueInterest(id){
  const l=S.loans.find(x=>x.id===id); if(!l) return;
  const i=loanInterest(l);
  if(i.amt<1){ toast('No interest has run yet'); return; }
  if(l.accrued){ toast('Interest already accrued for this year',true); return; }
  const tds=l.tdsSec?R2(i.amt*10/100):0;
  const upto=(l.to&&l.to<FY_END)?l.to:(today()<FY_END?today():FY_END);
  const lines=[{ac:l.purpose==='capital'?'1612':'6605',dr:i.amt,cr:0,
    note:(l.purpose==='capital'?'Interest capitalised to CWIP':'Interest on '+l.lender)}];
  if(tds) lines.push({ac:'2206',dr:0,cr:tds,note:'TDS u/s 194A @ 10%'});
  lines.push({ac:'2303',dr:0,cr:R2(i.amt-tds),note:'Interest payable — '+l.lender});
  const v=postVoucher({type:'JV',date:upto,site:'S4',
    narration:'Interest '+dmyS(l.from)+' to '+dmyS(upto)+' on '+l.lender+' @ '+l.rate+'% — '+i.days+' days'+
      (l.purpose==='capital'?' (capitalised, asset not yet in use)':''),lines:lines});
  l.accrued=v.no;
  save(); render();
  toast('Interest '+rs(i.amt)+' posted as '+v.no+(tds?' · TDS '+rs(tds)+' held':''));
}

   'taxed at the penal rate — which is a far larger exposure than the tax on the year’s profit. Keep the lender’s PAN, their '+
   'confirmation, a sanction letter or board resolution, and the bank advice.</span></div>'+
   '<div class="warnbox" style="margin-bottom:10px"><b>Deduct the TDS on the interest</b><span>'+
   'Interest to a resident lender ordinarily carries TDS at 10%. If it is not deducted and deposited, a share of the interest '+
   'is disallowed and the deduction you were counting on shrinks — so the tax goes up, not down. Accrue interest through the '+
   'button above and the TDS is held back automatically.</span></div>'+
   '<div class="warnbox" style="margin-bottom:10px"><b>Interest on an unfinished asset is not this year’s expense</b><span>'+
   'If the money is funding a building or plant that has not yet been put to use, the interest for that period is added to the '+
   'cost of the asset rather than deducted now. Mark the borrowing as such above and it is kept out of the computation, which '+
   'raises the taxable profit — the honest direction.</span></div>'+
   '<div class="warnbox"><b>One company’s margin is not another’s</b><span>'+
   'A margin lifted from a different entity’s return is a benchmark for a forecast, nothing more. Where the two businesses are '+
   'separate entities, their turnover and profit belong in separate computations — putting one company’s activity into the '+
   'other’s return is the kind of thing that unravels badly on scrutiny.</span></div>'+
   '<p class="hint" style="margin-top:12px;max-width:88ch">This page computes; it does not certify. The rate, the treatment of '+
   'the borrowing and the final challan figure should be confirmed by your chartered accountant against the actual '+
   'April-onward trial balance before anything is paid.</p>'+
   '</div></div>';
  return h;
}
function basisOpt(v,title,body){
  const on=S.tax.basis===v;
  return '<button class="btn" style="text-align:left;display:block;width:100%;margin-bottom:9px;padding:11px 13px;white-space:normal;'+
   (on?'border-color:var(--accent);background:var(--accent-soft)':'')+'" onclick="S.tax.basis=\''+v+'\';save();render()">'+
   '<b style="font-family:var(--cond);font-size:14px">'+(on?'● ':'○ ')+esc(title)+'</b>'+
   '<div class="hint" style="margin-top:4px">'+esc(body)+'</div></button>';
}

const PAGES={
 dash:P_dash, mlog:P_mlog, trips:P_trips, muster:P_muster, stock:P_stock,
 sales:P_sales, purch:P_purch,
 vch:P_vch, daybook:P_daybook, ledger:P_ledger, tb:P_tb, fs:P_fs,
 gst:P_gst, tds:P_tds, tax:P_tax, pay:P_pay, comp:P_comp,
 m_sites:P_m_sites, m_parties:P_m_parties, m_labour:P_m_labour, m_machines:P_m_machines,
 m_items:P_m_items, m_coa:P_m_coa,
 bdate:P_bdate, audit:P_audit, settings:P_settings
};
function render(){
  renderNav();
  $('#crumb').innerHTML=esc(TITLES[S.ui.page||'dash']||'Dashboard')+
    (S.ui.site!=='ALL'?' <em>&middot; '+esc(scode(S.ui.site))+'</em>':'');
  const fn=PAGES[S.ui.page]||P_dash;
  let html;
  try{ html=fn(); }
  catch(e){ html='<div class="card"><div class="body"><b style="color:var(--crit)">Something went wrong rendering this page.</b>'+
    '<p class="hint">'+esc(e.message)+'</p><button class="btn" onclick="go(\'dash\')">Back to dashboard</button></div></div>'; }
  $('#view').innerHTML=html;
  const sel=$('#siteSel');
  if(sel){ sel.innerHTML='<option value="ALL">All sites</option>'+
    S.sites.map(s=>'<option value="'+s.id+'"'+(S.ui.site===s.id?' selected':'')+'>'+esc(s.code)+'</option>').join(''); }
  $('#gstChip').textContent=S.company.gstin;
}
/* Does this browser actually let the page keep data here? Opening a file from
   a network share, or from a browser with site data switched off, can refuse. */
function storageOK(){
  try{ const k='__kapl_probe__'; localStorage.setItem(k,'1');
    const ok=localStorage.getItem(k)==='1'; localStorage.removeItem(k); return ok; }
  catch(e){ return false; }
}
function warnNoStorage(where){
  const el=document.getElementById('nostore'); if(!el) return;
  el.style.display='block';
  el.innerHTML='<b>This browser will not save anything on this page.</b> '+
    'Whatever you enter now is lost the moment you close the tab. It usually means the file was opened '+
    'from a network drive or from inside a zip — copy the KAPL-Offline folder onto the computer\u2019s own '+
    'disk (Desktop or Documents) and open it from there. '+where;
}
function boot(){
  let t='light';
  try{ t=localStorage.getItem('kapl_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  const ic=document.getElementById('themeIc'); if(ic) ic.textContent=t==='dark'?'☾':'☀';
  const bm=document.getElementById('brandMark'); if(bm) bm.innerHTML=LOGO(38);
  load();
  if(!S.ui.page) S.ui.page='dash';
  render();
  if(!storageOK()) warnNoStorage('Until then, use Company &amp; Backup \u203a Download backup after every session.');
}
boot();
</script>
